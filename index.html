        ${bkRows}
        ${S.backupFail ? `<div class="warn">${ms('warning')}Bugünün otomatik yedeği alınamadı; tarayıcı deposu dolu olabilir. Elle yedek indirin.</div>` : ''}
      </section>
      <section class="set-sec">
        <h3>Arşiv</h3>
        <p class="set-p">${ARCHIVE_DAYS} günden önce tamamlanmış görevler listelerden kaldırılıp burada saklanır; silinmez. Arşiv aramada da çıkar.</p>
        ${S.archive.length ? S.archive.slice().sort((a, b) => doneAt(b) - doneAt(a)).slice(0, 50).map((t) => `<div class="bk-row"><div class="bk-a"><div class="bk-d">${esc(t.title)}</div>
          <div class="bk-s">${esc(new Date(doneAt(t)).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }))} tamamlandı</div></div>
          <button class="btn-s sm" data-act="unarchive" data-id="${t.id}">Geri getir</button></div>`).join('')
          + (S.archive.length > 50 ? `<div class="set-note">Son 50 görev gösteriliyor (toplam ${S.archive.length}). Diğerlerini aramadan bulabilirsiniz.</div>` : '')
          : '<div class="set-note">Arşiv boş.</div>'}
      </section>
      ${rec.length ? `<section class="set-sec"><h3>Kurtarma kopyaları</h3>
        <p class="set-p">Okunamayan (bozuk) veriler silinmeden burada saklanıyor. İndirip inceleyebilir veya artık gerekmiyorsa silebilirsiniz.</p>${recRows}</section>` : ''}
      <section class="set-sec">
        <h3>Klavye kısayolları</h3>
        <div class="keys">${[
          ['Ctrl+N', 'Yeni görev'], ['/', 'Ara'], ['Ctrl+B', 'Kenar çubuğunu daralt / aç'], ['Esc', 'Pencereyi veya paneli kapat'],
          ['1 – 5', 'Bugün · Planlanan · Önemli · Tüm görevler · Notlar'], ['↑ ↓', 'Görev seç'], ['Enter', 'Seçili görevi aç'],
          ['Boşluk', 'Seçili görevi tamamla'], ['Delete', 'Seçili görevi sil'], ['Ctrl+Enter', 'Notu kaydet / düzenlemeyi bitir']
        ].map((k) => `<div class="key-row"><span class="kbd">${k[0]}</span><span>${k[1]}</span></div>`).join('')}</div>
      </section>
    </div></div>`;
  }

  // Ayarlar'daki açma/kapama satırı
  function toggleRow(act, on, title, desc) {
    return `<button class="set-toggle" data-act="${act}" role="switch" aria-checked="${on}">
      <span class="set-tx"><span class="a">${title}</span><span class="b">${desc}</span></span>
      <span class="sw${on ? ' on' : ''}"><span></span></span></button>`;
  }

  function globalHTML() {
    let html = bannersHTML();
    if (S.settingsOpen) html += settingsHTML();
    if (S.confirm) html += confirmHTML();
    if (S.toast) html += `<div class="toast"><span>${esc(S.toast.text)}</span>${S.toast.undo ? '<button data-act="undo">Geri al</button>' : ''}</div>`;
    return html;
  }

  // ---------- VİZYON PANOSU: GÖRÜNÜM (Aşama 2: stilsiz iskelet) ----------
  // Mantık VizyonMantik'te; burada yalnızca HTML üretilir ve olaylar mantık operasyonlarına bağlanır.
  const VZ = VizyonMantik.olustur();
  const VZ_BIRIM_PX = 20;   // birimin piksel karşılığı (4.2'de 20px seçildi); değiştirmek kayıtlı veriyi bozmaz
  const VZ_ALAN_PAYI_PX = 120;   // en alttaki kutucuğun altında bırakılan boşluk; kutucuk buna yaklaşınca alan uzar
  const VZ_BLOK_AD = { text: 'Yazı', list: 'Liste', table: 'Tablo', image: 'Resim' };
  S.vzBoard = null;

  // ----- Vizyon: kalıcılık (localStorage `planim.vizyon.v1`; mevcut store() yöntemi) -----
  (function vzDepodanYukle() {
    let ham;
    try { ham = PlanizeDepo.al(KEY_VIZYON); } catch (e) { return; }   // okunamadı: loadAll zaten yazmayı kilitledi
    if (ham == null) return;
    let obj = null;
    try { obj = JSON.parse(ham); } catch (e) { obj = null; }
    if (obj && VZ.yukle(obj).ok) return;
    // Bozuk veri sessizce boş sayılmaz: kurtarma kopyasına alınır (diğer veriler gibi)
    corruptFound.push({ key: KEY_VIZYON, label: 'Vizyon Panosu', raw: ham });
    S.corrupt = S.corrupt.concat(['Vizyon Panosu']); S.corruptNotice = true;
    const prev = readArr(KEY_RECOVERY);
    const rec = (prev.ok ? prev.value : []).concat([{ at: Date.now(), key: KEY_VIZYON, label: 'Vizyon Panosu', raw: ham }]).slice(-10);
    try { PlanizeDepo.koy(KEY_RECOVERY, JSON.stringify(rec)); } catch (e) { S.writeBlocked = true; S.blockReason = 'recovery'; }
  })();
  let vzKayitZamani = null;
  function vzKaydet() { clearTimeout(vzKayitZamani); vzKayitZamani = null; if (!store(KEY_VIZYON, VZ.anlik())) render(); }
  function vzFlush() { if (vzKayitZamani) vzKaydet(); }
  VZ.dinle((o) => { if (o.tur === 'yukle') return; clearTimeout(vzKayitZamani); vzKayitZamani = setTimeout(vzKaydet, 400); });   // yazarken her tuşta değil, bırakınca
  // Kullanılmayan (yetim) resimleri bir kez temizle; veri okunamadı/bozuksa hiçbir şey silinmez
  setTimeout(() => {
    if (S.writeBlocked || corruptFound.length) return;
    VizyonResim.temizle(VZ.kullanilanResimIdleri()).catch(() => {});
  }, 3000);
  const vzYetimSil = (r) => { if (r && r.silinenResimler) r.silinenResimler.forEach((id) => VizyonResim.sil(id)); };

  function vzResimYok(img) {
    const s = document.createElement('span');
    if (img.classList.contains('vz-kucuk-resim')) { s.className = 'vz-kucuk-resim yok'; img.replaceWith(s); return; }   // menü önizlemesi: yalnızca boş kutu
    s.textContent = '[Resim bulunamadı: başka cihazdan henüz gelmemiş olabilir. Yedekler resimleri içermez]';
    img.replaceWith(s);
  }
  // Resimler IndexedDB'den asenkron gelir; çizimden sonra adresleri bağlanır
  function vzResimleriYukle() {
    vzEl.querySelectorAll('img[data-resim]').forEach((img) => {
      const id = img.dataset.resim;
      const c = VizyonResim.onbellekte(id);
      img.addEventListener('load', () => vzSigdir(), { once: true });   // resim yüklenince kutucuk içeriğe göre büyür
      if (c) { img.src = c; return; }
      if (c === null) { vzResimYok(img); return; }
      VizyonResim.url(id).then((u) => { if (!img.isConnected) return; if (u) img.src = u; else vzResimYok(img); });
    });
  }

  function vzAktifPano() {
    const l = VZ.getBoards();
    return l.find((b) => b.id === S.vzBoard) || l[0] || null;
  }

  // Resim görünümü: Sığdır/Doldur taban boyutu verir (object-fit); ölçek ve kaydırma çerçeve içinde dönüşümle uygulanır (orijinal dosya değişmez)
  const vzResimStil = (b) => `object-fit:${b.fit};transform:translate(${b.posX}%,${b.posY}%) scale(${b.scale / 100})`;
  function vzKirpAracHTML(t, b) {
    const a = `data-tid="${t.id}" data-bid="${b.id}"`; const O = VizyonMantik.RESIM_OLCEK;
    return `<div class="vz-kirp-arac" role="group" aria-label="Kırpma araçları">
        <div class="vz-olcek-sat"><input type="range" class="vz-olcek-aralik" min="${O.en_az}" max="${O.en_cok}" step="1" value="${b.scale}" ${a} data-in="vzResimOlcek" aria-label="Yakınlaştırma yüzdesi"><span class="vz-kirp-yuzde">${b.scale}%</span></div>
        <div class="vz-kirp-dugmeler"><button type="button" class="vz-dugme" ${a} data-act="vzKirpSifirla">Sıfırla</button><button type="button" class="vz-dugme" ${a} data-act="vzKirpVazgec">Vazgeç</button><button type="button" class="vz-dugme birincil" ${a} data-act="vzKirpBitti" data-fk="vz-kirp-bitti">Bitti</button></div>
      </div>`;
  }
  function vzBlokHTML(t, b) {
    const a = `data-tid="${t.id}" data-bid="${b.id}"`;
    const kl = t.lock === 'full';                              // tam kilit: içerik yalnızca okunur
    const ro = kl ? ' readonly' : '';
    let g = '';
    if (b.type === 'text') {
      g = `<textarea class="vz-yazi" rows="2" placeholder="Yazı ekle"${ro} ${a} data-in="vzText" aria-label="Yazı">${esc(b.text)}</textarea>`;
    } else if (b.type === 'list') {
      g = `<div class="vz-liste">${b.items.map((o) => `<div class="vz-liste-oge${o.done ? ' done' : ''}">
          <button class="vz-onay${o.done ? ' on' : ''}${S.vzPop === o.id ? ' pop' : ''}" role="checkbox" aria-checked="${!!o.done}" aria-label="İşaretle"${kl ? ' aria-disabled="true" tabindex="-1"' : ''} ${a} data-iid="${o.id}" data-act="vzListToggle">${vzIkon('tik')}</button>
          <input class="vz-liste-yazi" value="${esc(o.text)}"${ro} ${a} data-iid="${o.id}" data-in="vzListText" aria-label="Madde">
          <button class="vz-ik vz-oge-sil" title="Maddeyi sil" aria-label="Maddeyi sil" ${a} data-iid="${o.id}" data-act="vzListDel">${vzIkon('kapat')}</button></div>`).join('')}
        <div class="vz-liste-yeni">${vzIkon('arti')}<input placeholder="Yeni madde" ${a} data-fk="vz-liste-${b.id}" data-key="vzListAdd" aria-label="Yeni madde"></div></div>`;
    } else if (b.type === 'table') {
      const toplam = b.colWidths.reduce((x, y) => x + y, 0);
      const f = S.vzHucre && S.vzHucre.bid === b.id ? S.vzHucre : null;
      const hz = b.align[f && f.c < b.align.length ? f.c : 0];
      const ar = (ik, ad, act, ek, on) => `<button class="vz-ik${on ? ' on' : ''}" title="${ad}" aria-label="${ad}" ${a} data-act="${act}" ${ek || ''}>${vzIkon(ik)}</button>`;
      g = `<table class="vz-tablo"><colgroup>${b.colWidths.map((w) => `<col style="width:${(w / toplam * 100).toFixed(3)}%">`).join('')}</colgroup>${b.rows.map((r, ri) => `<tr>${r.map((c, ci) => {
        const tag = b.headerRow && ri === 0 ? 'th' : 'td';
        const tut = ri === 0 && ci < r.length - 1 ? `<span class="vz-sutun-tut" ${a} data-vz-sut="${ci}" title="Sütun genişliği"></span>` : '';
        return `<${tag}><input class="vz-hucre" style="text-align:${b.align[ci]}" value="${esc(c)}"${ro} ${a} data-r="${ri}" data-c="${ci}" data-fk="vzh-${b.id}-${ri}-${ci}" data-in="vzCell" aria-label="Hücre">${tut}</${tag}>`;
      }).join('')}</tr>`).join('')}</table>
        <div class="vz-tablo-arac">
          ${ar('satirEkle', 'Satır ekle', 'vzTblRow')}${ar('satirSil', 'Satırı sil', 'vzTblRowDel')}${ar('sutunEkle', 'Sütun ekle', 'vzTblCol')}${ar('sutunSil', 'Sütunu sil', 'vzTblColDel')}
          <span class="vz-ayir-dikey"></span>${ar('baslik', 'Başlık satırı', 'vzTblHead', '', b.headerRow)}
          <span class="vz-ayir-dikey"></span>${ar('hizaSol', 'Sola hizala', 'vzTblHiza', 'data-v="left"', hz === 'left')}${ar('hizaOrta', 'Ortala', 'vzTblHiza', 'data-v="center"', hz === 'center')}${ar('hizaSag', 'Sağa hizala', 'vzTblHiza', 'data-v="right"', hz === 'right')}
        </div>`;
    } else if (b.type === 'image') {
      // 4.4: sığdır (kırpma yok), tıklanabilir boş alan, resmin altında soluk alt yazı
      // Resmi değiştirme yalnızca kutucuğun üç nokta menüsünde (4c); resmin üzerinde düğme yok
      const dosya = `<input type="file" accept="image/*" hidden ${a} data-ch="vzResimSec">`;
      const kirp = !!(S.vzKirp && S.vzKirp.tid === t.id && S.vzKirp.bid === b.id);   // kırpma modu: çerçeve ve kutucuk sabit, resim sürüklenip yakınlaştırılır
      g = (b.src
        ? `<div class="vz-resim-alan${kirp ? ' kirpiyor' : ''}" ${a}><img class="vz-resim" style="${vzResimStil(b)}" draggable="false" data-resim="${esc(b.src)}" alt="${esc(b.caption || '')}">${kirp ? vzKirpAracHTML(t, b) : ''}</div>`
        : (kl ? `<div class="vz-resim-bos pasif" title="Kutucuk kilitli">${vzIkon('resim')}<span>Resim seç</span></div>` : `<label class="vz-resim-bos">${vzIkon('resim')}<span>Resim seç</span>${dosya}</label>`))
        // Alt yazı satırı yalnızca doluysa ya da eklenirken görünür; boşken yer kaplamaz (resim o alanı da kullanır)
        + ((b.caption || S.vzAltYazi === b.id) ? `<input class="vz-altyazi" placeholder="Alt yazı ekle" value="${esc(b.caption || '')}"${ro} ${a} data-fk="vz-altyazi-${b.id}" data-in="vzCaption" aria-label="Alt yazı">` : '');
    }
    // 4.6: blok başlığı yok; silme ikonu blok üzerine gelince görünür
    return `<div class="vz-blok${b.type === 'image' ? ' vz-blok-resim' : ''}"><button class="vz-ik vz-blok-sil" title="Bloğu sil" aria-label="Bloğu sil" ${a} data-act="vzBlokSil">${vzIkon('sil')}</button>${g}</div>`;
  }

  // ----- Vizyon: kutucuk görünümü (look) -----
  // Tüm sabitler burada: değer değiştirmek için yalnızca bu bloğu düzenlemek yeter (veri yalnızca adları saklar).
  const VZ_LOOK = VizyonMantik.LOOK;
  const VZ_BASLIK_PX = { s: 12, m: 14, l: 18, xl: 24 };      // başlık yazı boyutu (M = eski varsayılan 14)
  const VZ_IKON_PX = { s: 14, m: 18, l: 24 };                // başlık ikonu boyutu
  const VZ_BASLIK_AD = { none: 'Yok', s: 'S', m: 'M', l: 'L', xl: 'XL' };
  const VZ_STIL_AD = { plain: 'Sade', clean: 'Çizgisiz', band: 'Bantlı', frame: 'Çerçeveli', dashed: 'Noktalı' };
  const VZ_IKON_AD = { yildiz: 'Yıldız', kalp: 'Kalp', ev: 'Ev', bayrak: 'Bayrak', hedef: 'Hedef', ucak: 'Uçak', kitap: 'Kitap', gunes: 'Güneş' };
  const VZ_KONUM_AD = { left: 'Başlığın solunda', right: 'Başlığın sağında', top: 'Başlığın üstünde, ortada', corner: 'Kutucuğun sol üst köşesinde' };
  const VZ_KONUM_KISA = { left: 'Sol', right: 'Sağ', top: 'Üst', corner: 'Köşe' };
  // Rengin neyi boyadığı stile bağlıdır: Sade/Çizgisiz = zemin, Bantlı = başlık bandı, Çerçeveli/Noktalı = çerçeve ve çizgiler
  const VZ_RENK_ROL = { plain: 'Zemin rengi', clean: 'Zemin rengi', band: 'Bant rengi', frame: 'Çerçeve rengi', dashed: 'Çerçeve rengi' };
  const VZ_VARSAYILAN_RENK = { plain: 'kahve-300', clean: 'kahve-300', band: 'kahve-300', frame: 'kahve-500', dashed: 'kahve-500' };
  const vzEtkinRenk = (L) => L.color || VZ_VARSAYILAN_RENK[L.style];
  const vzRenkAd = (r) => 'Kahve ' + r.replace('kahve-', '');
  // Okunabilirlik: zemin rengine göre yazı rengi, --kahve-950 ile --kahve-50 arasından kontrastı yüksek olan seçilir (yeni renk yok)
  const vzOkunurOnbellek = {};
  function vzOkunur(renk) {
    if (vzOkunurOnbellek[renk]) return vzOkunurOnbellek[renk];
    const kok = getComputedStyle(document.documentElement);
    const lum = (ad) => {
      const h = kok.getPropertyValue('--' + ad).trim().replace('#', '');
      const k = [0, 2, 4].map((i) => { const c = parseInt(h.substr(i, 2), 16) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
      return 0.2126 * k[0] + 0.7152 * k[1] + 0.0722 * k[2];
    };
    const oran = (a, b) => (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
    const L = lum(renk);
    const sonuc = oran(L, lum('kahve-950')) >= oran(L, lum('kahve-50')) ? 'kahve-950' : 'kahve-50';
    if (isFinite(L)) vzOkunurOnbellek[renk] = sonuc;
    return sonuc;
  }
  // Stile göre rengin uygulandığı yer: tüm kutucuk, yalnızca bant ya da yalnızca çerçeve çizgisi
  function vzGorunumStil(L) {
    const renk = vzEtkinRenk(L);
    const o = { artikSinif: '', artikStil: '', ustSinif: '', ustStil: '' };
    const dolgu = `--k-bg:var(--${renk});--k-fg:var(--${vzOkunur(renk)});`;
    if (L.style === 'plain' || L.style === 'clean') { if (renk !== 'kahve-300') { o.artikSinif = ' k-ozel'; o.artikStil = dolgu; } }
    else if (L.style === 'band') { if (renk !== 'kahve-300') { o.ustSinif = ' k-ozel'; o.ustStil = dolgu; } }
    else o.artikStil = `--k-line:var(--${renk});`;
    return o;
  }

  function vzFircaHTML(t) {
    const L = t.look; const tid = `data-tid="${t.id}"`;
    const etkin = vzEtkinRenk(L);
    const d = (k, v, ic, sinif, ek) => `<button type="button" class="${sinif}" ${tid} data-act="vzLook" data-k="${k}" data-v="${v}" data-fk="vz-fp-${k}-${v}" ${ek || ''}>${ic}</button>`;
    const renkler = VZ_LOOK.renkler.map((r) => {
      const on = r === etkin;
      return d('renk', r, on ? vzIkon('tik') : '', 'vz-renk' + (on ? ' on' : ''), `style="background:var(--${r});color:var(--${vzOkunur(r)})" role="radio" aria-checked="${on}" aria-label="${vzRenkAd(r)}" title="${vzRenkAd(r)}"`);
    }).join('');
    const seg = (k, liste, secili, ad, baslik) => `<div class="vz-seg" role="radiogroup" aria-label="${baslik}">${liste.map((v) => d(k, v, ad(v), 'vz-seg-d' + (v === secili ? ' on' : ''), `role="radio" aria-checked="${v === secili}"`)).join('')}</div>`;
    const stiller = VZ_LOOK.stiller.map((s) => d('stil', s, `<span class="vz-stmini ${s}"></span><span class="vz-stad">${VZ_STIL_AD[s]}</span>`, 'vz-stil' + (s === L.style ? ' on' : ''), `role="radio" aria-checked="${s === L.style}" title="${VZ_STIL_AD[s]}"`)).join('');
    const ikonlar = [d('ikon', 'yok', 'Yok', 'vz-ikon-d vz-ikon-yok' + (!L.icon ? ' on' : ''), `role="radio" aria-checked="${!L.icon}" aria-label="İkon yok"`)]
      .concat(VZ_LOOK.ikonlar.map((i) => d('ikon', i, vzIkon(i), 'vz-ikon-d' + (L.icon === i ? ' on' : ''), `role="radio" aria-checked="${L.icon === i}" aria-label="${VZ_IKON_AD[i]}" title="${VZ_IKON_AD[i]}"`))).join('');
    const konumlar = VZ_LOOK.konumlar.map((p) => d('konum', p, `<span class="vz-pg ${p}"><b></b><i></i></span><span class="vz-stad">${VZ_KONUM_KISA[p]}</span>`, 'vz-stil vz-konum' + (L.iconPos === p ? ' on' : ''), `role="radio" aria-checked="${L.iconPos === p}" title="${VZ_KONUM_AD[p]}" aria-label="${VZ_KONUM_AD[p]}"`)).join('');
    return `<div class="menu vz-firca-panel" role="dialog" aria-label="Kutucuk görünümü">
        <section><h4>Renk <span class="vz-ipucu">${VZ_RENK_ROL[L.style]}</span></h4><div class="vz-renk-izgara" role="radiogroup" aria-label="Renk">${renkler}</div></section>
        <section><h4>Başlık boyutu</h4>${seg('baslik', VZ_LOOK.basliklar, L.titleSize, (v) => VZ_BASLIK_AD[v], 'Başlık boyutu')}</section>
        <section><h4>Stil</h4><div class="vz-stil-izgara" role="radiogroup" aria-label="Stil">${stiller}</div></section>
        <section><h4>İkon</h4><div class="vz-ikon-izgara" role="radiogroup" aria-label="İkon">${ikonlar}</div>
          ${L.icon ? `<h4 class="vz-alt-bas">Konum</h4><div class="vz-konum-izgara" role="radiogroup" aria-label="İkon konumu">${konumlar}</div>
          <h4 class="vz-alt-bas">Boyut</h4>${seg('boyut', VZ_LOOK.boyutlar, L.iconSize, (v) => v.toUpperCase(), 'İkon boyutu')}` : ''}</section>
      </div>`;
  }

  // Resimli kutucuk için üç işlem aynı kalıbı izler: tek resimde doğrudan, çok resimde önizlemeli alt menü
  //   degistir: Resmi değiştir (içerik; yalnızca tam kilitte pasif) · ayar: Resim ayarları, kirp: Kırp (görünüm; her kilitte pasif)
  const VZ_RESIM_ISLEM = {
    degistir: { ad: 'Resmi değiştir', act: 'vzResimDegistir', ikon: 'resim', kapali: (t) => t.lock === 'full' },
    altyazi: { ad: 'Alt yazı ekle', act: 'vzAltYaziEkle', ikon: 'yazi', kapali: (t) => t.lock === 'full', yalnizca: (b) => !b.caption && !(S.vzAltYazi === b.id) },   // içerik; yalnızca alt yazısı olmayan resimler için listelenir
    ayar: { ad: 'Resim ayarları', act: 'vzResimAyar', ikon: 'ayar', kapali: (t) => t.lock !== 'none' },
    kirp: { ad: 'Kırp', act: 'vzKirpBasla', ikon: 'kirp', kapali: (t) => t.lock !== 'none' }
  };
  function vzMenuHTML(t) {
    const tid = `data-tid="${t.id}"`;
    const resimler = t.blocks.filter((b) => b.type === 'image' && b.src);   // resim yoksa bu üç madde hiç görünmez
    const altMod = S.vzAcik && S.vzAcik.alt;
    // Kilitliyken pasif (soluk) görünür, üzerine gelince ipucu çıkar
    const pasif = (kapali) => (kapali ? ' vz-pasif" aria-disabled="true" title="Kutucuk kilitli' : '');
    const resimMadde = resimler.length ? Object.keys(VZ_RESIM_ISLEM).map((m) => {
      const o = VZ_RESIM_ISLEM[m]; const kapali = o.kapali(t);
      const liste = resimler.map((b, i) => ({ b, i })).filter((x) => !o.yalnizca || o.yalnizca(x.b));   // satır etiketi her zaman resmin gerçek sırasıyla
      if (!liste.length) return '';
      if (liste.length === 1) return `<button class="mi${pasif(kapali)}" role="menuitem" ${tid} data-bid="${liste[0].b.id}" data-act="${o.act}">${vzIkon(o.ikon)}<span class="tx">${o.ad}</span></button>`;
      const acik = altMod === m && !kapali;
      return `<div class="vz-alt-kap"><button class="mi${pasif(kapali)}" role="menuitem" ${tid} data-m="${m}" data-act="vzResimAlt" aria-haspopup="menu" aria-expanded="${acik}">${vzIkon(o.ikon)}<span class="tx">${o.ad}</span><span class="vz-ok">›</span></button>${acik ? `<div class="menu vz-alt-menu" role="menu">${liste.map((x, j) => `<button class="mi" role="menuitem" ${tid} data-bid="${x.b.id}" data-act="${o.act}"${j === 0 ? ' data-fk="vz-menu-alt-ilk"' : ''}><img class="vz-kucuk-resim" data-resim="${esc(x.b.src)}" alt=""><span class="tx">Resim ${x.i + 1}</span></button>`).join('')}</div>` : ''}</div>`;
    }).join('') : '';
    return `<div class="menu vz-kutu-menu" role="menu">
        <button class="mi${pasif(t.lock !== 'none')}" role="menuitem" ${tid} data-act="vzKopya" data-fk="vz-menu-ilk">${vzIkon('kopya')}<span class="tx">Kopyala</span></button>
        <button class="mi${pasif(t.lock !== 'none')}" role="menuitem" ${tid} data-act="vzKutuSil">${vzIkon('sil')}<span class="tx">Sil</span></button>${resimMadde}
      </div>`;
  }

  // Resim ayarları paneli (fırça paneliyle aynı görünüm): Sığdır / Doldur, ölçek, sıfırla, kırp
  function vzResimAyarHTML(t, b) {
    const tid = `data-tid="${t.id}" data-bid="${b.id}"`;
    const seg = (v, ad) => `<button type="button" class="vz-seg-d${b.fit === v ? ' on' : ''}" role="radio" aria-checked="${b.fit === v}" ${tid} data-act="vzResimFit" data-v="${v}" data-fk="vz-ra-fit-${v}">${ad}</button>`;
    const O = VizyonMantik.RESIM_OLCEK;
    return `<div class="menu vz-firca-panel vz-resim-ayar" role="dialog" aria-label="Resim ayarları">
        <section><h4>Yerleşim</h4><div class="vz-seg" role="radiogroup" aria-label="Sığdır veya doldur">${seg('contain', 'Sığdır')}${seg('cover', 'Doldur')}</div>
          <p class="vz-ipucu-sat">${b.fit === 'contain' ? 'Resmin tamamı görünür, kenarlarda boşluk kalabilir.' : 'Resim çerçeveyi kaplar, taşan kısım gizlenir.'}</p></section>
        <section><h4>Ölçek</h4><div class="vz-olcek-sat"><input type="range" class="vz-olcek-aralik" min="${O.en_az}" max="${O.en_cok}" step="1" value="${b.scale}" ${tid} data-in="vzResimOlcek" aria-label="Ölçek yüzdesi">
          <label class="vz-olcek-kutu"><input type="number" class="vz-olcek-sayi" min="${O.en_az}" max="${O.en_cok}" step="1" value="${b.scale}" ${tid} data-in="vzResimOlcek" aria-label="Ölçek (yüzde)">%</label></div></section>
        <section class="vz-ayar-dugmeler">${b.caption || S.vzAltYazi === b.id ? '' : `<button type="button" class="vz-dugme" ${tid} data-act="vzAltYaziEkle">Alt yazı ekle</button>`}<button type="button" class="vz-dugme" ${tid} data-act="vzResimSifirla">Sıfırla</button><button type="button" class="vz-dugme" ${tid} data-act="vzKirpBasla" data-fk="vz-ra-kirp">${vzIkon('kirp')}Kırp</button></section>
      </div>`;
  }
  // Kilit menüsü: Kilitle (tam), Sadece konumu kilitle, Kilidi aç (yalnızca kilitliyken); geçerli tür işaretli
  function vzKilitMenuHTML(t) {
    const tid = `data-tid="${t.id}"`;
    const d = (v, ikon, ad, on) => `<button class="mi" role="menuitemradio" aria-checked="${!!on}" ${tid} data-act="vzKilitSec" data-v="${v}"${v === 'full' ? ' data-fk="vz-menu-ilk"' : ''}>${vzIkon(ikon)}<span class="tx">${ad}</span>${on ? `<span class="vz-ok">${vzIkon('tik')}</span>` : ''}</button>`;
    return `<div class="menu vz-kutu-menu vz-kilit-menu" role="menu" aria-label="Kutucuk kilidi">
        ${d('full', 'kilit', 'Kilitle', t.lock === 'full')}${d('position', 'kilitKonum', 'Sadece konumu kilitle', t.lock === 'position')}${t.lock !== 'none' ? d('none', 'kilitAcik', 'Kilidi aç', false) : ''}
      </div>`;
  }

  // Boş kutucukta içerik seçim listesi (Yazı, Resim, Liste, Tablo)
  function vzSecimHTML(t) {
    return `<div class="vz-secim" role="menu" aria-label="İçerik ekle">${[['text', 'Yazı'], ['image', 'Resim'], ['list', 'Liste'], ['table', 'Tablo']].map(([v, ad], i) =>
      `<button type="button" class="vz-secim-satir" role="menuitem" data-tid="${t.id}" data-act="vzSecimSec" data-v="${v}"${i === 0 ? ' data-fk="vz-secim-ilk"' : ''}>${vzIkon(VZ_BLOK_IKON[v])}<span>${ad}</span></button>`).join('')}</div>`;
  }
  const VZ_KILIT_AD = { none: 'Kilitsiz', position: 'Konum kilitli', full: 'Tam kilit' };
  const VZ_KILIT_IKON = { none: 'kilitAcik', position: 'kilitKonum', full: 'kilit' };
  function vzKutuHTML(t) {
    const U = VZ_BIRIM_PX; const l = t.layout; const L = t.look;
    const kilit = t.lock; const kilitli = kilit !== 'none';
    // İçerik seçim listesi: boş kutucuk seçiliyken (ya da "Yeni" ile yeni açıldıysa) gösterilir; tam kilitte içerik eklenemez
    const secim = !t.blocks.length && (S.vzSecim === t.id || S.vzSecili === t.id) && kilit !== 'full';
    const rBlok = S.vzAcik && S.vzAcik.tur === 'resim' && S.vzAcik.tid === t.id ? VZ.getBlock(t.id, S.vzAcik.bid) : null;
    const tid = `data-tid="${t.id}"`;
    const acik = S.vzAcik && S.vzAcik.tid === t.id ? S.vzAcik.tur : null;
    const g = vzGorunumStil(L);
    const baslikVar = L.titleSize !== 'none';          // başlık "Yok" ise ikon da gizlenir (seçim saklı kalır)
    const ikon = baslikVar ? L.icon : null;
    const ikPx = VZ_IKON_PX[L.iconSize];
    const ikSpan = (ek) => `<span class="vz-ik-b ${ek}" style="--ikpx:${ikPx}px" aria-hidden="true">${vzIkon(ikon)}</span>`;
    const yan = ikon && (L.iconPos === 'left' || L.iconPos === 'right');
    const basEk = `font-size:${VZ_BASLIK_PX[L.titleSize]}px;max-width:calc(100% - ${142 + (yan ? ikPx + 6 : 0)}px)`;   // 142px: üç ikon (kilit, fırça, üç nokta) + en az ~40px sürükleme alanı
    return `<article class="vz-kutu st-${L.style}${g.artikSinif}${kilitli ? ' kl-' + (kilit === 'full' ? 'full' : 'pos') : ''}${L.titleSize === 'none' && t.blocks[0] && t.blocks[0].type === 'image' ? ' ust-bindirme' : ''}${S.vzSecili === t.id ? ' sec' : ''}${S.vzYeniKutu === t.id ? ' yeni' : ''}${acik ? ' acik' : ''}" data-kutu="${t.id}" style="left:${l.x * U}px;top:${l.y * U}px;width:${l.w * U}px;height:${l.h * U}px;${g.artikStil}">
      ${ikon && L.iconPos === 'corner' ? ikSpan('kose') : ''}
      <div class="vz-ic">
        <div class="vz-kutu-ust${g.ustSinif}${ikon && L.iconPos === 'top' ? ' ik-ust' : ''}" style="${g.ustStil}">
          ${ikon && L.iconPos === 'top' ? ikSpan('ust') : ''}${ikon && L.iconPos === 'left' ? ikSpan('sol') : ''}${baslikVar ? `<input class="vz-baslik" size="${Math.max(6, t.title.length + 1)}" value="${esc(t.title)}"${kilit === 'full' ? ' readonly' : ''} style="${basEk}" ${tid} data-in="vzBaslikYaz" data-ch="vzKutuBaslik" aria-label="Kutucuk başlığı">` : ''}${ikon && L.iconPos === 'right' ? ikSpan('sag') : ''}
          <span class="vz-tutac" ${tid} data-vz-tut="tasi" title="Sürükleyerek taşı"></span>
          <span class="vz-ikonlar">
            <button class="vz-ik vz-ik-kilit${acik === 'kilit' ? ' on' : ''}" ${tid} data-act="vzKilitMenu" data-fk="vz-kl-${t.id}" title="${kilitli ? VZ_KILIT_AD[kilit] : 'Kilitle'}" aria-label="Kutucuk kilidi: ${VZ_KILIT_AD[kilit]}" aria-haspopup="menu" aria-expanded="${acik === 'kilit'}">${vzIkon(VZ_KILIT_IKON[kilit])}</button>
            <button class="vz-ik${acik === 'firca' ? ' on' : ''}${kilitli ? ' vz-pasif' : ''}" ${tid} data-act="vzFirca" data-fk="vz-fr-${t.id}" title="${kilitli ? 'Kutucuk kilitli' : 'Görünüm'}" aria-label="Kutucuk görünümü"${kilitli ? ' aria-disabled="true"' : ''} aria-haspopup="dialog" aria-expanded="${acik === 'firca'}">${vzIkon('firca')}</button>
            <button class="vz-ik${acik === 'menu' ? ' on' : ''}" ${tid} data-act="vzUcNokta" data-fk="vz-uc-${t.id}" title="Diğer işlemler" aria-label="Kutucuk menüsü" aria-haspopup="menu" aria-expanded="${acik === 'menu'}">${vzIkon('ucNokta')}</button>
          </span>
        </div>
        ${t.blocks.map((b) => vzBlokHTML(t, b)).join('')}${secim ? vzSecimHTML(t) : ''}
      </div>
      ${acik === 'resim' && !kilitli && rBlok ? vzResimAyarHTML(t, rBlok) : ''}${acik === 'menu' ? vzMenuHTML(t) : ''}${acik === 'kilit' ? vzKilitMenuHTML(t) : ''}${acik === 'firca' && !kilitli ? vzFircaHTML(t) : ''}
      <span class="vz-boyut" ${tid} data-vz-tut="boyut" title="Sürükleyerek boyutlandır"></span>
    </article>`;
  }
  // ----- Vizyon: ikon tablosu (tek yerde) -----

  // İkonu değiştirmek için yalnızca buradaki satırı değiştirmek yeter; kalınlık VZ_IKON_CIZGI'den gelir.
  const VZ_IKON_CIZGI = 1.75;
  const VZ_IKON = {
    kilit: '<rect x="5" y="11" width="14" height="9.5" rx="3.2"/><path d="M8 11V8.2a4 4 0 0 1 8 0V11"/>',
    kilitAcik: '<rect x="5" y="11" width="14" height="9.5" rx="3.2"/><path d="M8 11V8.2a4 4 0 0 1 7.6-1.7"/>',
    resim: '<rect x="3.5" y="4.5" width="17" height="15" rx="4"/><circle cx="9" cy="10" r="1.5"/><path d="M4.5 17l4-3.6a1.8 1.8 0 0 1 2.4 0l2.1 1.9"/><path d="M12.8 15.6l1.7-1.6a1.8 1.8 0 0 1 2.4 0l3 2.8"/>',
    yazi: '<rect x="5" y="3.5" width="14" height="17" rx="3.5"/><path d="M9 9h6M9 12.5h6M9 16h3.5"/>',

    liste: '<path d="M4.5 7.2l1.5 1.5 2.7-3"/><path d="M12 7h7.5"/><path d="M4.5 16.2l1.5 1.5 2.7-3"/><path d="M12 16h7.5"/>',
    arti: '<path d="M12 5.5v13M5.5 12h13"/>',

    hizaSol: '<path d="M5 7h14M5 12h9M5 17h12"/>',
    hizaOrta: '<path d="M5 7h14M7.5 12h9M6 17h12"/>',
    hizaSag: '<path d="M5 7h14M10 12h9M7 17h12"/>',
    ayar: '<path d="M4.5 8H13M19 8h.5M4.5 16H6M12 16h7.5"/><circle cx="16" cy="8" r="2.4"/><circle cx="9" cy="16" r="2.4"/>',
    kirp: '<path d="M7.5 3.5v13a1 1 0 0 0 1 1h12"/><path d="M3.5 7.5h13a1 1 0 0 1 1 1v12"/>',

    firca: '<path d="M19.4 4.6a1.9 1.9 0 0 0-2.7 0l-6.1 6.1 2.7 2.7 6.1-6.1a1.9 1.9 0 0 0 0-2.7z"/><path d="M10.6 10.7C8.1 10.2 5.9 11.9 5.9 14.3c0 1.5-.7 2.6-1.9 3.5 3.8 1 7.3-.1 8.6-2.5.5-1 .3-2.1-.6-2.9"/>',
    yildiz: '<path d="M12 4.2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4-3.9-3.8 5.4-.8z"/>',
    kalp: '<path d="M12 19.5s-7-4.3-7-9.6a3.9 3.9 0 0 1 7-2.3 3.9 3.9 0 0 1 7 2.3c0 5.3-7 9.6-7 9.6z"/>',
    ev: '<path d="M4.5 11.2L12 4.5l7.5 6.7"/><path d="M6.5 9.8V19h11V9.8"/><path d="M10 19v-4.5h4V19"/>',
    bayrak: '<path d="M6 20V4.5"/><path d="M6 5.5c3-1.6 5 1.6 8.5 0 1.3-.6 2.6-.7 3.5-.3v7.3c-.9-.4-2.2-.3-3.5.3C11 14.4 9 11.2 6 12.8"/>',
    hedef: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.2"/><circle cx="12" cy="12" r=".9" fill="currentColor"/>',
    ucak: '<path d="M20 4L10.5 13.5"/><path d="M20 4l-6 16-3.5-6.5L4 10z"/>',
    kitap: '<path d="M12 6.5C10 5 7.5 4.7 4.5 5v12.5c3-.3 5.5 0 7.5 1.5 2-1.5 4.5-1.8 7.5-1.5V5c-3-.3-5.5 0-7.5 1.5z"/><path d="M12 6.5V19"/>',
    gunes: '<circle cx="12" cy="12" r="3.8"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6L18 18M6 18l1.4-1.4M16.6 7.4L18 6"/>',
    ucNokta: '<circle cx="5.5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.5" fill="currentColor" stroke="none"/>',
    kopya: '<rect x="9" y="9" width="11" height="11" rx="3"/><path d="M15 9V7.5A3.5 3.5 0 0 0 11.5 4H7.5A3.5 3.5 0 0 0 4 7.5v4A3.5 3.5 0 0 0 7.5 15H9"/>',
    sil: '<path d="M5 7h14"/><path d="M9.5 7V5.8A1.8 1.8 0 0 1 11.3 4h1.4A1.8 1.8 0 0 1 14.5 5.8V7"/><path d="M6.8 7l.7 11.2A2 2 0 0 0 9.5 20h5a2 2 0 0 0 2-1.8L17.2 7"/><path d="M10.2 11v5M13.8 11v5"/>'
  };
  const vzIkon = (ad) => `<svg class="vz-ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${VZ_IKON_CIZGI}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${VZ_IKON[ad]}</svg>`;
  const VZ_BLOK_IKON = { image: 'resim', list: 'liste', text: 'yazi', table: 'tablo' };

  // Sol araç çubuğu: Yeni, Resim, Liste, Yazı, Tablo (kilit artık kutucuk başına, çubukta değil)
  function vzCubukHTML() {
    const d = (act, ikon, etiket, ek) => `<button class="vz-cb" data-act="${act}" ${ek || ''} title="${etiket}">${vzIkon(ikon)}<span>${etiket}</span></button>`;
    return `<aside class="vz-cubuk" aria-label="Pano araçları">
        ${d('vzKutuEkle', 'arti', 'Yeni')}
        ${[['image', 'Resim'], ['list', 'Liste'], ['text', 'Yazı'], ['table', 'Tablo']].map(([t, ad]) => d('vzBlokCubuk', VZ_BLOK_IKON[t], ad, `data-v="${t}"`)).join('')}
      </aside>`;
  }

  function vizyonHTML() {
    const panolar = VZ.getBoards();
    const p = vzAktifPano();
    if (S.vzSecili && !(VZ.getTile(S.vzSecili) && p && VZ.getTile(S.vzSecili).boardId === p.id)) S.vzSecili = null;
    if (S.vzSecim) { const st = VZ.getTile(S.vzSecim); if (!st || st.blocks.length) S.vzSecim = null; }   // bekleyen boş kutucuk, içerik gelince "bekleyen" olmaktan çıkar (sonradan boşalırsa silinmez)
    const sekmeler = panolar.map((b) => {
      const ak = p && b.id === p.id;
      if (ak && S.vzAdlandir) return `<input class="vz-sekme-ad" value="${esc(b.title)}" data-fk="vz-pano-ad" data-key="vzPanoAdTamam" aria-label="Pano adı">`;
      // Madde 1: menü aktif sekmenin kendisine tıklayınca açılır (ayrı "Pano" düğmesi yok); pasif sekme panoya geçer
      if (ak) return `<span class="vz-sekme-ak"><button class="on" data-act="vzPano" data-id="${b.id}" aria-haspopup="menu" aria-expanded="${!!S.vzMenu}">${esc(b.title)}</button>${S.vzMenu ? `<div class="menu" role="menu">
        <button class="mi" role="menuitem" data-act="vzAdlandir"><span class="tx">Yeniden adlandır</span></button>
        <button class="mi" role="menuitem" data-act="vzPanoSil"><span class="tx">Panoyu sil</span></button></div>` : ''}</span>`;
      return `<button data-act="vzPano" data-id="${b.id}">${esc(b.title)}</button>`;
    }).join('');
    // Pano alanı kalan yeri doldurur (CSS); kutucuklar alt kenara yaklaşınca ya da taşınca min-height ile aşağı uzar
    let kutuHTML = ''; let alan = 0;
    if (p) {
      const kutular = VZ.getTiles(p.id);
      if (kutular.length) {
        alan = Math.max(...kutular.map((t) => t.layout.y + t.layout.h)) * VZ_BIRIM_PX + VZ_ALAN_PAYI_PX;
        kutuHTML = kutular.map((t) => vzKutuHTML(t)).join('');
      }
    }
    const alt = `<div class="vz-tuval" style="--vz-birim:${VZ_BIRIM_PX}px;min-height:${alan}px">${kutuHTML}</div>`;   // 4.7: alanda hiçbir durumda yazı yok (pano yokken "+" düğmesi vurgulanır)
    return `<header class="h-head">
        <span class="mark on-dark" role="img" aria-label="Planize"><svg viewBox="0 0 1204 1204" aria-hidden="true" focusable="false"><rect width="1204" height="1204" rx="228" fill="#000"/><path fill="#E5E2D0" d="M258.8 250.8H729.1V353.1H554.1V828.8H433.4V353.1H258.8Z"/><path fill="#FFF" d="M496.8 446.5H602.6V652.7L796.3 446.5H933.1L726.3 654.1L945.2 953.3H808.7L652.2 731L602.6 781.6V953.3H496.8Z"/></svg></span>
        <nav class="h-nav">
          <button class="h-ni" data-act="goHome">Anasayfa</button>
          <button class="h-ni" data-act="goPlanner">Planlayıcı</button>
          <span class="h-ni locked">Portföy ${ms('lock')}</span>
          <span class="h-ni on">Vizyon Panosu</span>
        </nav>
        <span class="h-sp"></span>
        ${esitEtiket()}<button class="h-nb h-gear" data-act="openSettings" title="Ayarlar">${ms('settings')}</button>
      </header>
      <main class="h-main">
        <nav class="vz-sekmeler"><div class="h-seg">${sekmeler}</div><button class="h-nb${panolar.length ? '' : ' vz-vurgulu'}" data-act="vzPanoEkle" title="Yeni pano" aria-label="Yeni pano">${ms('add')}</button></nav>
        <div class="vz-alan">${vzCubukHTML()}<div class="vz-pano">${alt}</div></div>

  // Tablo aracı: yamayı odaktaki hücreye (varsa) göre üretir, işlemden sonra odak yeni hücreye taşınır
  function vzTablo(el, yamaUret, yeniOdak) {
    const b = VZ.getBlock(el.dataset.tid, el.dataset.bid);
    if (!b) return;
    const f = S.vzHucre && S.vzHucre.bid === b.id && S.vzHucre.r < b.rows.length && S.vzHucre.c < b.colWidths.length ? S.vzHucre : null;
    VZ.updateBlock(el.dataset.tid, b.id, yamaUret(b, f));

    if (y) { S.vzHucre = { tid: b.tid || el.dataset.tid, bid: b.id, r: Math.max(0, y.r), c: Math.max(0, y.c) }; S.focusNext = `vzh-${b.id}-${S.vzHucre.r}-${S.vzHucre.c}`; }
  }
  document.addEventListener('focusin', (e) => {   // son odaktaki hücre (tablo araçları buna göre çalışır)
    const el = e.target;
    if (el.classList && el.classList.contains('vz-hucre')) S.vzHucre = { tid: el.dataset.tid, bid: el.dataset.bid, r: +el.dataset.r, c: +el.dataset.c };
  });
  // Sütun genişliği: ilk satırdaki sütun sınırından sürüklenir (iki komşu sütunun toplamı korunur)
  let vzSut = null;
  document.addEventListener('pointerdown', (e) => {
    const h = e.target.closest && e.target.closest('[data-vz-sut]');
    if (!h || S.page !== 'vizyon' || e.button !== 0) return;
    const b = VZ.getBlock(h.dataset.tid, h.dataset.bid);
    if (!b) return;
    e.preventDefault();
    const tablo = h.closest('table');

      toplam: b.colWidths.reduce((x, y) => x + y, 0), cols: tablo.querySelectorAll('col') };
  });
  document.addEventListener('pointermove', (e) => {
    const s = vzSut;
    if (!s) return;
    const min = VizyonMantik.AYAR.enAzSutunGenisligi; const c = s.c;
    const cift = s.w0[c] + s.w0[c + 1];
    const yeni = Math.max(min, Math.min(cift - min, s.w0[c] + (e.clientX - s.x0) / s.gen * s.toplam));
    s.w[c] = yeni; s.w[c + 1] = cift - yeni;

  });
  const vzSutBirak = (kaydet) => {
    const s = vzSut;
    if (!s) return;

  };
  document.addEventListener('pointerup', () => vzSutBirak(true));
  document.addEventListener('pointercancel', () => vzSutBirak(false));
  // Yazı alanı içeriğe göre uzar (kaydırma çubuğu çıkmaz)
  function vzYaziBoyu(t) { t.style.height = 'auto'; t.style.height = (t.scrollHeight + (t.offsetHeight - t.clientHeight)) + 'px'; }
  // Resim eklendiğinde kutucuk, resmin tam oranla görüneceği yüksekliğe büyür (yalnızca büyür; kilitli panoda kayıt değişmez)
  function vzResimOraniUydur(tid, res) {
    const t = VZ.getTile(tid); const el = vzKutuEl(tid);
    if (!t || !el) return;
    const alan = el.querySelector('.vz-resim-alan');
    if (!alan) return;
    const enAz = parseFloat(getComputedStyle(alan).minHeight) || 0;
    const istenen = Math.round(alan.clientWidth * res.h / res.w);          // alanda tam oran için gereken yükseklik
    const gerek = vzIcerikYuksekligi(el) + Math.max(0, istenen - enAz);   // içerik zaten en az alan yüksekliğiyle ölçülür
    const birim = Math.ceil(gerek / VZ_BIRIM_PX);
    if (birim > t.layout.h && VZ.setTileLayout(tid, { h: birim }, { onePlanaGetirme: false, icerikBuyume: true }).ok) render();
  }
  // Çubuktaki Resim: dosya seçilince resimli blok seçili kutucuğa (yoksa yeni kutucuğa) eklenir; iptalde hiçbir şey yapılmaz
  function vzResimCubuk() {
    const sec0 = S.vzSecili && VZ.getTile(S.vzSecili);
    if (sec0 && sec0.lock === 'full') { showToast('Kutucuk kilitli.'); return; }   // tam kilit: içerik eklenemez
    const giris = document.createElement('input');
    giris.type = 'file'; giris.accept = 'image/*';
    giris.addEventListener('change', () => {
      const f = giris.files && giris.files[0];
      if (!f) return;
      VizyonResim.ekle(f).then((res) => {
        const p = vzAktifPano();
        if (!p) { VizyonResim.sil(res.id); return; }
        const sec = S.vzSecili && VZ.getTile(S.vzSecili);
        const id = sec && sec.boardId === p.id ? sec.id : vzYeniKutu(p).tile.id;
        VZ.addBlock(id, 'image', { src: res.id });
        S.vzSecili = id;
        render();
        vzResimOraniUydur(id, res);
      }).catch((err) => { showToast((err && err.message) || 'Resim eklenemedi.'); render(); });
    });
    giris.click();
  }
  // Yeni boş kutucuk: mevcutların altına açılır ve seçili olur
  // Satır genişliği = pano alanının görünen genişliği (birim); yer kuralı mantık katmanında (bosYerBul)
  function vzSatirGenisligi() {
    const tuval = vzEl.querySelector('.vz-tuval');
    return tuval && tuval.clientWidth ? Math.floor(tuval.clientWidth / VZ_BIRIM_PX) : VizyonMantik.AYAR.yedekSatirGenisligi;
  }
  function vzYeniKutu(p) {
    const r = VZ.createTile(p.id, { satirGenisligi: vzSatirGenisligi() });
    S.vzSecili = r.tile.id; S.vzYeniKutu = r.tile.id;
    return r;
  }
  // 6a: "Yeni" ile açılan kutucuk, içerik seçilmeden bırakılırsa (dışarı tıklama, Esc, sayfadan çıkış) sessizce silinir (onay yok)
  function vzSecimIptal() {
    const id = S.vzSecim;
    if (!id) return false;
    S.vzSecim = null;
    const t = VZ.getTile(id);
    if (!t || t.blocks.length || t.lock !== 'none') return false;

  window.addEventListener('pagehide', () => { vzSecimIptal(); vzFlush(); });

  // 6b/6c: resim görünümünü (fit, scale, posX, posY) yazar ve ekranı yeniden çizmeden günceller (kaydırıcı/sürükleme sırasında DOM bozulmasın)
  function vzResimUygula(tid, bid, yama) {
    const r = VZ.updateBlock(tid, bid, yama);
    if (!r.ok) return null;

    vzEl.querySelectorAll(`.vz-resim-alan[data-bid="${bid}"] .vz-resim`).forEach((img) => img.setAttribute('style', vzResimStil(b)));
    vzEl.querySelectorAll(`[data-in="vzResimOlcek"][data-bid="${bid}"]`).forEach((i) => { if (i !== document.activeElement) i.value = b.scale; });
    vzEl.querySelectorAll(`.vz-resim-alan[data-bid="${bid}"] .vz-kirp-yuzde`).forEach((s) => { s.textContent = b.scale + '%'; });
    return b;
  }
  // Kırpma bitirme: Vazgeç ise girişteki değerler geri yüklenir (orijinal resim zaten hiç değişmez)
  function vzKirpBitir(vazgec) {
    const k = S.vzKirp;
    S.vzKirp = null;
    if (vazgec && k && VZ.getBlock(k.tid, k.bid)) VZ.updateBlock(k.tid, k.bid, k.once);
  }
  // Kırpma modunda resmi çerçeve içinde sürükleme (kaydırma) ve tekerlekle yakınlaştırma
  let vzKirpSur = null;
  document.addEventListener('pointerdown', (e) => {
    if (S.page !== 'vizyon' || !S.vzKirp || e.button !== 0 || !e.target.closest) return;
    const alan = e.target.closest('.vz-resim-alan.kirpiyor');
    if (!alan || e.target.closest('.vz-kirp-arac')) return;
    const b = VZ.getBlock(S.vzKirp.tid, S.vzKirp.bid);
    if (!b) return;
    e.preventDefault();
    const r = alan.getBoundingClientRect();
    vzKirpSur = { x0: e.clientX, y0: e.clientY, pX: b.posX, pY: b.posY, w: r.width, h: r.height, alan };
    try { alan.setPointerCapture(e.pointerId); } catch (err) { /* yoksay */ }
    alan.classList.add('tutuyor');
  });
  document.addEventListener('pointermove', (e) => {
    if (!vzKirpSur || !S.vzKirp) return;
    const s = vzKirpSur;
    vzResimUygula(S.vzKirp.tid, S.vzKirp.bid, { posX: s.pX + (e.clientX - s.x0) / s.w * 100, posY: s.pY + (e.clientY - s.y0) / s.h * 100 });
  });
  const vzKirpSurBitir = () => { if (vzKirpSur) { vzKirpSur.alan.classList.remove('tutuyor'); vzKirpSur = null; } };
  document.addEventListener('pointerup', vzKirpSurBitir);
  document.addEventListener('pointercancel', vzKirpSurBitir);
  document.addEventListener('wheel', (e) => {
    if (S.page !== 'vizyon' || !S.vzKirp || !e.target.closest || !e.target.closest('.vz-resim-alan.kirpiyor')) return;
    const b = VZ.getBlock(S.vzKirp.tid, S.vzKirp.bid);
    if (!b) return;
    e.preventDefault();
    vzResimUygula(S.vzKirp.tid, S.vzKirp.bid, { scale: b.scale + (e.deltaY < 0 ? 5 : -5) });
  }, { passive: false });
  // Resme çift tıklayınca kırpma modu açılır (kilitli kutucukta açılmaz)
  document.addEventListener('dblclick', (e) => {
    const img = S.page === 'vizyon' && !S.vzKirp && e.target.closest ? e.target.closest('.vz-resim') : null;
    const alan = img && img.closest('.vz-resim-alan');
    if (!alan) return;
    ACT.vzKirpBasla({ dataset: { tid: alan.dataset.tid, bid: alan.dataset.bid } });
    render();
  });
  // Seçim: tıklanan kutucuk seçilir, boş tuvale tıklanınca seçim kalkar (yeniden çizmeden: yazı alanlarının odağı bozulmasın)
  function vzSec(id) {
    if (S.vzSecili === id) return;
    S.vzSecili = id;
    vzEl.querySelectorAll('.vz-kutu').forEach((k) => k.classList.toggle('sec', k.dataset.kutu === id));
    // Boşalmış kutucuğun içerik seçim listesi yalnızca seçiliyken görünür (bekleyen yeni kutucuk hariç)
    vzEl.querySelectorAll('.vz-secim').forEach((s) => { const kid = s.closest('.vz-kutu').dataset.kutu; if (kid !== id && S.vzSecim !== kid) s.remove(); });
  }
  document.addEventListener('pointerdown', (e) => {
    if (S.page !== 'vizyon' || e.button !== 0 || !e.target.closest) return;
    const k = e.target.closest('.vz-kutu');
    if (k) {
      vzSec(k.dataset.kutu);
      const t = VZ.getTile(k.dataset.kutu);
      if (t && !t.blocks.length && t.lock !== 'full' && !k.querySelector('.vz-secim') && !e.target.closest('button, input, textarea, [data-vz-tut]')) setTimeout(render, 0);   // boş kutucuğa tıklayınca seçim listesi gelir
    } else if (e.target.closest('.vz-tuval')) vzSec(null);
  });
  // Pano adı sekmede yerinde düzenlenir: Enter veya alandan çıkınca kaydedilir (boş ad eski adı korur), Esc vazgeçer
  document.addEventListener('focusout', (e) => {
    if (S.rendering || !S.vzAdlandir || !(e.target.dataset && e.target.dataset.fk === 'vz-pano-ad')) return;

    setTimeout(render, 0);
  });
  // Alt yazı satırından boş çıkılırsa satır kaybolur (resim yeri geri alır)
  document.addEventListener('focusout', (e) => {
    const el = e.target;

    setTimeout(render, 0);
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape' || S.page !== 'vizyon' || S.confirm || S.settingsOpen) return;

    if (S.vzAdlandir || S.vzMenu || S.vzAcik) {

      S.vzAdlandir = false; S.vzMenu = false; S.vzAcik = null; render();
      return;
    }
    if (S.vzSecim && vzSecimIptal()) render();               // seçim listesi açık boş kutucukta Esc = sessizce sil
  });
  const vzKilitli = (r) => { if (r && r.hata === 'kilitli') showToast('Kutucuk kilitli.'); };
  // Kilitli kutucuğun taşıma/boyutlandırma tutacağına basılınca: hiçbir şey taşınmaz, kutucuk kısa süre sallanır (hareket azaltma açıksa sallanmaz)
  function vzSalla(el) {
    if (!el || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    el.classList.remove('vz-salla'); void el.offsetWidth; el.classList.add('vz-salla');
    setTimeout(() => el.classList.remove('vz-salla'), 320);
  }
  // Alt+Shift+L: seçili kutucuğun kilidini değiştirir (kilitsiz → tam kilit, kilitliyse → kilidi aç); yazı yazılırken çalışmaz
  document.addEventListener('keydown', (e) => {
    if (S.page !== 'vizyon' || S.confirm || S.settingsOpen || !e.altKey || !e.shiftKey || e.ctrlKey || e.metaKey || e.code !== 'KeyL') return;
    const h = e.target || {}; const tag = (h.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || h.isContentEditable) return;
    const t = S.vzSecili && VZ.getTile(S.vzSecili);
    if (!t) return;
    e.preventDefault();
    VZ.setTileLock(t.id, t.lock === 'none' ? 'full' : 'none');

  // ----- Vizyon: sürükleme, köşeden boyutlandırma ve yumuşak yapışma -----
  // Tek yerden ayarlanır:
  //   oran: 60 Hz'de kare başına hedefe yaklaşma payı (ekran hızından bağımsız hesaplanır)
  //   sure: bırakınca kalan mesafeyi tamamlama süresi (ms, ease-out)
  const VZ_YAPIS = { oran: 0.22, sure: 160 };
  const VZ_KARE_MS = 1000 / 60;
  let vzSur = null;   // etkin sürükleme: { tid, mod, a0, b0, x0, y0, cur, hedef, ham, serbest, bitis, son }

  const vzKutuEl = (tid) => vzEl.querySelector(`[data-kutu="${tid}"]`);

  // ----- Vizyon: kutucuk içeriğe göre en az yükseklik (içerik kırpılmaz) -----
  // İçeriğin doğal yüksekliğini (verilen genişlikte) birim katına yukarı yuvarlayıp piksel olarak verir.
  function vzIcerikYuksekligi(el, genislikPx) {
    if (!el) return 0;
    const ic = el.firstElementChild;
    const w0 = el.style.width;
    if (genislikPx != null) el.style.width = genislikPx + 'px';
    el.querySelectorAll('.vz-yazi').forEach(vzYaziBoyu);          // yazı alanları bu genişlikte içeriğe göre boylanır
    const h0 = ic.style.height; const o0 = ic.style.overflow;
    ic.style.height = 'auto'; ic.style.overflow = 'visible';
    const doGal = ic.offsetHeight + (el.offsetHeight - el.clientHeight);   // iç + kenarlıklar
    ic.style.height = h0; ic.style.overflow = o0;
    if (genislikPx != null) { el.style.width = w0; el.querySelectorAll('.vz-yazi').forEach(vzYaziBoyu); }
    return Math.ceil(doGal / VZ_BIRIM_PX) * VZ_BIRIM_PX;
  }
  // Çizimden sonra: içeriği sığmayan kutucuğun yüksekliği hemen büyütülür (görünüm), kilitli değilse kayda da işlenir.
  // Kilitli panoda kayıt değişmez; görünüm yine içeriği kırpmaz.
  function vzSigdir() {
    if (S.page !== 'vizyon') return;
    vzEl.querySelectorAll('.vz-kutu').forEach((el) => {
      if (vzSur && vzSur.tid === el.dataset.kutu) return;   // sürüklenen kutucuğa karışma
      const t = VZ.getTile(el.dataset.kutu);
      if (!t) return;
      const gerek = vzIcerikYuksekligi(el);
      const mevcut = t.layout.h * VZ_BIRIM_PX;
      if (gerek <= mevcut) return;
      el.style.height = gerek + 'px';
      const r = VZ.setTileLayout(t.id, { h: gerek / VZ_BIRIM_PX }, { onePlanaGetirme: false, icerikBuyume: true });   // konum kilidinde kayda işlenir; tam kilitte reddedilir, görünüm yine büyük kalır
      const hk = el.querySelector('[data-k="h"]');
      if (r.ok && hk) hk.value = gerek / VZ_BIRIM_PX;                                            // sayı kutusu yeni kaydı göstersin
    });
    // Pano alanı, büyüyen kutucukların altında yeterince boşluk bırakacak şekilde uzar
    const tuval = vzEl.querySelector('.vz-tuval');
    const kutular = vzEl.querySelectorAll('.vz-kutu');
    if (tuval && kutular.length) {
      let alt = 0;
      kutular.forEach((el) => { alt = Math.max(alt, el.offsetTop + el.offsetHeight); });
      tuval.style.minHeight = (alt + VZ_ALAN_PAYI_PX) + 'px';
    }
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => vzSigdir());   // yazı tipi yüklenince ölçüler değişebilir
  const vzEase = (t) => 1 - Math.pow(1 - t, 3);   // ease-out (kübik)

  function vzUygula(s) {
    const el = vzKutuEl(s.tid);                    // yeniden çizim olduysa güncel öğe bulunur
    if (!el) return;
    el.classList.add('vz-surukle');
    if (s.mod === 'tasi') { el.style.left = s.cur.a + 'px'; el.style.top = s.cur.b + 'px'; }
    else { el.style.width = s.cur.a + 'px'; el.style.height = s.cur.b + 'px'; }
  }

  function vzBitir(s) {
    const U = VZ_BIRIM_PX;
    const a = Math.round(s.cur.a / U); const b = Math.round(s.cur.b / U);
    const r = VZ.setTileLayout(s.tid, s.mod === 'tasi' ? { x: a, y: b } : { w: a, h: b });

  function vzKare(ts) {

      const t = Math.max(0, Math.min(1, (ts - s.bitis.t0) / VZ_YAPIS.sure));
      const e = vzEase(t);
      s.cur.a = s.bitis.a0 + (s.bitis.a1 - s.bitis.a0) * e;
      s.cur.b = s.bitis.b0 + (s.bitis.b1 - s.bitis.b0) * e;
      vzUygula(s);
      if (t >= 1) { vzBitir(s); return; }
    } else {
      const dt = Math.max(1, Math.min(100, ts - s.son)); s.son = ts;
      const k = s.serbest ? 1 : 1 - Math.pow(1 - VZ_YAPIS.oran, dt / VZ_KARE_MS);   // Alt: anında takip
      s.cur.a += (s.hedef.a - s.cur.a) * k;
      s.cur.b += (s.hedef.b - s.cur.b) * k;
      vzUygula(s);
    }
    requestAnimationFrame(vzKare);
  }

  // Ham (parmağın/imlecin gösterdiği) değeri sınırlar içine alır; hedef = en yakın nokta (Alt basılıysa ham değer)
  function vzHedefHesapla(s, alt) {
    const U = VZ_BIRIM_PX; const A = VizyonMantik.AYAR;
    const gen = s.alan.clientWidth;
    let a = s.a0 + s.dx; let b = s.b0 + s.dy;
    if (s.mod === 'tasi') {
      a = Math.max(0, Math.min(a, Math.max(0, gen - s.en))); b = Math.max(0, b);
    } else {
      a = Math.max(A.enAzGenislik * U, Math.min(a, Math.max(A.enAzGenislik * U, gen - s.x0))); b = Math.max(A.enAzYukseklik * U, b);
      b = Math.max(b, vzIcerikYuksekligi(vzKutuEl(s.tid), Math.round(a / U) * U));   // içerikten küçük olmaz
    }
    s.ham = { a, b };
    s.serbest = !!alt;
    s.hedef = alt ? { a, b } : { a: Math.round(a / U) * U, b: Math.round(b / U) * U };
  }

  document.addEventListener('pointerdown', (e) => {
    const h = e.target.closest && e.target.closest('[data-vz-tut]');
    if (!h || S.page !== 'vizyon' || e.button !== 0) return;
    if (vzSur) {                                    // yarım kalmış (kare gelmeyen) bir sürükleme varsa önce onu bitir
      if (vzSur.bitis && performance.now() - vzSur.bitis.t0 > 1000) { vzSur.cur = { a: vzSur.bitis.a1, b: vzSur.bitis.b1 }; vzBitir(vzSur); }
      else return;

      const ctx = el.dataset.ctx; const v = el.dataset.v;
      const cur = repOf(ctx); const date = repDateOf(ctx);
      if (v === 'custom') {
        S.repCustom[ctx] = true;
        if (!cur) setRep(ctx, makeRepeat('weekly', date));
        return;
      }
      S.repCustom[ctx] = false;
      setRep(ctx, !v ? null : v === 'weekdays' ? makeRepeat('weekly', date, WEEKDAYS) : makeRepeat(v, date));
    },
    repDay(el) {
      const ctx = el.dataset.ctx; const x = +el.dataset.v; const r = repOf(ctx);
      if (!r) return;
      const cur = r.days || [];
      const days = cur.indexOf(x) >= 0 ? cur.filter((y) => y !== x) : cur.concat([x]);
      if (!days.length) return;                       // en az bir gün seçili kalmalı
      setRep(ctx, makeRepeat('weekly', repDateOf(ctx), days, everyOf(r)));
    },
    dpFinish() {
      const t = findTask(S.openId); if (!t) return;
      blip(); logDone(t, t.date || iso(new Date()));
      patch(t.id, (x) => Object.assign({}, x, { done: true, repeat: null, completedAt: Date.now() }));
    },
    // Toplu işlemler
    bulkComplete() {
      blip();
      const nowIso = iso(new Date());
      const entries = [];
      const next = S.tasks.map((t) => {
        if (S.picked.indexOf(t.id) < 0 || t.done) return t;
        if (t.repeat) {
          entries.push({ id: t.id, date: t.date || nowIso, at: Date.now() });
          return Object.assign({}, t, { date: nextOccurrence(t), done: false, subtasks: t.subtasks.map((x) => Object.assign({}, x, { done: false })) });
        }
        return Object.assign({}, t, { done: true, completedAt: Date.now() });
      });
      if (entries.length) { S.log = S.log.concat(entries).slice(-400); store(KEY_LOG, S.log); }
      persist(next);
      S.picked = []; S.moveMenuOpen = false;
    },
    bulkMoveMenu() { S.moveMenuOpen = !S.moveMenuOpen; },
    bulkMoveTo(el) {
      const id = el.dataset.v || null;
      // 9a: tarihsiz görevler Takvim'e taşınmaz, diğerleri taşınır
      let skipped = 0;
      persist(S.tasks.map((t) => {
        if (S.picked.indexOf(t.id) < 0) return t;
        if (!calendarOk(id, t.date)) { skipped++; return t; }
        return Object.assign({}, t, { list: id });
      }));
      if (skipped) showToast(`${skipped} görev tarihsiz olduğu için taşınmadı. ${CAL_DATE_MSG}`);
      S.picked = []; S.moveMenuOpen = false;
    },
    bulkDelete() { requestDelete(S.picked.slice()); S.moveMenuOpen = false; },
    bulkClear() { S.picked = []; S.moveMenuOpen = false; },
    undo() { const t = S.toast; S.toast = null; if (t && t.undo) t.undo(); },
    // Onay penceresi
    confirmOk() { const c = S.confirm; S.confirm = null; if (c && c.onOk) c.onOk(); },
    confirmCancel() { S.confirm = null; },
    // Ayarlar ve yedekler
    openSettings() { S.settingsOpen = true; S.menuOpen = false; S.corruptNotice = false; },
    closeSettings() { S.settingsOpen = false; },
    exportBackup,
    importBackup() { const inp = document.getElementById('import-file'); inp.value = ''; inp.click(); },
    restoreAuto(el) {
      const r = readArr(KEY_BACKUPS);
      const b = r.ok ? r.value[+el.dataset.v] : null;
      if (!b || !b.data) return;
      askConfirm({
        title: `${fmtDayLabel(b.date)} yedeği geri yüklensin mi?`,
        body: `Yedek: ${dataSummary(b.data)}\nŞu anki veriler (${dataSummary(collectData())}) bu yedekle değiştirilecek. Hemen ardından "Geri al" ile eski haline dönebilirsiniz.${bulutNotu()}`,
        ok: 'Geri yükle', onOk: () => restoreData(b.data, 'Yedek geri yüklendi')
      });
    },
    setHomeTheme(el) {
      if (!isHomeTheme(el.dataset.v)) return;
      S.settings = Object.assign({}, S.settings, { homeTheme: el.dataset.v });
      saveSettings();
      applyTheme();
    },
    setTheme(el) {
      if (!isTheme(el.dataset.v)) return;
      S.settings = Object.assign({}, S.settings, { theme: el.dataset.v });
      saveSettings();
      applyTheme();
    },
    toggleConfirmDelete() { S.settings = Object.assign({}, S.settings, { confirmDelete: !S.settings.confirmDelete }); saveSettings(); },
    toggleSound() {
      const sound = S.settings.sound === false;           // kapalıysa aç, açıksa kapat
      S.settings = Object.assign({}, S.settings, { sound });
      saveSettings();
      if (sound) blip();                                  // açınca örnek sesi çal
    },
    tasimaOzeti() {   // "Verilerimi buluta gönder": önce özet ve onay; bulutta fark varsa önce bulut yedeği indirilir
      const E = window.PlanizeEsitleme; if (!E) return;
      E.tasimaOzeti().then((o) => {
        if (!o.hazir) { showToast(o.neden); render(); return; }
        const s = o.say, y = (k) => (s[k] ? s[k].yerel : 0), u = (k) => (s[k] ? s[k].bulutta : 0);
        const mb = o.resimBayt < 1048576 ? Math.round(o.resimBayt / 1024) + ' KB' : (o.resimBayt / 1048576).toFixed(1).replace('.', ',') + ' MB';
        let body = `Bu cihazdan buluta gidecek: ${y('gorevler')} görev, ${y('notlar')} not, ${y('listeler')} liste, ${y('vizyon_panolar')} Vizyon panosu (${y('vizyon_kutucuklar')} kutucuk), ${o.resim} resim (${mb})` + (y('arsiv') ? `, ${y('arsiv')} arşivli görev` : '') + '.\n';
        if (o.uzakVar) {
          body += `Bulutta zaten kayıtlı: ${u('gorevler')} görev, ${u('notlar')} not, ${u('listeler')} liste, ${u('vizyon_panolar')} Vizyon panosu.\n`;
          body += o.degisecek ? `DİKKAT: ${o.degisecek} kayıt bulutta zaten var ve farklı; bu cihazdaki sürümle DEĞİŞTİRİLECEK. Devam ederseniz önce buluttaki verinin yedeği bir dosya olarak indirilir.\n` : 'Aynı kayıtlar bulutta zaten aynı; üzerine yazılacak bir fark yok.\n';
          body += 'Bulutta olup bu cihazda olmayan kayıtlar silinmez, bu cihaza da gelir.\n';
        } else { body += 'Bulut şu an boş.\n'; }
        body += 'Bu cihazdaki veriler silinmez.';
        askConfirm({
          title: 'Veriler buluta gönderilsin mi?', body, ok: o.degisecek ? 'Yedeği indir ve buluta gönder' : 'Buluta gönder',
          onOk: () => {
            if (o.degisecek) { const yd = E.bulutYedegi(); downloadText(yd.ad, yd.metin); }
            showToast('Veriler buluta gönderiliyor…');
            E.tasimayaBasla().then((r) => showToast(r && r.ok ? 'Veriler buluta gönderildi' : 'Gönderme tamamlanamadı: ' + ((r && r.mesaj) || 'bağlantıyı kontrol edip tekrar deneyin')));
          }
        });
        render();
      });
    },
    esitleSimdi() { if (window.PlanizeEsitleme) window.PlanizeEsitleme.simdi(); },
    cakismaGeriGetir(el) { if (window.PlanizeEsitleme && window.PlanizeEsitleme.geriGetir(el.dataset.v)) showToast('Önceki sürüm geri getirildi'); },
    silmeOnayla() { if (window.PlanizeEsitleme) window.PlanizeEsitleme.frenOnayla(); },
    cikisYap() {
      askConfirm({
        title: 'Çıkış yapılsın mı?', body: 'Bu cihazdaki verileriniz silinmez. Yeniden giriş yapana kadar uygulama kilitli kalır.', ok: 'Çıkış yap',
        onOk: () => { S.settingsOpen = false; if (window.PlanizeGiris) window.PlanizeGiris.cikis(); }
      });
    },
    downloadRecovery(el) {
      const r = readArr(KEY_RECOVERY);
      const item = r.ok ? r.value[+el.dataset.v] : null;
      if (item) downloadText(`planize-kurtarma-${item.key}-${iso(new Date(item.at))}.json`, String(item.raw));
    },
    deleteRecovery(el) {
      const i = +el.dataset.v;
      askConfirm({
        title: 'Kurtarma kopyası silinsin mi?', body: 'Bu işlem geri alınamaz. Gerekirse önce "İndir" ile bir kopyasını alın.', ok: 'Kalıcı olarak sil', danger: true,
        onOk: () => {
          const r = readArr(KEY_RECOVERY);
          if (!r.ok) return;
          try { PlanizeDepo.koy(KEY_RECOVERY, JSON.stringify(r.value.filter((_, j) => j !== i))); } catch (e) { S.saveError = true; }
        }
      });
    },
    // Uyarı şeritleri
    retrySave() { if (writeAll()) { S.saveError = false; showToast('Tüm değişiklikler kaydedildi'); } },
    downloadCorrupt() { downloadText(`planize-bozuk-veri-${iso(new Date())}.json`, JSON.stringify(corruptFound, null, 2)); },
    unblockWrites() {
      askConfirm({
        title: 'Kayıt açılsın mı?',
        body: 'Okunamayan veri, ilk değişiklikte üzerine yazılarak kaybolabilir. Önce "Bozuk veriyi indir" ile bir kopyasını almanız önerilir.',
        ok: 'Kaydı aç', danger: true, onOk: () => { S.writeBlocked = false; S.blockReason = null; }
      });
    },
    dismissCorrupt() { S.corruptNotice = false; },
    dismissMultiWin() { S.multiWinDismissed = true; }
  };

  // Dışarı tıklayınca açık menüleri kapat (tıklama içinde yapılır ki hedef öğe kaybolmasın)
  function closeOutside(target) {
    const inside = (sel) => !!target.closest(sel);
    let ch = false;
    if (S.menuOpen && !inside('.new-wrap')) { S.menuOpen = false; ch = true; }
    if (S.sideOverlay && !inside('.side') && !inside('.menu-fab')) { S.sideOverlay = false; ch = true; }
    if (S.sortMenuOpen && !inside('.sort-row')) { S.sortMenuOpen = false; ch = true; }
    if (S.moveMenuOpen && !inside('.move-wrap')) { S.moveMenuOpen = false; ch = true; }
    if (S.composerOpen && !inside('.composer') && draftEmpty()) { S.composerOpen = false; S.draft = emptyDraft(); S.dateWarn = false; ch = true; }
    return ch;
  }

  document.addEventListener('click', (e) => {
    let changed = S.page === 'planner' ? closeOutside(e.target) : false;
    if (S.page === 'vizyon' && S.vzMenu && !e.target.closest('.vz-sekme-ak')) { S.vzMenu = false; changed = true; }
    if (S.page === 'vizyon' && S.vzKirp && !e.target.closest('.vz-resim-alan.kirpiyor')) { S.vzKirp = null; changed = true; }   // kırpma modunda dışarı tıklayınca değişiklik kalır (Bitti)
    if (S.page === 'vizyon' && S.vzSecim && !e.target.closest(`[data-kutu="${S.vzSecim}"]`) && !e.target.closest('[data-act=vzBlokCubuk]')) { vzSecimIptal(); changed = true; }   // seçim yapmadan dışarı tıklayınca boş kutucuk sessizce silinir
    if (S.page === 'vizyon' && S.vzAcik && !e.target.closest('.vz-kutu-menu, .vz-firca-panel, [data-act=vzUcNokta], [data-act=vzFirca], [data-act=vzKilitMenu]')) { S.vzAcik = null; changed = true; }   // kutucuk menüsü dışına tıklayınca kapanır   // Pano menüsü dışına tıklayınca kapanır
    // 22a: gün penceresi dışına (takvim kutusu dışına) tıklanınca kapanır
    if (S.page === 'home' && S.homeDay && !e.target.closest('.h-cal')) { S.homeDay = null; changed = true; }
    const el = e.target.closest('[data-act]');
    const fn = el && ACT[el.dataset.act];
    if (fn) { fn(el, e); render(); return; }
    if (changed) render();
  });

  // ---------- Yazma alanları ----------
  const IN = {
    homeQuery(el) { S.homeQuery = el.value; return false; },
    // Vizyon: yazarken ekran yeniden çizilmez (odak kaybolmasın)
    vzText(el) { VZ.updateBlock(el.dataset.tid, el.dataset.bid, { text: el.value }); vzYaziBoyu(el); vzSigdir(); return false; },   // yazdıkça alan ve kutucuk içeriğe göre uzar
    // Ölçek (kaydırıcı ve sayı kutusu): yazarken/sürüklerken ekran yeniden çizilmez, yalnızca resim ve eş kontrol güncellenir
    vzResimOlcek(el) { const v = parseFloat(el.value); if (isFinite(v)) vzResimUygula(el.dataset.tid, el.dataset.bid, { scale: v }); return false; },
    vzCaption(el) { VZ.updateBlock(el.dataset.tid, el.dataset.bid, { caption: el.value }); el.classList.toggle('bos', !el.value); return false; },
    vzBaslikYaz(el) { el.size = Math.max(6, el.value.length + 1); return false; },   // başlık alanı yazıya göre genişler; kalanı sürükleme alanı
    vzListText(el) { const b = VZ.getBlock(el.dataset.tid, el.dataset.bid); if (b) VZ.updateBlock(el.dataset.tid, b.id, VizyonMantik.Liste.degistir(b, el.dataset.iid, el.value)); return false; },
    vzCell(el) { const b = VZ.getBlock(el.dataset.tid, el.dataset.bid); if (b) VZ.updateBlock(el.dataset.tid, b.id, VizyonMantik.Tablo.hucre(b, +el.dataset.r, +el.dataset.c, el.value)); return false; },
    composer(el) {
      const v = el.value; const d = S.draft;
      const found = nlDate(v);
      const next = Object.assign({}, d, { title: v });
      if (!d.dateManual) { next.date = found ? found.date : ''; next.nlWord = found ? found.word : ''; }
      S.draft = next; S.composerOpen = true;
      return true;
    },
    // 17: başlık, not ve adımlar yazmayı bırakınca kaydedilir (patchSoon)
    title(el) { patchSoon(S.openId, (x) => Object.assign({}, x, { title: el.value })); return true; },
    note(el) { patchSoon(S.openId, (x) => Object.assign({}, x, { note: el.value })); return false; },
    step(el) { const sid = el.dataset.sid; patchSoon(S.openId, (x) => Object.assign({}, x, { subtasks: x.subtasks.map((s) => (s.id === sid ? Object.assign({}, s, { title: el.value }) : s)) })); return false; },
    listName(el) { S.lf.name = el.value; return true; },
    noteDraft(el) { S.noteDraft = el.value; return true; },
    // 20b: düzenlenen notu yazdıkça güncelle (kayıt geciktirilir, ekran yeniden çizilmez)
    noteEdit(el) {
      const id = el.dataset.id;
      S.notes = S.notes.map((n) => (n.id === id ? Object.assign({}, n, { text: el.value, updatedAt: Date.now() }) : n));
      saveNotesSoon();
      return false;
    },
    search(el) { S.searchQuery = el.value; return true; }
  };
  document.addEventListener('input', (e) => {
    const k = e.target.dataset && e.target.dataset.in;
    if (!k || !IN[k]) return;
    if (IN[k](e.target)) render();
  });

  // 19b: tekrar seçicinin hangi tekrar nesnesi üzerinde çalıştığı
  const repOf = (ctx) => (ctx === 'draft' ? S.draft.repeat : (findTask(S.openId) || {}).repeat || null);
  const repDateOf = (ctx) => (ctx === 'draft' ? S.draft.date : (findTask(S.openId) || {}).date || '');
  function setRep(ctx, r) {
    if (ctx === 'draft') S.draft = Object.assign({}, S.draft, { repeat: r });
    else if (S.openId) patch(S.openId, (x) => Object.assign({}, x, { repeat: r }));
  }

  const CH = {
    vzResimSec(el) {
      const f = el.files && el.files[0];
      if (!f) return;
      const tid = el.dataset.tid; const bid = el.dataset.bid;
      VizyonResim.ekle(f).then((res) => {
        const r = VZ.updateBlock(tid, bid, { src: res.id });
        if (!r.ok) { VizyonResim.sil(res.id); return; }      // blok bu arada silindi
        vzYetimSil(r);                                        // değiştirilen eski resim başka yerde yoksa silinir
        render();
        vzResimOraniUydur(tid, res);
      }).catch((err) => { showToast((err && err.message) || 'Resim eklenemedi.'); render(); });
    },
    vzKutuBaslik(el) { VZ.updateTile(el.dataset.tid, { title: el.value }); },                  // boş başlık eski başlığı korur
    vzLayout(el) { vzKilitli(VZ.setTileLayout(el.dataset.tid, { [el.dataset.k]: el.valueAsNumber })); },
    repEvery(el) { const ctx = el.dataset.ctx; const r = repOf(ctx); if (r) setRep(ctx, makeRepeat(r.type, repDateOf(ctx), r.days, el.value)); },
    repUnit(el) { const ctx = el.dataset.ctx; const r = repOf(ctx); if (r) setRep(ctx, makeRepeat(el.value, repDateOf(ctx), el.value === 'weekly' ? r.days : [], everyOf(r))); },
    draftDate(el) { S.dateWarn = false; S.draft = Object.assign({}, S.draft, { date: el.value, dateManual: true, nlWord: '' }); },
    dpDate(el) { setTaskDate(S.openId, el.value); },
    dpList(el) {
      const t = findTask(S.openId);
      const list = el.value || null;
      if (t && !calendarOk(list, t.date)) { showToast(CAL_DATE_MSG); return; }   // seçim geri döner (yeniden çizimde)
      patch(S.openId, (x) => Object.assign({}, x, { list }));
    }
  };

  // Görevin son tarihini değiştirir; Takvim kaydının tarihi kaldırılamaz (9a)
  function setTaskDate(id, date) {
    const t = findTask(id);
    if (!t) return;
    if (!calendarOk(t.list, date)) { showToast('Takvim kayıtlarının tarihi olmalı; tarih kaldırılamaz.'); return; }
    patch(id, (x) => withDate(x, date));
  }
  document.addEventListener('change', (e) => {
    const k = e.target.dataset && e.target.dataset.ch;
    if (!k || !CH[k]) return;
    CH[k](e.target);
    render();
  });

  document.addEventListener('focusin', (e) => {
    const fk = e.target.dataset && e.target.dataset.fk;
    if (fk === 'composer' && !S.composerOpen) { S.composerOpen = true; render(); }
    // 10: başlık düzenlenmeye başlarken eski başlığı hatırla
    if (fk === 'dp-title' && !S.rendering) { const t = findTask(S.openId); S.titleBefore = t ? { id: t.id, title: t.title } : null; }
  });
  // 10: başlık boş bırakılıp alandan çıkılırsa eski başlık geri gelir (yeniden çizim sırasındaki odak kaybı sayılmaz)
  document.addEventListener('focusout', (e) => {
    if (S.rendering || !(e.target.dataset && e.target.dataset.fk === 'dp-title')) return;
    const b = S.titleBefore;
    const t = b && findTask(b.id);
    if (t && !t.title.trim()) {
      patch(t.id, (x) => Object.assign({}, x, { title: b.title.trim() ? b.title : 'Başlıksız görev' }));
      setTimeout(render, 0);   // odak değişimi bitince çiz
    } else if (t && t.title !== t.title.trim()) {
      patch(t.id, (x) => Object.assign({}, x, { title: x.title.trim() }));
    }
    S.titleBefore = null;
  });

  const ENTER = {
    composer() { addTask(); },
    stepAdd(el) {
      const v = el.value.trim();
      if (!v || !S.openId) return;
      patch(S.openId, (x) => Object.assign({}, x, { subtasks: x.subtasks.concat([{ id: uid(), title: v, done: false }]) }));
      el.value = '';
      S.focusNext = 'step-new';
    },
    listName() { createList(); },
    vzPanoAdTamam(el) {                                    // Enter: kaydet (boş ad eski adı korur); alandan çıkış da kaydeder (focusout)
      const p = vzAktifPano();
      if (p) VZ.renameBoard(p.id, el.value);
      S.vzAdlandir = false;
    },
    vzListAdd(el) {
      const v = el.value.trim();
      const b = VZ.getBlock(el.dataset.tid, el.dataset.bid);
      if (!v || !b) return;
      VZ.updateBlock(el.dataset.tid, b.id, VizyonMantik.Liste.ekle(b, v));
      S.focusNext = 'vz-liste-' + b.id;
    },
    homeSearch(el) { const q = el.value; S.homeQuery = ''; go('planner', () => { S.searchOpen = true; S.searchQuery = q; S.focusNext = 'search'; }); }
  };

  // ---------- Klavye ----------
  document.addEventListener('keydown', (e) => {
    const el = e.target || {};
    // Açık bir pencere (onay / ayarlar) varken yalnızca Esc işlenir; Enter odaktaki düğmeye kalır
    if (S.confirm || S.settingsOpen) {
      if (e.key === 'Escape') { e.preventDefault(); if (S.confirm) S.confirm = null; else S.settingsOpen = false; render(); }
      return;
    }
    const k = el.dataset && el.dataset.key;
    if (k && e.key === 'Enter' && ENTER[k]) { e.preventDefault(); ENTER[k](el); render(); return; }
    // 20b: yeni notu Ctrl+Enter ile kaydet; düzenlenen notta Esc veya Ctrl+Enter düzenlemeyi bitirir
    const fkey = el.dataset && el.dataset.fk;
    if (fkey === 'note-new' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); createNote(); render(); return; }
    if (fkey === 'note-edit' && (e.key === 'Escape' || (e.key === 'Enter' && (e.ctrlKey || e.metaKey)))) { e.preventDefault(); finishNoteEdit(); render(); return; }
    // 22a: Anasayfa'da gün penceresi Esc ile kapanır
    if (S.page === 'home' && S.homeDay && e.key === 'Escape') { S.homeDay = null; render(); return; }
    if (S.page !== 'planner') return;

    const tag = (el.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || el.isContentEditable;
    if ((e.ctrlKey || e.metaKey) && (e.key === 'b' || e.key === 'B')) { e.preventDefault(); ACT.toggleSidebar(); render(); return; }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); pickQuick('task'); render(); return; }
    if (e.key === 'Escape') {
      if (typing && el.blur) el.blur();
      if (S.sideOverlay) {
        S.sideOverlay = false;
      } else if (S.searchOpen || S.menuOpen || S.quick || S.sortMenuOpen || S.moveMenuOpen || S.picked.length || S.composerOpen) {
        S.searchOpen = false; S.menuOpen = false; S.quick = null; S.sortMenuOpen = false; S.moveMenuOpen = false; S.picked = [];
        S.composerOpen = false; S.draft = emptyDraft(); S.dateWarn = false;
      } else if (S.openId) {
        S.openId = null;
      }
      render();
      return;
    }
    if (typing) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); moveSel(e.key === 'ArrowDown' ? 1 : -1); render(); return; }
    if (e.key === 'Enter' && S.selectedId) { e.preventDefault(); S.openId = S.selectedId; render(); return; }
    if (e.key === ' ' || e.key === 'Spacebar') {
      if (!S.selectedId) return;
      e.preventDefault(); toggleTask(S.selectedId); render(); return;
    }
    if (e.key === 'Delete') {
      if (!S.selectedId) return;
      e.preventDefault(); requestDelete([S.selectedId]); render(); return;
    }
    if (e.key === '/') { e.preventDefault(); ACT.openSearch(); render(); return; }
    const jump = { 1: 'today', 2: 'planned', 3: 'important', 4: 'all', 5: 'notes' }[e.key];
    if (jump) { finishNoteEdit(); S.view = jump; S.activeList = null; S.dayFilter = null; S.selectedId = null; render(); }
  });

  // ---------- Sürükle-bırak ----------
  function mark(el, cls) {
    document.querySelectorAll('.drag-over, .lrow.drop').forEach((n) => { if (n !== el) n.classList.remove('drag-over', 'drop'); });
    if (el) el.classList.add(cls);
  }
  document.addEventListener('dragstart', (e) => {
    const a = e.target.closest && e.target.closest('[data-drag]');
    if (!a) return;
    S.dragId = a.dataset.drag;
    a.classList.add('dragging');
    try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', S.dragId); } catch (err) { /* yoksay */ }
  });
  document.addEventListener('dragover', (e) => {
    if (!S.dragId) return;
    const a = e.target.closest('[data-drag]');
    const l = e.target.closest('[data-drop-list]');
    if (a && a.dataset.drag !== S.dragId) { e.preventDefault(); mark(a, 'drag-over'); }
    else if (l) { e.preventDefault(); mark(l, 'drop'); }
    else mark(null);
  });
  document.addEventListener('drop', (e) => {
    if (!S.dragId) return;
    e.preventDefault();
    const a = e.target.closest('[data-drag]');
    const l = e.target.closest('[data-drop-list]');
    const id = S.dragId;
    if (a) reorder(id, a.dataset.drag);
    else if (l) {
      const t = findTask(id);
      if (t && !calendarOk(l.dataset.dropList, t.date)) showToast(CAL_DATE_MSG);   // 9a
      else patch(id, (x) => Object.assign({}, x, { list: l.dataset.dropList }));
    }
    S.dragId = null;
    render();
  });
  document.addEventListener('dragend', () => { if (S.dragId) { S.dragId = null; render(); } else mark(null); });

  // ---------- Başka pencereden gelen değişiklikler ----------
  const SYNC_KEYS = [KEY, KEY_LISTS, KEY_NOTES, KEY_LOG, KEY_ARCHIVE, KEY_CALCOLOR, KEY_SETTINGS, KEY_VIZYON];
  PlanizeDepo.disaridanDegisti((e) => {
    if (e.key && SYNC_KEYS.indexOf(e.key) < 0) return;   // pencere varlık kaydı ve yedekler ekranı yenilemesin
    if (e.key === KEY_VIZYON) {                          // başka pencere Vizyon verisini değiştirdi (okunamıyorsa mevcut kalır)
      try { const o = JSON.parse(e.newValue); if (o) VZ.yukle(o); } catch (err) { /* yoksay */ }
      if (S.page === 'vizyon' && vzSur) return;          // sürükleme sürerken ekranı bozma
      render(); return;
    }
    reloadFromStorage();
    render();
  });

  if (window.PlanizeGiris) window.PlanizeGiris.dinle(() => { if (!S.dragId) render(); });   // giriş/çıkış sonrası ekranı (Ayarlar > Hesap dahil) yenile

  if (window.PlanizeEsitleme) window.PlanizeEsitleme.dinle((o) => {   // eşitleme hatası bildirimi; Ayarlar açıksa eşitleme bölümünü yenile
    if (o.tur === 'hata') showToast(o.mesaj);
    if ((o.tur === 'cakisma' || o.tur === 'durum') && S.settingsOpen && !S.dragId) render();
  });

  // 14: gün değişti mi? (gece yarısı, bilgisayar uykudan uyanınca veya pencereye dönünce)
  // Değiştiyse odak ve imleç korunarak ekran yenilenir; günlük yedek ve arşiv çalışır.
  let lastDay = iso(new Date());
  function checkDayChange() {
    const day = iso(new Date());
    if (day === lastDay) return false;
    lastDay = day;
    autoBackup();
    archiveOld();
    if (!S.dragId) render();
    return true;
  }
  setInterval(() => {
    if (checkDayChange()) return;
    if (!S.dragId && !document.querySelector(':focus')) render();   // saatle değişen selamlama vb.
  }, 60000);
  window.addEventListener('focus', checkDayChange);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkDayChange(); });

  // 18: pencere genişliğini izle
  const mqNarrow = window.matchMedia('(max-width: 900px)');
  const mqTiny = window.matchMedia('(max-width: 600px)');
  function syncWidth() {
    S.narrow = mqNarrow.matches; S.tiny = mqTiny.matches;
    if (!S.narrow) S.sideOverlay = false;
  }
  syncWidth();
  const onWidth = () => { syncWidth(); if (!S.dragId) render(); };
  if (mqNarrow.addEventListener) { mqNarrow.addEventListener('change', onWidth); mqTiny.addEventListener('change', onWidth); }
  else { mqNarrow.addListener(onWidth); mqTiny.addListener(onWidth); }

  // Yedekten yükle: dosya seçilince
  document.getElementById('import-file').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) handleImportFile(f);
  });

  // Çoklu pencere denetimi
  presenceTick();
  setInterval(presenceTick, 5000);
  // Kapanırken: bekleyen kaydı hemen yaz, pencere kaydını sil
  window.addEventListener('beforeunload', () => { flushSave(); presenceLeave(); });
  window.addEventListener('pagehide', () => { flushSave(); presenceLeave(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });

  archiveOld();

  autoBackup();
  render();
  pageElOf(S.page).classList.add('pg-in');
})();
</script>
