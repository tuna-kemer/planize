    if (rs.length) data.resimler = rs;
    const payload = { app: 'planim', version: 1, exportedAt: now.toISOString(), data };
    downloadText(`planize-yedek-${iso(now)}-${pad(now.getHours())}${pad(now.getMinutes())}.json`, JSON.stringify(payload, null, 2));
    S.settings = Object.assign({}, S.settings, { lastExport: Date.now() });
    saveSettings();
    showToast('Yedek dosyası indirildi' + (rs.length ? ' (' + rs.length + ' resim dahil)' : ''));
  }
  // Bu cihaz bulutla eşitleniyorsa, yedek yüklemenin sonucu buluta ve diğer cihazlara da yansır: onay penceresinde açıkça yazılır
  const bulutNotu = () => (window.PlanizeEsitleme && window.PlanizeEsitleme.aktifMi()
    ? '\nBu cihaz bulutla eşitleniyor: yedek yüklenince bulutta ve diğer cihazlardaki veriler de bu yedeğe göre değişir (yedekte olmayan kayıtlar her yerden silinir). "Geri al" bu cihazı eski haline döndürür ve bunu da buluta yansıtır.' : '');
  function handleImportFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      let obj = null;
      try { obj = JSON.parse(reader.result); } catch (e) { obj = null; }
      if (!obj || obj.app !== 'planim' || !obj.data || !Array.isArray(obj.data.tasks)) { showToast('Bu dosya bir Planize yedeği değil.'); render(); return; }
      const when = obj.exportedAt ? new Date(obj.exportedAt) : null;
      askConfirm({
        title: 'Yedek yüklensin mi?',
        body: `Yedek${when && !isNaN(when) ? ' (' + fmtDateTime(when) + ')' : ''}: ${dataSummary(obj.data)}\nŞu anki veriler (${dataSummary(collectData())}) bu yedekle değiştirilecek. Hemen ardından "Geri al" ile eski haline dönebilirsiniz.${bulutNotu()}`,
        ok: 'Yedeği yükle', onOk: () => { resimleriYedektenYukle(obj.data.resimler).catch(() => 0).then(() => restoreData(obj.data, 'Yedek yüklendi')); }
      });
      render();
    };
    reader.onerror = () => { showToast('Dosya okunamadı.'); render(); };
    reader.readAsText(file);
  }

  // Günlük otomatik iç yedek: her gün ilk açılışta (ve gün değişince) bir kopya, en fazla 7 gün
  function autoBackup() {
    if (S.writeBlocked || corruptFound.length) return;          // bozuk/eksik veriyle iyi yedekleri itme
    if (!S.tasks.length && !S.lists.length && !S.notes.length) return;
    const today = iso(new Date());
    const r = readArr(KEY_BACKUPS);
    let list = r.ok ? r.value : [];
    if (list.some((b) => b.date === today)) return;
    list = [{ date: today, at: Date.now(), data: collectData() }].concat(list).slice(0, 7);
    while (list.length) {
      try { PlanizeDepo.koy(KEY_BACKUPS, JSON.stringify(list)); S.backupFail = false; return; } catch (e) {
        if (list.length === 1) { S.backupFail = true; return; }
        list = list.slice(0, -1);                                  // yer açmak için en eski yedeği bırak
      }
    }
  }

  // ---------- Çoklu pencere uyarısı ----------
  const WIN_ID = uid();
  function presenceTick() {
    let m = readObj(KEY_PRESENCE) || {};
    const now = Date.now();
    Object.keys(m).forEach((k) => { if (now - m[k] > 15000) delete m[k]; });
    m[WIN_ID] = now;
    try { PlanizeDepo.koy(KEY_PRESENCE, JSON.stringify(m)); } catch (e) { /* yoksay */ }
    const others = Object.keys(m).some((k) => k !== WIN_ID);
    if (others !== S.multiWin) {
      S.multiWin = others;
      if (!others) S.multiWinDismissed = false;
      if (!S.dragId) render();
    }
  }
  function presenceLeave() {
    const m = readObj(KEY_PRESENCE) || {};
    delete m[WIN_ID];
    try { PlanizeDepo.koy(KEY_PRESENCE, JSON.stringify(m)); } catch (e) { /* yoksay */ }
  }

  function reorder(dragId, overId) {
    if (!dragId || dragId === overId) return;
    const visible = S.flat.slice();
    const from = visible.indexOf(dragId);
    const to = visible.indexOf(overId);
    if (from < 0 || to < 0) return;
    visible.splice(from, 1);
    visible.splice(to, 0, dragId);
    const orderMap = {};
    visible.forEach((id, i) => { orderMap[id] = i * 10; });
    S.sortMode = 'manual';
    saveUI();
    persist(S.tasks.map((t) => (orderMap[t.id] !== undefined ? Object.assign({}, t, { order: orderMap[t.id] }) : t)));
  }

  function openTaskInView(id) {
    const t = findTask(id);
    if (!t) return;
    const todayIso = iso(new Date());
    S.openId = id; S.selectedId = id; S.dayFilter = null; S.quick = null; S.searchOpen = false;
    if (t.list) { S.view = 'list'; S.activeList = t.list; }
    else { S.activeList = null; S.view = t.important ? 'important' : (t.date && t.date > todayIso ? 'planned' : 'today'); }
    if (t.done) S.showCompleted = true;
  }

  function moveSel(dir) {
    const f = S.flat;
    if (!f.length) return;
    const i = f.indexOf(S.selectedId);
    const n = i < 0 ? (dir > 0 ? 0 : f.length - 1) : Math.min(f.length - 1, Math.max(0, i + dir));
    S.selectedId = f[n];
  }

  function openListForm(l) {
    S.quick = 'list'; S.menuOpen = false;
    S.lf = { editId: l ? l.id : null, name: l ? l.name : '', color: l ? l.color : 3, icon: l ? (l.icon || 'work') : 'work', parent: l ? (l.parent || null) : null };
    S.focusNext = 'list-name';
  }
  function closeQuick() { S.quick = null; S.noteDraft = ''; S.lf = { name: '', color: 3, icon: 'work', editId: null, parent: null }; }
  function saveLists(lists) { S.lists = lists; store(KEY_LISTS, lists); }
  function createList() {
    const lf = S.lf;
    const name = lf.name.trim();
    if (lf.editId === SYS_CAL) {
      S.calColor = lf.color;
      store(KEY_CALCOLOR, lf.color);
      closeQuick();
      return;
    }
    if (!name) return;
    // 7a: en fazla 2 seviye. Üst liste yalnızca kök liste veya Takvim olabilir; alt listesi olan liste başka listenin altına giremez.
    const parent = lf.parent;
    if (parent) {
      const p = parent === SYS_CAL ? null : S.lists.find((l) => l.id === parent);
      if (parent !== SYS_CAL && (!p || p.parent || p.id === lf.editId)) { showToast('Bu liste üst liste olarak seçilemez (en fazla 2 seviye).'); return; }
      if (lf.editId && S.lists.some((l) => l.parent === lf.editId)) { showToast('Alt listeleri olan bir liste başka bir listenin altına alınamaz.'); return; }
      // 9a: Takvim'in altına alınan listedeki tüm kayıtların tarihi olmalı
      if (lf.editId && parent === SYS_CAL) {
        const undated = S.tasks.filter((t) => t.list === lf.editId && !calendarOk(SYS_CAL, t.date)).length;
        if (undated) { showToast(`Bu listede ${undated} tarihsiz görev var. ${CAL_DATE_MSG}`); return; }
      }
    }
    if (lf.editId) {
      saveLists(S.lists.map((l) => (l.id === lf.editId ? Object.assign({}, l, { name, color: lf.color, icon: lf.icon, parent: lf.parent }) : l)));
    } else {
      const id = uid();
      saveLists(S.lists.concat([{ id, name, color: lf.color, icon: lf.icon, parent: lf.parent }]));
      S.view = 'list'; S.activeList = id;
    }
    closeQuick();
  }
  function deleteList(id) {
    const index = S.lists.findIndex((l) => l.id === id);
    if (index < 0) return;
    const list = S.lists[index];
    const kidIds = S.lists.filter((l) => l.parent === id).map((l) => l.id);
    const movedIds = S.tasks.filter((t) => t.list === id).map((t) => t.id);
    saveLists(S.lists.filter((l) => l.id !== id).map((l) => (l.parent === id ? Object.assign({}, l, { parent: null }) : l)));
    persist(S.tasks.map((t) => (t.list === id ? Object.assign({}, t, { list: null }) : t)));
    if (S.activeList === id) { S.activeList = null; S.view = 'today'; }
    closeQuick();
    showToast(`"${list.name}" listesi silindi`, () => {
      // Listeyi geri koy; yalnızca hâlâ taşındığı yerde duran alt listeleri ve görevleri geri bağla
      saveLists(reinsert(S.lists, [{ item: list, index }]).map((l) => (kidIds.indexOf(l.id) >= 0 && !l.parent ? Object.assign({}, l, { parent: id }) : l)));
      persist(S.tasks.map((t) => (movedIds.indexOf(t.id) >= 0 && !t.list ? Object.assign({}, t, { list: id }) : t)));
    });
  }
  function requestDeleteList() {
    const id = S.lf.editId;
    if (!id || id === SYS_CAL) return;
    const l = listById(id);
    const n = S.tasks.filter((t) => t.list === id).length;
    const kids = S.lists.filter((x) => x.parent === id).length;
    askConfirm({
      title: `"${l ? l.name : 'Liste'}" listesi silinsin mi?`,
      body: (n ? `İçindeki ${n} görev silinmeyecek, "Listesiz"e taşınacak.` : 'Liste boş.') +
        (kids ? `\n${kids} alt liste üst seviyeye çıkacak.` : '') + '\nHemen ardından "Geri al" ile geri getirebilirsiniz.',
      ok: 'Listeyi sil', danger: true, onOk: () => deleteList(id)
    });
  }
  function createNote() {
    const text = S.noteDraft.trim();
    if (!text) return;
    finishNoteEdit();
    S.notes = [{ id: uid(), text, createdAt: Date.now() }].concat(S.notes);
    store(KEY_NOTES, S.notes);
    S.noteDraft = '';
    S.focusNext = 'note-new';
  }

  // 20b: not düzenleme. Yazarken kayıt geciktirilir; "Bitti"de boş kalan not silinir (Geri al ile döner).
  let noteSaveTimer = null;
  function saveNotesSoon() {
    clearTimeout(noteSaveTimer);
    noteSaveTimer = setTimeout(() => { noteSaveTimer = null; if (!store(KEY_NOTES, S.notes)) render(); }, 400);
  }
  function flushNotes() { if (noteSaveTimer) { clearTimeout(noteSaveTimer); noteSaveTimer = null; store(KEY_NOTES, S.notes); } }
  let noteOrig = null;   // düzenleme başlamadan önceki not (boşaltılıp silinirse "Geri al" bunu geri getirir)
  function startNoteEdit(id) {
    if (S.editNoteId === id) return;
    finishNoteEdit();
    S.editNoteId = id;
    noteOrig = Object.assign({}, S.notes.find((x) => x.id === id) || {});
    S.focusNext = 'note-edit';
  }
  function finishNoteEdit() {
    const id = S.editNoteId;
    if (!id) return;
    S.editNoteId = null;
    const n = S.notes.find((x) => x.id === id);
    if (n && !n.text.trim()) {
      // Silmeden önce notu ilk haline döndür ki "Geri al" boş not değil eski metni getirsin
      if (noteOrig && noteOrig.id === id) S.notes = S.notes.map((x) => (x.id === id ? noteOrig : x));
      deleteNote(id);
    }
    flushNotes();
    noteOrig = null;
  }
  function showNotesView(flashId) {
    S.view = 'notes'; S.activeList = null; S.dayFilter = null; S.openId = null; S.quick = null; S.searchOpen = false;
    if (flashId) {
      S.flashNote = flashId;
      setTimeout(() => { if (S.flashNote === flashId) { S.flashNote = null; render(); } }, 1800);
    }
  }

  function pickQuick(kind) {
    S.menuOpen = false;
    if (kind === 'task') { S.quick = null; S.composerOpen = true; S.focusNext = 'composer'; return; }
    if (kind === 'list') { openListForm(null); return; }
    if (kind === 'note') { showNotesView(); S.focusNext = 'note-new'; return; }
    if (kind === 'subtask') {
      if (S.openId) { S.quick = null; S.focusNext = 'step-new'; return; }
      S.quick = 'subtask';
    }
  }

  // ---------- Sayfa geçişi ----------
  const homeEl = document.getElementById('home');
  const plEl = document.getElementById('planner');
  const vzEl = document.getElementById('vizyon');
  const pageElOf = (p) => (p === 'home' ? homeEl : p === 'vizyon' ? vzEl : plEl);
  const HASH_OF = { home: '#anasayfa', planner: '#planlayici', vizyon: '#vizyon' };
  const sideEl = document.getElementById('pl-side');
  const plHeadEl = document.getElementById('pl-head');
  // Ortak üst çubuk (Anasayfa ve Vizyon Panosu'ndakiyle aynı menü); yalnızca gezinme, Planlayıcı işlevlerine bağlı değil
  function plHeadHTML() {
    return `<span class="mark" role="img" aria-label="Planize"><svg viewBox="0 0 1204 1204" aria-hidden="true" focusable="false"><rect width="1204" height="1204" rx="228" fill="#000"/><path fill="#E5E2D0" d="M258.8 250.8H729.1V353.1H554.1V828.8H433.4V353.1H258.8Z"/><path fill="#FFF" d="M496.8 446.5H602.6V652.7L796.3 446.5H933.1L726.3 654.1L945.2 953.3H808.7L652.2 731L602.6 781.6V953.3H496.8Z"/></svg></span>
      <nav class="h-nav">
        <button class="h-ni" data-act="goHome">Anasayfa</button>
        <span class="h-ni on">Planlayıcı</span>
        <span class="h-ni locked">Portföy ${ms('lock')}</span>
        <button class="h-ni" data-act="goVizyon">Vizyon Panosu</button>
      </nav>
      <span class="h-sp"></span>
      ${esitEtiket()}<button class="h-nb h-gear" data-act="openSettings" title="Ayarlar">${ms('settings')}</button>`;
  }
  const mainEl = document.getElementById('pl-main');
  const detailEl = document.getElementById('pl-detail');
  const overEl = document.getElementById('pl-over');
  const globalEl = document.getElementById('global');

  function go(page, after) {
    if (S.page === page) { if (after) after(); render(); return; }
    const cur = pageElOf(S.page);
    cur.classList.remove('pg-in');
    cur.classList.add('pg-out');
    setTimeout(() => {
      cur.classList.remove('pg-out');
      S.page = page;
      try { history.replaceState(null, '', HASH_OF[page] || '#anasayfa'); } catch (e) { /* yoksay */ }
      if (after) after();
      render();
      const nx = pageElOf(page);
      nx.classList.remove('pg-in'); void nx.offsetWidth; nx.classList.add('pg-in');
    }, 190);
  }

  // ---------- ANASAYFA ----------
  // 22a: takvimde tıklanan günün küçük penceresi: tatil, özel günler, o güne tarihli görevler
  function homeDayPopHTML(key, holidayName, cids, col, up) {
    const d = parse(key);
    const todayIso = iso(new Date());
    const diff = Math.round((d - parse(todayIso)) / 86400000);
    const rel = diff === 0 ? ' · Bugün' : diff === 1 ? ' · Yarın' : diff === -1 ? ' · Dün' : '';
    const y = d.getFullYear(); const m = d.getMonth();
    const specials = S.tasks.filter((t) => cids.indexOf(t.list) >= 0 && occurrencesInMonth(t, y, m).indexOf(key) >= 0);
    const tasks = S.tasks.filter((t) => cids.indexOf(t.list) < 0 && t.date === key);
    const row = (t, icon) => `<button class="h-prow${t.done ? ' done' : ''}" data-act="homeOpen" data-id="${t.id}">
        ${ms(icon)}<span class="tt">${esc(t.title)}</span>${t.repeat ? `<span class="rp" title="${esc(repeatLabel(t.repeat))}">${ms('autorenew')}</span>` : ''}</button>`;
    const body = [
      holidayName ? `<div class="h-phol">${ms('celebration')}<span>${esc(holidayName)}</span></div>` : '',
      specials.length ? `<div class="h-pcap">Özel günler</div>${specials.map((t) => row(t, 'event')).join('')}` : '',
      tasks.length ? `<div class="h-pcap">Görevler</div>${tasks.map((t) => row(t, t.done ? 'task_alt' : 'radio_button_unchecked')).join('')}` : ''
    ].join('');
    const side = col <= 1 ? 'left' : col >= 5 ? 'right' : 'mid';
    return `<div class="h-pop ${side}${up ? ' up' : ''}" role="dialog" aria-label="${esc(`${d.getDate()} ${MON[m]}`)}">
      <div class="h-phead"><span class="t">${d.getDate()} ${MON[m]} ${DOW_LONG[d.getDay()]}<span class="rel">${rel}</span></span>
        <button class="h-nb" data-act="homeDayClose" title="Kapat (Esc)">${ms('close')}</button></div>
      ${body || '<div class="h-pempty">Bu gün için kayıt yok.</div>'}
      ${key >= todayIso ? `<button class="h-padd" data-act="homeDayAdd" data-v="${key}">${ms('add')}Bu güne görev ekle</button>` : ''}
    </div>`;
  }

  function homeHTML() {
    const today = new Date();
    const todayIso = iso(today);
    const year = S.cursor.getFullYear();
    const month = S.cursor.getMonth();
    const holidays = holidaySet(year);
    const cids = calIds();

    // Takvim listesindeki özel günler: tamamlanmış tek seferlikler gösterilmez,
    // tekrarlılar bu aydaki her tarihine yansıtılır (yıllık/aylık/haftalık/günlük)
    const special = {};
    S.tasks.forEach((t) => {
      if (cids.indexOf(t.list) < 0) return;
      occurrencesInMonth(t, year, month).forEach((key) => { special[key] = (special[key] || 0) + 1; });
    });

    const lead = (new Date(year, month, 1).getDay() + 6) % 7;
    const dim = new Date(year, month + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < lead; i++) cells.push(null);
    for (let d = 1; d <= dim; d++) cells.push(d);
    while (cells.length % 7 !== 0) cells.push(null);

    const cellsHTML = cells.map((d, idx) => {
      if (!d) return '<div class="h-cell"></div>';
      const key = `${year}-${pad(month + 1)}-${pad(d)}`;
      const hol = holidays[key] ? 1 : 0;
      const spec = special[key] || 0;
      const dots = [];
      if (hol + spec > 3) {
        if (hol) dots.push('<span class="h-dot hol"></span>');
        while (dots.length < 2) dots.push('<span class="h-dot"></span>');
        dots.push('<span class="h-plus">+</span>');
      } else {
        if (hol) dots.push('<span class="h-dot hol"></span>');
        for (let i = 0; i < spec && dots.length < 3; i++) dots.push('<span class="h-dot"></span>');
      }
      const open = S.homeDay === key;
      const cls = 'h-cell' + (key === todayIso ? ' today' : '') + (hol ? ' hol' : '') + (open ? ' sel' : '');
      const label = `${d} ${MON[month]}${hol ? ', ' + holidays[key] : ''}${spec ? `, ${spec} özel gün` : ''}`;
      // 22a: gün düğmesi + açıksa hemen altında (son satırlarda üstünde) küçük pencere
      const row = Math.floor(idx / 7); const col = idx % 7;
      const pop = open ? homeDayPopHTML(key, holidays[key], cids, col, row >= 3) : '';
      return `<div class="h-cellw"><button class="${cls}" data-act="homeDay" data-v="${key}" aria-label="${esc(label)}" aria-expanded="${open}">
        <span class="h-num">${d}</span><span class="h-dots">${dots.join('')}</span></button>${pop}</div>`;
    }).join('');

    let to = todayIso;
    if (S.range === 'week') to = iso(addDays(today, 6));
    if (S.range === 'month') to = iso(new Date(today.getFullYear(), today.getMonth() + 1, 0));
    const todayD = parse(todayIso);
    const items = S.tasks
      .filter((t) => !t.done && t.date && t.date >= todayIso && t.date <= to)
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
    const rows = items.map((t) => {
      const d = parse(t.date);
      const diff = Math.round((d - todayD) / 86400000);
      const when = diff === 0 ? 'Bugün' : diff === 1 ? 'Yarın' : `${d.getDate()} ${MON[d.getMonth()].slice(0, 3)}`;
      const lst = listById(t.list);
      const ic = lst ? `<span class="ms" style="${cv(pcol(lst))};color:var(--ink)">${lst.id === SYS_CAL ? 'event' : esc(lst.icon || 'work')}</span>` : '';
      const subs = t.subtasks.length ? `<span class="sb">${t.subtasks.filter((s) => s.done).length}/${t.subtasks.length}</span>` : '';
      return `<button class="h-row" data-act="homeOpen" data-id="${t.id}"><span class="tt">${esc(t.title)}</span><span class="wh">${when}</span>${ic}${subs}</button>`;
    }).join('');

    const ranges = [['today', 'Bugün'], ['week', 'Bu hafta'], ['month', 'Bu ay']]
      .map((r) => `<button class="${S.range === r[0] ? 'on' : ''}" data-act="range" data-v="${r[0]}">${r[1]}</button>`).join('');

    return `
      <header class="h-head">
        <span class="mark on-dark" role="img" aria-label="Planize"><svg viewBox="0 0 1204 1204" aria-hidden="true" focusable="false"><rect width="1204" height="1204" rx="228" fill="#000"/><path fill="#E5E2D0" d="M258.8 250.8H729.1V353.1H554.1V828.8H433.4V353.1H258.8Z"/><path fill="#FFF" d="M496.8 446.5H602.6V652.7L796.3 446.5H933.1L726.3 654.1L945.2 953.3H808.7L652.2 731L602.6 781.6V953.3H496.8Z"/></svg></span>
        <nav class="h-nav">
          <span class="h-ni on">Anasayfa</span>
          <button class="h-ni" data-act="goPlanner">Planlayıcı</button>
          <span class="h-ni locked">Portföy ${ms('lock')}</span>
          <button class="h-ni" data-act="goVizyon">Vizyon Panosu</button>
        </nav>
        <span class="h-sp"></span>
        <label class="h-search">${ms('search')}<input placeholder="Ara" data-fk="home-search" data-in="homeQuery" data-key="homeSearch" value="${esc(S.homeQuery)}"></label>
        ${esitEtiket()}<button class="h-nb h-gear" data-act="openSettings" title="Ayarlar">${ms('settings')}</button>
      </header>
      <main class="h-main">
        <div class="h-grid">
          <section class="h-card h-slot wide">${ms('dashboard')}<span class="lbl">Widget alanı</span></section>
          <section class="h-card h-cal">
            <div class="h-chead">
              <div class="h-ctitle">${MON[month]} ${year}</div>
              <button class="h-nb" data-act="prevMonth" title="Önceki ay">${ms('chevron_left')}</button>
              <button class="h-nb" data-act="nextMonth" title="Sonraki ay">${ms('chevron_right')}</button>
            </div>
            <div class="h-week h-dow">${DOW_MON.map((d) => `<div>${d}</div>`).join('')}</div>
            <div class="h-week">${cellsHTML}</div>
          </section>
          <section class="h-card h-slot">${ms('checklist')}<span class="lbl">Widget alanı</span></section>
          <section class="h-card h-slot">${ms('trending_up')}<span class="lbl">Widget alanı</span></section>
          <section class="h-card h-tasks">
            <div class="h-thead">
              <div class="h-ctitle">Dönemsel görevler</div>
              <div class="h-seg">${ranges}</div>
            </div>
            ${items.length ? '' : '<div class="h-empty">Bu dönemde görev yok</div>'}
            <div class="h-list">${rows}</div>
          </section>
        </div>
      </main>`;
  }

  // ---------- PLANLAYICI ----------
  function derive() {
    const today = new Date();
    const todayIso = iso(today);
    const cids = calIds();
    const isCal = (t) => cids.indexOf(t.list) >= 0;
    const open = S.tasks.filter((t) => !t.done);
    const isToday = (t) => t.date === todayIso && !isCal(t);
    const isPlanned = (t) => t.date && t.date >= todayIso && !isCal(t);
    const counts = {
      today: open.filter((t) => !isCal(t) && (isToday(t) || overdue(t) || !t.date)).length,
      planned: open.filter(isPlanned).length,
      important: open.filter((t) => t.important && !isCal(t)).length,
      all: open.filter((t) => !isCal(t)).length,
      notes: S.notes.length
    };
    return { today, todayIso, cids, isCal, open, isToday, isPlanned, counts, activeIsCal: S.view === 'list' && cids.indexOf(S.activeList) >= 0 };
  }

  function rangeStats(from, to, ctx) {
    let total = 0; let done = 0;
    const counted = {};
    S.tasks.forEach((t) => {
      if (!t.date || ctx.isCal(t) || t.date < from || t.date > to) return;
      total += 1;
      counted[t.id + '|' + t.date] = 1;
      if (t.done) done += 1;
    });
    const seen = {};
    S.log.forEach((e) => {
      if (e.date < from || e.date > to) return;
      const key = e.id + '|' + e.date;
      if (seen[key] || counted[key]) return;
      if (!S.tasks.some((t) => t.id === e.id)) return;
      seen[key] = 1; total += 1; done += 1;
    });
    return { total, done, pct: total ? Math.round((done / total) * 100) : 0 };
  }

  const NAV = [
    { key: 'today', label: 'Bugün', icon: 'wb_sunny', color: PAL[0] },
    { key: 'planned', label: 'Planlanan', icon: 'calendar_month', color: PAL[2] },
    { key: 'important', label: 'Önemli', icon: 'star', color: PAL[5] },
    { key: 'all', label: 'Tüm görevler', icon: 'inbox', color: PAL[4] },
    { key: 'notes', label: 'Notlar', icon: 'sticky_note_2', color: PAL[5] }
  ];

  // 18: dar pencerede kenar çubuğu daralmış durur; açılınca içeriğin üstünde (katman olarak) açılır
  const sideCollapsed = () => (S.narrow ? !S.sideOverlay : S.collapsed);
  function sideHTML(ctx) {
    const c = sideCollapsed();
    const nav = NAV.map((n) => {
      const on = S.view === n.key;
      return `<button class="nv${on ? ' on' : ''}" style="${cv(n.color)}" data-act="nav" data-v="${n.key}" data-tip="${n.label}">
        ${ms(n.icon)}<span class="lbl">${n.label}</span><span class="cnt">${ctx.counts[n.key] || ''}</span></button>`;
    }).join('');

    const lists = allLists();
    const roots = lists.filter((l) => !l.parent);
    const rows = [];
    roots.forEach((r) => {
      const kids = lists.filter((l) => l.parent === r.id);
      rows.push({ list: r, depth: 0, kids: kids.length });
      if (!S.closedParents[r.id]) kids.forEach((k) => rows.push({ list: k, depth: 1, kids: 0 }));
    });
    S.lists.filter((l) => l.parent && !lists.some((p) => p.id === l.parent)).forEach((l) => rows.push({ list: l, depth: 0, kids: 0 }));

    const listRows = rows.map((row) => {
      const l = row.list;
      const col = pcol(l);
      const on = S.view === 'list' && S.activeList === l.id;
      const childIds = lists.filter((x) => x.parent === l.id).map((x) => x.id);
      const count = ctx.open.filter((t) => t.list === l.id || childIds.indexOf(t.list) >= 0).length;
      const closed = !!S.closedParents[l.id];
      const chev = row.kids > 0 ? `<button class="chev ms${closed ? '' : ' open'}" data-act="chev" data-id="${l.id}">chevron_right</button>` : '';
      return `<div class="lrow${on ? ' on' : ''}${row.depth ? ' sub' : ''}" style="${cv(col)}" data-drop-list="${l.id}">
        ${chev}
        <button class="lbtn" data-act="list" data-id="${l.id}" data-tip="${esc(l.name)}">${ms(l.system ? 'event' : esc(l.icon || 'work'))}<span class="lbl">${esc(l.name)}</span><span class="cnt">${count || ''}</span></button>
        <button class="ledit" data-act="editList" data-id="${l.id}" title="Düzenle">${ms('tune')}</button>
      </div>`;
    }).join('');

    const week = rangeStats(ctx.todayIso, iso(addDays(ctx.today, 6)), ctx);
    const day = rangeStats(ctx.todayIso, ctx.todayIso, ctx);

    const menuItems = [
      { key: 'task', icon: 'check_circle', label: 'Görev', hint: 'Ctrl+N', color: PAL[0] },
      { key: 'list', icon: 'folder_open', label: 'Liste / Kategori', hint: '', color: PAL[1] },
      { key: 'note', icon: 'sticky_note_2', label: 'Not', hint: '', color: PAL[5] },
      { key: 'subtask', icon: 'subdirectory_arrow_right', label: 'Alt Görev', hint: '', color: PAL[4] },
      { key: 'more', icon: 'more_horiz', label: 'Daha Fazla', hint: 'yakında', color: PAL[3], disabled: true }
    ].map((m) => `<button class="mi" style="${cv(m.color)}" ${m.disabled ? 'disabled' : `data-act="quick" data-v="${m.key}"`}>
        <span class="ic ms">${m.icon}</span><span class="tx">${m.label}</span><span class="hint">${m.hint}</span></button>`).join('');

    return `
      <div class="logo-row">
        <button class="ibtn" data-act="toggleSidebar" title="Kenar çubuğu (Ctrl+B)">${ms(c ? 'left_panel_open' : 'left_panel_close')}</button>
      </div>
      <div class="new-wrap">
        <button class="new-btn" data-act="toggleMenu">${ms('add')}<span class="lbl">Yeni</span>${c ? '' : ms('expand_more', 'caret' + (S.menuOpen ? ' up' : ''))}</button>
        ${S.menuOpen ? `<div class="menu">${menuItems}</div>` : ''}
      </div>
      <nav class="nv-list">${nav}</nav>
      <div class="lists">
        <div class="lists-h hide-c">Listelerim</div>
        ${listRows}
      </div>
      <div style="flex:1;min-height:24px"></div>
      <button class="nv set-nv" data-act="openSettings" data-tip="Ayarlar">${ms('settings')}<span class="lbl">Ayarlar</span></button>
      <div class="stats">
        <div>
          <div class="st-h"><span class="st-l">Bugün</span><span class="st-n">${day.done}</span><span class="st-t">/ ${day.total} tamamlandı</span></div>
          <div class="bar"><div style="width:${day.pct}%;background:var(--vurgu)"></div></div>
        </div>
        <div>
          <div class="st-h"><span class="st-l">Bu hafta</span><span class="st-n">${week.done}</span><span class="st-t">/ ${week.total} tamamlandı</span></div>
          <div class="bar"><div style="width:${week.pct}%;background:var(--yesil)"></div></div>
        </div>
      </div>`;
  }

  function sortFn(a, b) {
    const m = S.sortMode;
    if (m === 'alpha') return lower(a.title).localeCompare(lower(b.title), 'tr');
    if (m === 'created') return b.createdAt - a.createdAt;
    if (m === 'due') return (a.date || '9999-12-31') < (b.date || '9999-12-31') ? -1 : 1;
    if (m === 'priority') {
      if (!!b.important !== !!a.important) return b.important ? 1 : -1;
      return (a.date || '9999-12-31') < (b.date || '9999-12-31') ? -1 : 1;
    }
    const oa = typeof a.order === 'number' ? a.order : a.createdAt;
    const ob = typeof b.order === 'number' ? b.order : b.createdAt;
    return oa - ob;
  }

  function taskCard(t, color) {
    const over = overdue(t);
    const c = over ? OVERDUE : color;
    const lst = listById(t.list);
    const cls = ['task'];
    if (over) cls.push('over'); else if (t.important) cls.push('imp');
    if (S.selectedId === t.id || S.openId === t.id) cls.push('sel');
    const picked = S.picked.indexOf(t.id) >= 0;
    const meta = [];
    if (t.date) meta.push(`<span class="when" style="${cv(c)}">${esc(whenLabel(t))}</span>`);
    if (t.repeat) meta.push(`<span class="mrep">${ms('autorenew')}${esc(repeatLabel(t.repeat))}</span>`);
    if (lst && !(S.view === 'list' && S.activeList === t.list)) meta.push(`<span class="lchip" style="${cv(pcol(lst))}">${ms(lst.system ? 'event' : esc(lst.icon || 'work'))}${esc(lst.name)}</span>`);
    if (t.subtasks.length) meta.push(`<span class="mrep">${ms('checklist')}${t.subtasks.filter((s) => s.done).length}/${t.subtasks.length} adım</span>`);
    if (t.note && t.note.trim()) meta.push(`<span class="mrep" title="Not var">${ms('sticky_note_2')}Not</span>`);
    return `<article class="${cls.join(' ')}" draggable="true" data-drag="${t.id}">
      <button class="sel-b${picked ? ' on' : ''}" data-act="pick" data-id="${t.id}" title="Seç">${picked ? '✓' : ''}</button>
      <button class="box${t.done ? ' done' : ''}${S.popId === t.id ? ' pop' : ''}" data-act="toggle" data-id="${t.id}" title="${t.done ? 'Tamamlanmadı olarak işaretle' : 'Tamamla'}">${t.done ? '✓' : ''}</button>
      <div class="tb" data-act="open" data-id="${t.id}">
        <div class="tt${t.done ? ' done' : ''}">${esc(t.title)}</div>
        ${meta.length ? `<div class="meta">${meta.join('')}</div>` : ''}
      </div>
      <button class="star${t.important ? ' on' : ''}" data-act="star" data-id="${t.id}" title="Önemli">${ms('star')}</button>
      <button class="x" data-act="del" data-id="${t.id}" title="Sil">${ms('close')}</button>
    </article>`;
  }

  // 20b: Notlar görünümü — notlar görevlerden ayrı, burada eklenir ve yerinde düzenlenir
  function notesHTML(ctx) {
    const { today } = ctx;
    const fmt = (ms0) => new Date(ms0).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long' });
    const cards = S.notes.map((n) => {
      const flash = S.flashNote === n.id ? ' flash' : '';
      const when = n.updatedAt ? `${fmt(n.updatedAt)} · düzenlendi` : fmt(n.createdAt);
      if (S.editNoteId === n.id) {
        return `<div class="note editing${flash}" data-note="${n.id}">
          <textarea data-fk="note-edit" data-in="noteEdit" data-id="${n.id}" rows="5">${esc(n.text)}</textarea>
          <div class="ft"><span>Yazdıkça kaydedilir</span><button data-act="noteDone">Bitti</button></div></div>`;
      }
      return `<div class="note${flash}" data-note="${n.id}" data-act="noteEdit" data-id="${n.id}" title="Düzenlemek için tıklayın">
        <div class="tx">${esc(n.text)}</div>
        <div class="ft"><span>${esc(when)}</span><button data-act="delNote" data-id="${n.id}">Sil</button></div></div>`;
    }).join('');
    return `<div class="wrap">
      <header class="ph">
        <div class="eyebrow">${today.getDate()} ${MON[today.getMonth()]} ${today.getFullYear()} · ${DOW_LONG[today.getDay()]}</div>
        <h1>Notlar</h1>
        <p class="subline">Aklındakileri hızlıca yaz; görevlerden ayrı durur. Bir nota tıklayarak düzenleyebilirsin.</p>
      </header>
      <div class="notef">
        <textarea rows="3" data-fk="note-new" data-in="noteDraft" placeholder="Yeni not…">${esc(S.noteDraft)}</textarea>
        <div class="row-a" style="margin-top:12px">
          <button class="btn-p gold${S.noteDraft.trim() ? '' : ' off'}" data-act="createNote">Kaydet</button>
          <span class="set-note" style="margin:0">Ctrl+Enter ile de kaydedebilirsin</span>
        </div>
      </div>
      ${S.notes.length ? `<div class="notes">${cards}</div>`
        : '<div class="p-empty"><div class="a">Henüz not yok</div><div class="b">Yukarıya yazıp "Kaydet"e bas.</div></div>'}
    </div>`;
  }

  function mainHTML(ctx) {
    if (S.view === 'notes') { S.flat = []; return notesHTML(ctx); }
    const { today, todayIso, open, isCal, isToday, isPlanned, activeIsCal } = ctx;
    const view = S.view;
    let groups = [];
    let completedPool = [];
    let completedByDate = false;

    if (view === 'today') {
      const od = open.filter((t) => overdue(t) && !isCal(t)).sort(sortFn);
      const td = open.filter(isToday).sort(sortFn);
      const nd = open.filter((t) => !t.date && !isCal(t)).sort(sortFn);
      if (od.length) groups.push({ label: 'Gecikmiş', color: OVERDUE, tasks: od });
      if (td.length) groups.push({ label: 'Bugün', color: PAL[0], tasks: td });
      if (nd.length) groups.push({ label: 'Tarihsiz', color: PAL[4], tasks: nd });
      completedPool = S.tasks.filter((t) => t.done && !isCal(t) && (!t.date || t.date <= todayIso));
    } else if (view === 'planned') {
      let pool = open.filter(isPlanned);
      if (S.dayFilter) pool = pool.filter((t) => t.date === S.dayFilter);
      const byDate = {};
      pool.forEach((t) => { (byDate[t.date] = byDate[t.date] || []).push(t); });
      groups = Object.keys(byDate).sort().map((k, i) => {
        const d = parse(k);
        const diff = Math.round((d - parse(todayIso)) / 86400000);
        const label = `${d.getDate()} ${MON[d.getMonth()]} ${diff === 0 ? 'Bugün' : diff === 1 ? 'Yarın' : DOW_LONG[d.getDay()]}`;
        return { label, color: PAL[(i + 1) % PAL.length], tasks: byDate[k].sort(sortFn) };
      });
      completedPool = S.tasks.filter((t) => t.done && !isCal(t) && t.date && t.date >= todayIso);
      completedByDate = true;
    } else if (view === 'list') {
      const lst = listById(S.activeList);
      const pool = open.filter((t) => t.list === S.activeList).sort(sortFn);
      if (pool.length) groups.push({ label: lst ? lst.name : 'Liste', color: lst ? pcol(lst) : PAL[0], tasks: pool });
      completedPool = S.tasks.filter((t) => t.done && t.list === S.activeList);
    } else if (view === 'important') {
      const imp = open.filter((t) => t.important && !isCal(t)).sort(sortFn);
      if (imp.length) groups.push({ label: 'Önemli', color: PAL[5], tasks: imp });
      completedPool = S.tasks.filter((t) => t.done && t.important && !isCal(t));
    } else {
      const all = open.filter((t) => !isCal(t)).sort(sortFn);
      if (all.length) groups.push({ label: 'Tüm görevler', color: PAL[4], tasks: all });
      completedPool = S.tasks.filter((t) => t.done && !isCal(t));
    }
    S.flat = groups.reduce((acc, g) => acc.concat(g.tasks.map((t) => t.id)), []);

    const h = today.getHours();
    const greeting = h < 6 ? 'İyi geceler' : h < 12 ? 'Günaydın' : h < 18 ? 'İyi günler' : 'İyi akşamlar';
    const cnt = ctx.counts.today;
    const sublines = {
      today: cnt ? `Bugün için ${cnt} görevin var. Küçük bir adımla başla.` : 'Bugün için planlanmış bir şey yok. Keyfini çıkar.',
      planned: 'Önümüzdeki günlere yayılmış işlerin tarih sırasıyla burada.',
      important: 'Yıldızladığın işler; önceliğini kaybetme.',
      all: 'Tüm açık görevlerin tek bir yerde.',
      list: activeIsCal ? 'Doğum günleri ve özel günler; her kayıt için tarih zorunludur.' : 'Bu listedeki tüm açık görevler.'
    };
    const empties = {
      today: ['Bugün temiz', 'Yukarıdaki alandan yeni bir görev ekleyebilirsin.'],
      planned: ['Planlanmış görev yok', 'Bir göreve ileri tarih vererek burada topla.'],
      important: ['Önemli görev yok', 'Bir görevin yanındaki yıldıza dokun.'],
      all: ['Hiç açık görev yok', 'Yukarıdaki alandan ilk görevini ekle.'],
      list: activeIsCal ? ['Takvim boş', 'Bir tarih seçip özel gün ekle; anasayfadaki takvimde nokta olarak görünür.'] : ['Liste boş', 'Buradayken eklediğin görevler bu listeye kaydedilir.']
    };

    // Gün şeridi (Planlanan)
    let dayStrip = '';
    if (view === 'planned') {
      dayStrip = '<div class="days">' + Array.from({ length: 7 }, (_, i) => {
        const d = addDays(today, i);
        const key = iso(d);
        const c = PASTEL[(i * 3) % PASTEL.length];
        const n = open.filter((t) => t.date === key).length;
        return `<button class="day${S.dayFilter === key ? ' on' : ''}" style="${cv(c)}" data-act="day" data-v="${key}">
          <span class="d1">${i === 0 ? 'Bugün' : DOW[d.getDay()]}</span><span class="d2">${d.getDate()}</span><span class="d3">${n ? n + ' görev' : '—'}</span></button>`;
      }).join('') + '</div>';
    }

    // Liste formu
    let listForm = '';
    if (S.quick === 'list') {
      const lf = S.lf;
      const sys = lf.editId === SYS_CAL;
      const lc = PASTEL[lf.color % PASTEL.length];
      // 7a: alt listesi olan liste yalnızca üst seviyede kalabilir
      const hasKids = !!lf.editId && S.lists.some((l) => l.parent === lf.editId);
      const parentOpts = hasKids ? [{ id: null, name: 'Yok (üst seviye)' }]
        : [{ id: null, name: 'Yok (üst seviye)' }, { id: SYS_CAL, name: 'Takvim' }]
          .concat(S.lists.filter((l) => !l.parent && l.id !== lf.editId).map((l) => ({ id: l.id, name: l.name })));
      const parents = parentOpts
        .map((p) => `<button class="chip${lf.parent === p.id ? ' on' : ''}" data-act="lfParent" data-v="${p.id || ''}">${esc(p.name)}</button>`).join('')
        + (hasKids ? '<span class="set-note" style="margin:0;align-self:center">Alt listeleri olduğu için başka bir listenin altına alınamaz.</span>' : '');
      const icons = ICONS.map((n) => `<button class="icon-c ms${lf.icon === n ? ' on' : ''}" style="${cv(lc)}" data-act="lfIcon" data-v="${n}">${n}</button>`).join('');
      const colors = PASTEL.map((c, i) => `<button class="col-c${lf.color === i ? ' on' : ''}" style="${cv(c)}" data-act="lfColor" data-v="${i}"></button>`).join('');
      const ok = sys || lf.name.trim();
      listForm = `<div class="panel">
        <div class="panel-h"><span class="prev-ic ms" style="${cv(lc)}">${sys ? 'event' : esc(lf.icon)}</span>${sys ? 'Takvim listesi rengi' : (lf.editId ? 'Listeyi düzenle' : 'Yeni liste / kategori')}</div>
        ${sys ? '' : `<input class="fld mb18" data-fk="list-name" data-in="listName" data-key="listName" value="${esc(lf.name)}" placeholder="Liste adı, örn. Ev, Faturalar, İş">
          <div class="cap">Üst liste</div><div class="chips mb20">${parents}</div>
          <div class="cap">İkon</div><div class="icons">${icons}</div>`}
        <div class="cap">Renk</div><div class="colors">${colors}</div>
        <div class="row-a">
          <button class="btn-p${ok ? '' : ' off'}" data-act="createList">${lf.editId ? 'Kaydet' : 'Oluştur'}</button>
          <button class="btn-t" data-act="closeQuick">Vazgeç</button>
          <span class="grow"></span>
          ${lf.editId && !sys ? '<button class="btn-t red" data-act="deleteList">Listeyi sil</button>' : ''}
        </div>
      </div>`;
    }

    const subPicker = S.quick === 'subtask' ? `<div class="panel">
        <div style="font-size:16px;font-weight:600;margin-bottom:6px">Alt görev eklenecek görevi seç</div>
        <div style="font-size:13.5px;color:var(--yazi-soluk-2);margin-bottom:14px">${open.length ? 'Seçtiğin görevin ayrıntıları açılır ve adım alanı hazır olur.' : 'Henüz açık bir görev yok — önce bir görev ekle.'}</div>
        <div class="chips">${open.slice(0, 12).map((t) => `<button class="pick-btn" data-act="subPick" data-id="${t.id}">${esc(t.title)}</button>`).join('')}</div>
        <button class="btn-t" style="margin-top:14px" data-act="closeQuick">Vazgeç</button>
      </div>` : '';

    // Görev ekleme alanı
    const d = S.draft;
    const nl = nlDate(d.title);
    const rep = d.repeat;
    const quickDates = [['Bugün', todayIso], ['Yarın', iso(addDays(today, 1))], ['Hafta sonu', nextWeekday(6)], ['Gelecek hafta', iso(addDays(today, 7))]]
      .map((q, i) => `<button class="qd${d.date === q[1] ? ' on' : ''}" style="${cv(PAL[i])}" data-act="qd" data-v="${q[1]}">${q[0]}</button>`).join('');
    const listName = view === 'list' && listById(S.activeList) ? listById(S.activeList).name : '';
    const composer = `<div class="composer">
        <div class="c-row">
          <span class="c-dot"></span>
          <input class="c-in" data-fk="composer" data-in="composer" data-key="composer" value="${esc(d.title)}"
            placeholder="${activeIsCal ? 'Özel gün ekle…' : (listName ? esc(listName) + ' listesine görev ekle…' : 'Bir görev ekle…')}">
          <button class="sq" data-act="openSearch" title="Ara (/)">${ms('search')}</button>
          <button class="c-add${d.title.trim() ? '' : ' off'}" data-act="addTask">Ekle</button>
        </div>
        ${S.composerOpen ? `<div class="c-opts">
          <div class="row-a" style="gap:8px">${quickDates}${nl && !d.dateManual ? `<span class="nl">${ms('auto_awesome')}${esc(nl.word)} olarak algılandı</span>` : ''}</div>
          <div class="row-a">
            <label class="dlab">Tarih <input type="date" data-ch="draftDate" value="${d.date}"></label>
            <button class="tg${d.important ? ' star-on' : ''}" data-act="draftStar">${ms('star')} Önemli</button>
            <button class="tg${rep ? ' rep-on' : ''}" data-act="draftRepeat">${ms('autorenew')} Tekrarla</button>
          </div>
          ${S.dateWarn ? `<div class="warn">${ms('event_busy')}Takvim listesinde tarih zorunludur.</div>` : ''}
          ${rep ? `<div class="rep-box">${repeatEditorHTML('draft', rep, d.date)}
            <div class="sum">Tamamlandığında görev silinmez; tarihi "${esc(repeatLabel(rep))}" kuralına göre ilerler.</div></div>` : ''}
        </div>` : ''}
      </div>`;

    const sortLabels = { manual: 'Elle sıralama', priority: 'Önceliğe göre', due: 'Tarihe göre', alpha: 'Alfabetik', created: 'Eklenme tarihi' };
    const sortRow = `<div class="sort-row">
        <button class="sort-btn" data-act="sortMenu">${ms('sort')}${sortLabels[S.sortMode] || sortLabels.manual}</button>
        ${S.sortMenuOpen ? `<div class="sort-menu">${Object.keys(sortLabels).map((k) => `<button class="so${S.sortMode === k ? ' on' : ''}" data-act="sort" data-v="${k}">${ms('check')}${sortLabels[k]}</button>`).join('')}</div>` : ''}
      </div>`;

    const groupsHTML = groups.map((g) => `<section class="group">
        <div class="g-h"><span class="pill" style="${cv(g.color)}">${esc(g.label)}</span><span class="g-c">${g.tasks.length} görev</span><span class="g-line"></span></div>
        <div class="tlist">${g.tasks.map((t) => taskCard(t, g.color)).join('')}</div>
      </section>`).join('');

    let completed = '';
    if (completedPool.length) {
      let cg;
      const item = (t) => `<div class="c-item" data-act="open" data-id="${t.id}">
          <button class="box done" data-act="toggle" data-id="${t.id}" title="Geri al">✓</button>
          <span class="tt done">${esc(t.title)}</span>
          <span class="wh">${esc(whenLabel(t))}</span>
          <button class="x" data-act="del" data-id="${t.id}" title="Sil">${ms('close')}</button>
        </div>`;
      if (completedByDate) {
        const byDate = {};
        completedPool.forEach((t) => { (byDate[t.date] = byDate[t.date] || []).push(t); });
        cg = Object.keys(byDate).sort().map((k) => {
          const dd = parse(k);
          return `<div class="c-group"><div class="c-lbl">${dd.getDate()} ${MON[dd.getMonth()]} ${DOW_LONG[dd.getDay()]}</div>${byDate[k].map(item).join('')}</div>`;
        }).join('');
      } else {
        cg = `<div class="c-group">${completedPool.slice().sort((a, b) => (b.completedAt || b.createdAt) - (a.completedAt || a.createdAt)).map(item).join('')}</div>`;
      }
      completed = `<section>
        <button class="c-toggle" data-act="toggleCompleted"><span class="c-pill">Tamamlananlar (${completedPool.length})</span>${ms('expand_more', S.showCompleted ? 'up' : '')}</button>
        ${S.showCompleted ? `<div class="c-groups">${cg}</div>` : ''}
      </section>`;
    }

    return `<div class="wrap">
      <header class="ph">
        <div class="eyebrow">${today.getDate()} ${MON[today.getMonth()]} ${today.getFullYear()} · ${DOW_LONG[today.getDay()]}</div>
        <h1>${greeting}</h1>
        <p class="subline">${sublines[view]}</p>
      </header>
      ${dayStrip}${listForm}${subPicker}${composer}${sortRow}
      ${groups.length ? '' : `<div class="p-empty"><div class="a">${empties[view][0]}</div><div class="b">${empties[view][1]}</div></div>`}
      ${groupsHTML}
      ${completed}
    </div>`;
  }

  // 19b: To Do tarzı tekrar seçici (ekleme alanı: ctx='draft', ayrıntı paneli: ctx='task')
  // Hazır seçenekler + "Özel": her N gün/hafta/ay/yıl, haftalıkta günler
  function repeatEditorHTML(ctx, rep, dateIso) {
    const preset = repeatPreset(rep, dateIso);
    const custom = preset === 'custom' || S.repCustom[ctx];
    const opts = (ctx === 'task' ? [['', 'Yok']] : []).concat([['daily', 'Her gün'], ['weekdays', 'Hafta içi'], ['weekly', 'Her hafta'],
      ['monthly', 'Her ay'], ['yearly', 'Her yıl'], ['custom', 'Özel…']]);
    const chips = opts.map((o) => {
      const on = o[0] === 'custom' ? custom : (!custom && preset === o[0]);
      return `<button class="chip purple${on ? ' on' : ''}" data-act="repPreset" data-ctx="${ctx}" data-v="${o[0]}">${o[1]}</button>`;
    }).join('');
    let editor = '';
    if (custom && rep) {
      const n = everyOf(rep);
      const units = [['daily', 'gün'], ['weekly', 'hafta'], ['monthly', 'ay'], ['yearly', 'yıl']]
        .map((u) => `<option value="${u[0]}"${rep.type === u[0] ? ' selected' : ''}>${u[1]}</option>`).join('');
      const days = rep.type === 'weekly'
        ? `<div class="chips rep-days">${[1, 2, 3, 4, 5, 6, 0].map((x) => `<button class="rd${(rep.days || []).indexOf(x) >= 0 ? ' on' : ''}" data-act="repDay" data-ctx="${ctx}" data-v="${x}">${DOW[x]}</button>`).join('')}</div>`
        : '';
      editor = `<div class="rep-custom">
          <span>Her</span>
          <input type="number" min="1" max="99" class="rep-n" value="${n}" data-ch="repEvery" data-ctx="${ctx}" aria-label="Aralık">
          <select class="rep-u" data-ch="repUnit" data-ctx="${ctx}" aria-label="Birim">${units}</select>
          <span class="rep-res">→ ${esc(repeatLabel(rep))}</span>
        </div>${days}`;
    }
    return `<div class="chips">${chips}</div>${editor}`;
  }

  function detailHTML(ctx) {
    const t = S.openId ? findTask(S.openId) : null;
    if (!t) return '';
    const { today, todayIso } = ctx;
    const quick = [['Bugün', todayIso], ['Yarın', iso(addDays(today, 1))], ['Hafta sonu', nextWeekday(6)], ['Gelecek hafta', iso(addDays(today, 7))]]
      .map((q) => `<button class="chip${t.date === q[1] ? ' on' : ''}" data-act="dpDate" data-v="${q[1]}">${q[0]}</button>`).join('');
    const listOpts = [`<option value="">Listesiz</option>`].concat(allLists().map((l) => `<option value="${l.id}"${t.list === l.id ? ' selected' : ''}>${esc(l.name)}</option>`)).join('');
    const steps = t.subtasks.map((s) => `<div class="step">
        <button class="sbox${s.done ? ' done' : ''}" data-act="stepToggle" data-sid="${s.id}">${s.done ? '✓' : ''}</button>
        <input class="${s.done ? 'done' : ''}" data-in="step" data-sid="${s.id}" data-fk="step-${s.id}" value="${esc(s.title)}">
        <button class="sdel" data-act="stepDel" data-sid="${s.id}" title="Adımı sil">✕</button>
      </div>`).join('');
    const created = new Date(t.createdAt || Date.now()).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
    return `<div class="dp">
      <div class="dp-head"><span class="t">Görev ayrıntıları</span><button class="ibtn" data-act="closeDetail" title="Kapat (Esc)">${ms('close')}</button></div>
      <div class="dp-scroll">
        <div class="dp-card">
          <div class="dp-top">
            <button class="box${t.done ? ' done' : ''}${S.popId === t.id ? ' pop' : ''}" data-act="toggle" data-id="${t.id}">${t.done ? '✓' : ''}</button>
            <input class="dp-title${t.done ? ' done' : ''}" data-fk="dp-title" data-in="title" value="${esc(t.title)}">
            <button class="star${t.important ? ' on' : ''}" data-act="star" data-id="${t.id}" title="Önemli">${ms('star')}</button>
          </div>
          <div class="steps">
            ${steps}
            <div class="step"><span class="sbox dash"></span><input data-fk="step-new" data-key="stepAdd" placeholder="Adım ekle ve Enter'a bas"></div>
          </div>
        </div>
        <div class="dp-card">
          <div class="cap">Son tarih</div>
          <div class="chips">${quick}</div>
          <div class="row-a" style="margin-top:10px">
            <label class="dlab">${ms('event')}<input type="date" data-ch="dpDate" value="${t.date || ''}"></label>
            ${t.date ? '<button class="btn-t" data-act="dpDate" data-v="">Kaldır</button>' : ''}
          </div>
        </div>
        <div class="dp-card">
          <div class="cap">Tekrar${t.repeat ? ` <span class="rep-now">· ${esc(repeatLabel(t.repeat))}</span>` : ''}</div>
          ${repeatEditorHTML('task', t.repeat, t.date)}
          ${t.repeat ? `<button class="finish" data-act="dpFinish" title="Bu tekrarı tamamla ve seriyi bitir">${ms('done_all')}Tamamen bitir</button>` : ''}
        </div>
        <div class="dp-card">
          <div class="cap">Liste</div>
          <select class="fld" data-ch="dpList">${listOpts}</select>
        </div>
        <div class="dp-card">
          <div class="cap">Not</div>
          <textarea class="fld" data-fk="dp-note" data-in="note" placeholder="Not ekle">${esc(t.note)}</textarea>
        </div>
      </div>
      <div class="dp-foot">
        <button class="ibtn" data-act="closeDetail" title="Paneli gizle">${ms('right_panel_close')}</button>
        <span class="c">${t.done && t.completedAt ? 'Tamamlandı: ' + new Date(t.completedAt).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long' }) : 'Oluşturuldu: ' + created}</span>
        <button class="ibtn danger" data-act="del" data-id="${t.id}" title="Görevi sil">${ms('delete')}</button>
      </div>
    </div>`;
  }

  function overlayHTML(ctx) {
    let html = '';
    // 18: çok dar pencerede kenar çubuğu gizli; ☰ ile açılır
    if (S.tiny && !S.sideOverlay) html += `<button class="menu-fab" data-act="toggleSidebar" title="Menü (Ctrl+B)">${ms('menu')}</button>`;
    if (S.picked.length) {
      const targets = [{ id: '', name: 'Listesiz', icon: 'remove', color: PASTEL[12] }]
        .concat(allLists().map((l) => ({ id: l.id, name: l.name, icon: l.system ? 'event' : (l.icon || 'work'), color: pcol(l) })))
        .map((m) => `<button class="mt" style="${cv(m.color)}" data-act="bulkMoveTo" data-v="${m.id}"><span class="ic ms">${esc(m.icon)}</span>${esc(m.name)}</button>`).join('');
      html += `<div class="bulk">
        <span class="n">${S.picked.length} görev seçildi</span>
        <button class="bb" data-act="bulkComplete">${ms('task_alt')}Tamamla</button>
        <div class="move-wrap">
          <button class="bb" data-act="bulkMoveMenu">${ms('drive_file_move')}Listeye taşı</button>
          ${S.moveMenuOpen ? `<div class="move-menu">${targets}</div>` : ''}
        </div>
        <button class="bb del" data-act="bulkDelete">${ms('delete')}Sil</button>
        <button class="bb clear" data-act="bulkClear" title="Seçimi temizle">${ms('close')}</button>
      </div>`;
    }
    if (S.searchOpen) {
      const q = lower(S.searchQuery.trim());
      let results = [];
      if (q) {
        const hit = (s) => lower(s).indexOf(q) >= 0;
        results = results.concat(
          S.tasks.filter((t) => hit(t.title) || hit(t.note) || t.subtasks.some((s) => hit(s.title))).slice(0, 8).map((t) => ({
            kind: 'task', id: t.id, title: t.title, sub: whenLabel(t) || (t.note ? t.note.slice(0, 60) : 'Tarihsiz'), label: 'Görev',
            icon: t.done ? 'task_alt' : 'radio_button_unchecked', color: PAL[0]
          })),
          S.notes.filter((n) => hit(n.text)).slice(0, 5).map((n) => ({
            kind: 'note', id: n.id, title: n.text.slice(0, 70), sub: new Date(n.createdAt).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long' }), label: 'Not',
            icon: 'sticky_note_2', color: PAL[5]
          })),
          allLists().filter((l) => hit(l.name)).map((l) => ({
            kind: 'list', id: l.id, title: l.name, sub: `${ctx.open.filter((t) => t.list === l.id).length} açık görev`, label: 'Liste',
            icon: l.system ? 'event' : (l.icon || 'work'), color: pcol(l)
          })),
          // 17: arşivdeki görevler de aranır; tıklanınca geri getirme sorulur
          S.archive.filter((t) => hit(t.title) || hit(t.note)).slice(0, 5).map((t) => ({
            kind: 'archive', id: t.id, title: t.title, sub: `Arşivde · ${new Date(doneAt(t)).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' })} tamamlandı`, label: 'Arşiv',
            icon: 'inventory_2', color: PASTEL[12]
          }))
        );
      }
      const body = results.length
        ? results.map((r) => `<button class="sr" data-act="searchHit" data-kind="${r.kind}" data-id="${r.id}">
            <span class="ic ms" style="${cv(r.color)}">${esc(r.icon)}</span>
            <span class="bd"><span class="a">${esc(r.title)}</span><span class="b">${esc(r.sub)}</span></span>
            <span class="k">${r.label}</span></button>`).join('')
        : `<div class="s-empty">${q ? `"${esc(S.searchQuery)}" için sonuç yok.` : 'Görev başlıkları, adımlar, notlar ve liste adları içinde arar.'}</div>`;
      html += `<div class="search-bg" data-act="closeSearch">
        <div class="search-box" data-act="noop">
          <div class="s-head">${ms('search')}<input data-fk="search" data-in="search" value="${esc(S.searchQuery)}" placeholder="Görev, not veya liste ara…"><span class="kbd">Esc</span></div>
          <div class="s-body">${body}</div>
        </div>
      </div>`;
    }
    return html;
  }

  // ---------- İki sayfada ortak katmanlar ----------
  function bannersHTML() {
    const b = [];
    if (S.writeBlocked) {
      const msg = S.blockReason === 'read'
        ? 'Tarayıcı deposuna erişilemiyor. Verilerinizin üzerine yazılmasın diye değişiklikler kaydedilmiyor.'
        : 'Okunamayan veri için kurtarma kopyası alınamadı. Üzerine yazılmasın diye değişiklikler kaydedilmiyor.';
      b.push(`<div class="banner red">${ms('error')}<span class="tx">${msg}</span>
        ${corruptFound.length ? '<button data-act="downloadCorrupt">Bozuk veriyi indir</button>' : ''}
        <button data-act="exportBackup">Yedeği indir</button><button data-act="unblockWrites">Kaydı yine de aç</button></div>`);
    } else if (S.saveError) {
      b.push(`<div class="banner red">${ms('error')}<span class="tx">Değişiklikler kaydedilemedi. Tarayıcı deposu dolu olabilir. Verilerinizi kaybetmemek için hemen yedek indirin.</span>
        <button data-act="exportBackup">Yedeği indir</button><button data-act="retrySave">Tekrar dene</button></div>`);
    }
    if (S.corruptNotice) {
      b.push(`<div class="banner amber">${ms('warning')}<span class="tx">${esc(S.corrupt.join(', '))} okunamadı. Bozuk veri silinmedi, kurtarma kopyası olarak saklandı. Ayarlar'dan bir otomatik yedeği geri yükleyebilirsiniz.</span>
        <button data-act="openSettings">Ayarlar</button><button data-act="dismissCorrupt">Kapat</button></div>`);
    }
    if (S.multiWin && !S.multiWinDismissed) {
      b.push(`<div class="banner amber">${ms('content_copy')}<span class="tx">Planize başka bir pencerede de açık. Değişikliklerin birbirini ezmemesi için yalnızca birini kullanın.</span>
        <button data-act="dismissMultiWin">Tamam</button></div>`);
    }
    return b.length ? `<div class="banners">${b.join('')}</div>` : '';
  }

  function confirmHTML() {
    const c = S.confirm;
    if (c.vz) {   // Vizyon: küçük, yalnızca soru + Vazgeç / Sil (kahve paleti); Enter odaktaki düğmeyi çalıştırır, odak Vazgeç'te açılır
      return `<div class="modal-bg top" data-act="confirmCancel"><div class="modal vz-onay" data-act="noop" role="alertdialog" aria-modal="true" aria-label="${esc(c.title)}">
      <div class="m-title">${esc(c.title)}</div>
      <div class="m-actions">
        <button class="btn-t" data-act="confirmCancel" data-fk="confirm-cancel">Vazgeç</button>
        <button class="vz-onay-sil" data-act="confirmOk" data-fk="confirm-ok">${esc(c.ok)}</button>
      </div>
    </div></div>`;
    }
    return `<div class="modal-bg top" data-act="confirmCancel"><div class="modal" data-act="noop" role="alertdialog" aria-modal="true">
      <div class="m-title">${esc(c.title)}</div>
      <div class="m-body">${esc(c.body)}</div>
      <div class="m-actions">
        <button class="btn-t" data-act="confirmCancel">Vazgeç</button>
        <button class="btn-p${c.danger ? ' danger' : ''}" data-act="confirmOk" data-fk="confirm-ok">${esc(c.ok)}</button>
      </div>
    </div></div>`;
  }

  function settingsHTML() {
    const br = readArr(KEY_BACKUPS);
    const backups = br.ok ? br.value : [];
    const rr = readArr(KEY_RECOVERY);
    const rec = rr.ok ? rr.value : [];
    const last = S.settings.lastExport ? fmtDateTime(new Date(S.settings.lastExport)) : 'hiç alınmadı';

      </section>` : (gr && gr.durum() === 'yerel' ? `<section class="set-sec">
        <h3>Hesap</h3>
        <p class="set-p">Bu sayfa doğrudan dosya olarak açıldı: giriş ve bulut eşitlemesi kapalı, veriler yalnızca bu bilgisayarda duruyor. Eşitleme için uygulamayı yayın adresinden açın. Buradan "Yedeği indir" ile (resimler dahil) yedek alabilirsiniz.</p>
      </section>` : '');
    const bkRows = backups.length
      ? backups.map((b, i) => `<div class="bk-row"><div class="bk-a"><div class="bk-d">${esc(fmtDayLabel(b.date))}</div><div class="bk-s">${esc(dataSummary(b.data || {}))}</div></div>
          <button class="btn-s sm" data-act="restoreAuto" data-v="${i}">Geri yükle</button></div>`).join('')
      : '<div class="set-note">Henüz otomatik yedek yok. Uygulama her gün ilk açılışta bir yedek alır.</div>';
    const recRows = rec.map((r, i) => `<div class="bk-row"><div class="bk-a"><div class="bk-d">${esc(r.label)}</div>
        <div class="bk-s">${esc(fmtDateTime(new Date(r.at)))} · ${Math.max(1, Math.ceil(String(r.raw || '').length / 1024))} KB</div></div>
        <button class="btn-s sm" data-act="downloadRecovery" data-v="${i}">İndir</button>
        <button class="btn-t red" data-act="deleteRecovery" data-v="${i}">Sil</button></div>`).join('');
    return `<div class="modal-bg" data-act="closeSettings"><div class="modal settings" data-act="noop" role="dialog" aria-modal="true" aria-label="Ayarlar">
      <div class="set-head"><span class="set-title">Ayarlar</span><button class="ibtn" data-act="closeSettings" title="Kapat (Esc)">${ms('close')}</button></div>
      ${hesapHTML}
      ${window.PlanizeEsitleme ? window.PlanizeEsitleme.bolumHTML() : ''}
      <section class="set-sec">
        <h3>Anasayfa teması</h3>
        <p class="set-p">Yalnızca Anasayfa'nın görünümünü değiştirir. Orman, bugünkü yeşil görünümdür.</p>
        <div class="tema-izgara" role="radiogroup" aria-label="Anasayfa teması">${HOME_THEMES.map((th) => `<button class="tema-kart${homeTheme === th[0] ? ' on' : ''}" role="radio" aria-checked="${homeTheme === th[0]}" data-act="setHomeTheme" data-v="${th[0]}">
          <span class="tema-mini" data-anasayfa-tema="${th[0]}" aria-hidden="true"><span class="tm-bar"><i></i><i></i><b></b></span><span class="tm-kart"><i></i><i></i></span></span>
          <span class="tema-ad"><span>${th[1]}</span>${homeTheme === th[0] ? ms('check') : ''}</span></button>`).join('')}</div>
      </section>
      <section class="set-sec">
        <h3>Planlayıcı teması</h3>
        <p class="set-p">Yalnızca Planlayıcı sayfasının görünümünü değiştirir. Klasik, eski açık görünümdür. Vizyon Panosu her zaman aynı kalır. Ayarlar gibi pencereler, açık olan sayfanın temasında görünür.</p>
        <div class="tema-izgara" role="radiogroup" aria-label="Planlayıcı teması">${THEMES.map((th) => `<button class="tema-kart${theme === th[0] ? ' on' : ''}" role="radio" aria-checked="${theme === th[0]}" data-act="setTheme" data-v="${th[0]}">
          <span class="tema-mini" data-tema="${th[0]}" aria-hidden="true"><span class="tm-bar"><i></i><i></i><b></b></span><span class="tm-kart"><i></i><i></i></span></span>
          <span class="tema-ad"><span>${th[1]}</span>${theme === th[0] ? ms('check') : ''}</span></button>`).join('')}</div>
      </section>
      <section class="set-sec">
        <h3>Genel</h3>
        ${toggleRow('toggleSound', S.settings.sound !== false, 'Tamamlama sesi', 'Bir görevi tamamladığınızda kısa bir ses çalar.')}

      </section>
      <section class="set-sec">
        <h3>Yedekler</h3>
        <p class="set-p">Verileriniz yalnızca bu bilgisayarda, Edge'in deposunda duruyor. Ara sıra yedek indirip OneDrive gibi güvenli bir yere koyun.</p>
        <div class="row-a">
          <button class="btn-p" data-act="exportBackup">${ms('download')}Yedeği indir</button>
          <button class="btn-s" data-act="importBackup">${ms('upload')}Yedekten yükle</button>
