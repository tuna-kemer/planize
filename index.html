<!-- VİZYON PANOSU: mantık katmanı (arayüzsüz) ve testi -->
<script id="vizyon-mantik">
/* =====================================================================
   VİZYON PANOSU - MANTIK KATMANI
   Görsel kod yok: DOM, renk, boyut (piksel) bilgisi içermez.
   Tüm değişiklikler olustur() ile üretilen deponun operasyonlarından geçer.
   Yerleşim (layout) birim cinsindendir (x, y, w, h = tam sayı birim).
   Birimin piksel karşılığı görsel katmanda tutulur (Aşama 4.2).
   ===================================================================== */
(function (kok) {
  'use strict';

  const AYAR = {
    surum: 1,
    varsayilanPanoBasligi: 'Yeni pano',
    varsayilanKutucukBasligi: 'Yeni kutucuk',
    varsayilanGenislik: 14,      // birim (20px birimde 280px)
    varsayilanYukseklik: 10,     // birim (200px); içerik gerektirirse görünüm katmanı yüksekliği büyütür
    enAzGenislik: 2,             // birim
    enAzYukseklik: 2,            // birim
    kenarBoslugu: 1,             // yeni/kopya kutucuğun pano kenarlarından uzaklığı (birim = 1 nokta aralığı)
    yerlesimBoslugu: 1,          // yeni/kopya kutucuğun diğer kutucuklara en az uzaklığı (birim)
    yedekSatirGenisligi: 60,     // görünüm satır genişliğini vermezse kullanılır (birim)
    enAzSutunGenisligi: 0.2      // tablo sütun ağırlığı alt sınırı
  };

  let sayac = 0;
  const yeniId = (on) => on + '_' + Date.now().toString(36) + (++sayac).toString(36) + Math.random().toString(36).slice(2, 6);
  const klon = (x) => JSON.parse(JSON.stringify(x));
  const str = (v) => (v == null ? '' : String(v));
  const tamsayi = (v) => (typeof v === 'number' && isFinite(v) ? Math.round(v) : null);
  const hata = (kod) => ({ ok: false, hata: kod });

  /* ---------- Blok türleri: yeni tür eklemek = buraya bir kayıt eklemek ---------- */
  const HIZALAR = ['left', 'center', 'right'];

  const RESIM_SIGDIR = ['contain', 'cover'];
  const RESIM_OLCEK = { en_az: 10, en_cok: 400 };   // yüzde
  const RESIM_POS_SINIR = 100;                       // kaydırma sınırı (çerçeve boyutunun yüzdesi)
  const sinirla = (v, a, b, yedek) => (typeof v === 'number' && isFinite(v) ? Math.max(a, Math.min(b, v)) : yedek);
  const RESIM_GORUNUM = ['fit', 'scale', 'posX', 'posY'];   // kilitli kutucukta "görünüm" sayılan resim alanları

  const BLOK = {
    text: {
      varsayilan: () => ({ text: '' }),
      duzelt: (v) => ({ text: str(v.text) })
    },
    list: {
      varsayilan: () => ({ items: [] }),
      duzelt: (v) => ({
        items: (Array.isArray(v.items) ? v.items : []).map((o) => ({
          id: o && o.id ? String(o.id) : yeniId('o'),
          text: str(o && o.text),
          done: !!(o && o.done)
        }))
      })
    },
    table: {
      varsayilan: () => ({ rows: [['', '', ''], ['', '', ''], ['', '', '']], headerRow: false }),
      duzelt: (v) => {
        let rows = (Array.isArray(v.rows) ? v.rows : []).map((r) => (Array.isArray(r) ? r.map(str) : []));
        if (!rows.length) rows = [['']];
        const sutun = Math.max(1, rows.reduce((m, r) => Math.max(m, r.length), 0));
        rows = rows.map((r) => r.concat(Array(sutun - r.length).fill('')));
        const gen = Array.isArray(v.colWidths) ? v.colWidths : [];
        const hiza = Array.isArray(v.align) ? v.align : [];
        return {
          rows,
          headerRow: !!v.headerRow,
          colWidths: Array.from({ length: sutun }, (_, i) => (typeof gen[i] === 'number' && gen[i] > 0 ? Math.max(AYAR.enAzSutunGenisligi, gen[i]) : 1)),
          align: Array.from({ length: sutun }, (_, i) => (HIZALAR.indexOf(hiza[i]) >= 0 ? hiza[i] : 'left'))
        };
      }
    },
    image: {
      // src = IndexedDB'deki resim kimliği (orijinal asla değişmez). Görünüm (Madde 6), çerçeve içinde:
      //   fit: 'contain' (Sığdır: resmin tamamı görünür) | 'cover' (Doldur: çerçeveyi kaplar, taşan gizlenir)
      //   scale: yüzde (100 = fit'in verdiği boyut), posX/posY: kaydırma (çerçeve boyutunun yüzdesi). Kırpma = cover + scale + pos.
      varsayilan: () => ({ src: null, fit: 'contain', scale: 100, posX: 0, posY: 0 }),
      duzelt: (v) => {
        const o = { src: v.src ? String(v.src) : null };
        const c = str(v.caption);
        if (c) o.caption = c;
        o.fit = RESIM_SIGDIR.indexOf(v.fit) >= 0 ? v.fit : 'contain';
        o.scale = Math.round(sinirla(v.scale, RESIM_OLCEK.en_az, RESIM_OLCEK.en_cok, 100));
        o.posX = Math.round(sinirla(v.posX, -RESIM_POS_SINIR, RESIM_POS_SINIR, 0) * 10) / 10;
        o.posY = Math.round(sinirla(v.posY, -RESIM_POS_SINIR, RESIM_POS_SINIR, 0) * 10) / 10;
        return o;
      }
    }
  };

  /* ---------- Blok yardımcıları: yalnızca "yama" (patch) üretir, depoyu değiştirmez.
                  Uygulamak için updateBlock(tileId, blockId, yama) kullanılır. ---------- */
  const Liste = {
    ekle: (b, text) => ({ items: b.items.concat([{ id: yeniId('o'), text: str(text), done: false }]) }),
    degistir: (b, itemId, text) => ({ items: b.items.map((o) => (o.id === itemId ? Object.assign({}, o, { text: str(text) }) : o)) }),
    isaretle: (b, itemId) => ({ items: b.items.map((o) => (o.id === itemId ? Object.assign({}, o, { done: !o.done }) : o)) }),
    sil: (b, itemId) => ({ items: b.items.filter((o) => o.id !== itemId) })
  };

  const aralik = (n, alt, ust) => Math.max(alt, Math.min(ust, n));
  const Tablo = {
    satirEkle: (b, index) => {
      const i = aralik(index == null ? b.rows.length : index, 0, b.rows.length);
      const rows = klon(b.rows);
      rows.splice(i, 0, Array(b.colWidths.length).fill(''));
      return { rows };
    },
    satirSil: (b, index) => {
      if (b.rows.length <= 1 || index < 0 || index >= b.rows.length) return {};
      const rows = klon(b.rows);
      rows.splice(index, 1);
      return { rows };
    },
    sutunEkle: (b, index) => {
      const n = b.colWidths.length;
      const i = aralik(index == null ? n : index, 0, n);
      const rows = klon(b.rows).map((r) => { r.splice(i, 0, ''); return r; });
      const colWidths = b.colWidths.slice(); colWidths.splice(i, 0, 1);
      const align = b.align.slice(); align.splice(i, 0, 'left');
      return { rows, colWidths, align };
    },
    sutunSil: (b, index) => {
      if (b.colWidths.length <= 1 || index < 0 || index >= b.colWidths.length) return {};
      const rows = klon(b.rows).map((r) => { r.splice(index, 1); return r; });
      const colWidths = b.colWidths.slice(); colWidths.splice(index, 1);
      const align = b.align.slice(); align.splice(index, 1);
      return { rows, colWidths, align };
    },
    hucre: (b, satir, sutun, text) => {
      if (!b.rows[satir] || sutun < 0 || sutun >= b.colWidths.length) return {};
      const rows = klon(b.rows);
      rows[satir][sutun] = str(text);
      return { rows };
    },
    sutunGenislik: (b, sutun, w) => {
      if (sutun < 0 || sutun >= b.colWidths.length || !(typeof w === 'number' && w > 0)) return {};
      const colWidths = b.colWidths.slice();
      colWidths[sutun] = Math.max(AYAR.enAzSutunGenisligi, w);
      return { colWidths };
    },
    hizala: (b, sutun, hiza) => {
      if (sutun < 0 || sutun >= b.colWidths.length || HIZALAR.indexOf(hiza) < 0) return {};
      const align = b.align.slice();
      align[sutun] = hiza;
      return { align };
    },
    baslikSatiri: (b, acik) => ({ headerRow: !!acik })
  };

  /* ---------- Kutucuk görünümü (look): renk, başlık boyutu, stil, ikon ----------
     Yalnızca adlar saklanır (renk = '--kahve-' adı, ör. 'kahve-300'); piksel ve renk değeri görünüm katmanındadır. */
  const LOOK = {
    renkler: ['kahve-50', 'kahve-100', 'kahve-150', 'kahve-200', 'kahve-300', 'kahve-400', 'kahve-450', 'kahve-500', 'kahve-600', 'kahve-650', 'kahve-700', 'kahve-800', 'kahve-850', 'kahve-900', 'kahve-950'],
    basliklar: ['none', 's', 'm', 'l', 'xl'],
    stiller: ['plain', 'clean', 'band', 'frame', 'dashed'],   // sade, çizgisiz, bantlı, çerçeveli, noktalı çerçeve
    ikonlar: ['yildiz', 'kalp', 'ev', 'bayrak', 'hedef', 'ucak', 'kitap', 'gunes'],
    konumlar: ['left', 'right', 'top', 'corner'],             // başlığın solu, sağı, üstü (ortada), kutucuğun sol üst köşesi
    boyutlar: ['s', 'm', 'l']
  };
  /* ---------- Kutucuk kilidi (Madde 5, Canva tarzı; pano kilidi yoktur) ----------
     none: serbest · position: konum ve görünüm kilitli, yalnızca içerik düzenlenir · full: konum, görünüm ve içerik kilitli.
     İşlem tablosu (✓ = izinli):            none  position  full
       taşıma / boyutlandırma / görünüm      ✓       ✗        ✗
       içerik (başlık yazısı, bloklar)       ✓       ✓        ✗
       sil / kopyala                         ✓       ✗        ✗
       kilidi açma / türü değiştirme         ✓       ✓        ✓   */
  const KILITLER = ['none', 'position', 'full'];
  const duzeltKilit = (v) => (KILITLER.indexOf(v) >= 0 ? v : 'none');
  const LOOK_VARSAYILAN = { color: null, titleSize: 'm', style: 'plain', icon: null, iconPos: 'left', iconSize: 'm' };
  const LOOK_KURAL = {
    color: (v) => (v === null || LOOK.renkler.indexOf(v) >= 0),
    titleSize: (v) => LOOK.basliklar.indexOf(v) >= 0,
    style: (v) => LOOK.stiller.indexOf(v) >= 0,
    icon: (v) => (v === null || LOOK.ikonlar.indexOf(v) >= 0),
    iconPos: (v) => LOOK.konumlar.indexOf(v) >= 0,
    iconSize: (v) => LOOK.boyutlar.indexOf(v) >= 0
  };
  // Geçersiz/eksik alanlar varsayılana döner (eski kayıtlarda look yoktur)
  function duzeltLook(v) {
    const k = v && typeof v === 'object' ? v : {};
    const o = {};
    Object.keys(LOOK_VARSAYILAN).forEach((ad) => { o[ad] = LOOK_KURAL[ad](k[ad]) ? k[ad] : LOOK_VARSAYILAN[ad]; });
    return o;
  }

  /* ---------- Birim dönüşümü (görsel katman piksel verir, depo birim saklar) ---------- */
  function birimeCevir(px, birimPx) { return Math.round(px / birimPx); }

  /* ---------- Yerleşim düzeltme (tam sayı, alt sınırlar) ---------- */
  function duzeltYerlesim(parca, mevcut) {
    const l = Object.assign({}, mevcut);
    for (const k of ['x', 'y', 'w', 'h']) {
      if (parca[k] === undefined) continue;
      const n = tamsayi(parca[k]);
      if (n === null) return null;
      l[k] = n;
    }
    return {
      x: Math.max(0, l.x), y: Math.max(0, l.y),
      w: Math.max(AYAR.enAzGenislik, l.w), h: Math.max(AYAR.enAzYukseklik, l.h)
    };
  }

  /* ---------- Yüklenen (kayıttan/yedekten gelen) veriyi doğrulama ve onarma ----------
     Geçersiz kayıtları atar, eksikleri varsayılanla tamamlar; hiç kullanılamazsa null döner. */
  function normalizeEt(ham) {
    if (!ham || typeof ham !== 'object' || !Array.isArray(ham.boards) || !Array.isArray(ham.tiles)) return null;
    const simdi = Date.now();
    const sayi = (v, yedek) => (typeof v === 'number' && isFinite(v) ? v : yedek);
    const boards = []; const panoIdler = new Set();
    ham.boards.forEach((b) => {
      if (!b || typeof b !== 'object' || !b.id || panoIdler.has(String(b.id))) return;
      const id = String(b.id); panoIdler.add(id);
      const c = sayi(b.createdAt, simdi);
      boards.push({ id, title: str(b.title).trim() || AYAR.varsayilanPanoBasligi, createdAt: c, updatedAt: sayi(b.updatedAt, c) });   // eski kayıtlardaki pano "locked" alanı yok sayılır
    });
    const tiles = []; const kutuIdler = new Set();
    ham.tiles.forEach((t) => {
      if (!t || typeof t !== 'object' || !t.id || !panoIdler.has(String(t.boardId)) || kutuIdler.has(String(t.id))) return;
      const id = String(t.id); kutuIdler.add(id);
      const varsayilan = { x: 0, y: 0, w: AYAR.varsayilanGenislik, h: AYAR.varsayilanYukseklik };
      const layout = duzeltYerlesim(t.layout && typeof t.layout === 'object' ? t.layout : {}, varsayilan) || varsayilan;
      const blokIdler = new Set();
      const blocks = (Array.isArray(t.blocks) ? t.blocks : []).filter((b) => b && typeof b === 'object' && BLOK[b.type]).map((b) => {
        let bid = b.id ? String(b.id) : yeniId('b');
        if (blokIdler.has(bid)) bid = yeniId('b');
        blokIdler.add(bid);
        return Object.assign({ id: bid, type: b.type }, BLOK[b.type].duzelt(b));
      });
      const c = sayi(t.createdAt, simdi);
      tiles.push({ id, boardId: String(t.boardId), title: str(t.title).trim() || AYAR.varsayilanKutucukBasligi, layout, look: duzeltLook(t.look), lock: duzeltKilit(t.lock), blocks, createdAt: c, updatedAt: sayi(t.updatedAt, c) });
    });
    const sira = []; const gor = new Set();
    (Array.isArray(ham.boardOrder) ? ham.boardOrder : []).forEach((id) => { id = String(id); if (panoIdler.has(id) && !gor.has(id)) { gor.add(id); sira.push(id); } });
    boards.forEach((b) => { if (!gor.has(b.id)) { gor.add(b.id); sira.push(b.id); } });
    return { surum: AYAR.surum, boardOrder: sira, boards, tiles };
  }

  /* ---------- Depo ---------- */
  function olustur(ilk, secenek) {
    const simdi = (secenek && secenek.simdi) || Date.now;
    const durum = (ilk && normalizeEt(ilk)) || { surum: AYAR.surum, boardOrder: [], boards: [], tiles: [] };
    const dinleyiciler = [];

    const bildir = (olay) => { dinleyiciler.slice().forEach((f) => { try { f(olay); } catch (e) { /* dinleyici hatası depoyu bozmasın */ } }); };
    const pano = (id) => durum.boards.find((b) => b.id === id) || null;
    const kutu = (id) => durum.tiles.find((t) => t.id === id) || null;
    const dokun = (t) => { const s = simdi(); t.updatedAt = s; const p = pano(t.boardId); if (p) p.updatedAt = s; };

    function kullanilanResimler() {
      const k = new Set();
      durum.tiles.forEach((t) => t.blocks.forEach((b) => { if (b.type === 'image' && b.src) k.add(b.src); }));
      return k;
    }
    // Silinen bloklar arasında artık hiçbir yerde kullanılmayan resim kimlikleri (IndexedDB'den temizlenebilir)
    function yetimResimler(silinenBloklar) {
      const k = kullanilanResimler();
      const s = new Set();
      silinenBloklar.forEach((b) => { if (b.type === 'image' && b.src && !k.has(b.src)) s.add(b.src); });
      return Array.from(s);
    }

    function blokOlustur(tur, veri) {
      const t = BLOK[tur];
      if (!t) return null;
      const alanlar = t.duzelt(Object.assign({}, t.varsayilan(), veri || {}));
      return Object.assign({ id: yeniId('b'), type: tur }, alanlar);
    }

    const yerlesimDuzelt = duzeltYerlesim;

    /* ----- Panolar ----- */
    function createBoard(baslik) {
      const s = simdi();
      const b = { id: yeniId('p'), title: str(baslik).trim() || AYAR.varsayilanPanoBasligi, createdAt: s, updatedAt: s };
      durum.boards.push(b);
      durum.boardOrder.push(b.id);
      bildir({ tur: 'createBoard', id: b.id });
      return { ok: true, board: b };
    }
    function renameBoard(id, baslik) {
      const b = pano(id);
      if (!b) return hata('yok');
      const yeni = str(baslik).trim();
      if (yeni && yeni !== b.title) { b.title = yeni; b.updatedAt = simdi(); bildir({ tur: 'renameBoard', id }); }
      return { ok: true, board: b };                 // boş başlık eski başlığa döner
    }
    function moveBoard(id, hedefSira) {
      const i = durum.boardOrder.indexOf(id);
      if (i < 0) return hata('yok');
      durum.boardOrder.splice(i, 1);
      durum.boardOrder.splice(aralik(hedefSira, 0, durum.boardOrder.length), 0, id);
      bildir({ tur: 'moveBoard', id });
      return { ok: true };
    }
    function deleteBoard(id) {                       // onay görsel katmanda istenir
      const b = pano(id);
      if (!b) return hata('yok');
      if (durum.tiles.some((t) => t.boardId === id && t.lock !== 'none')) return hata('kilitliKutucuk');   // kilitli kutucuk silinemez: panoyla da silinmez
      const silinen = [];
      durum.tiles = durum.tiles.filter((t) => { if (t.boardId === id) { silinen.push.apply(silinen, t.blocks); return false; } return true; });
      durum.boards = durum.boards.filter((x) => x.id !== id);
      durum.boardOrder = durum.boardOrder.filter((x) => x !== id);
      bildir({ tur: 'deleteBoard', id });
      return { ok: true, silinenResimler: yetimResimler(silinen) };
    }

    /* ----- Boş yer bulma (yeni kutucuk ve kopya) ----- */
    // Satır genişliği (birim) görünüm katmanından gelir. Kutucuklar diğerlerine en az yerlesimBoslugu uzakta olmalı.
    const satirGenisligi = (v) => (typeof v === 'number' && isFinite(v) && v > 0 ? Math.floor(v) : AYAR.yedekSatirGenisligi);
    function cakisir(panoId, x, y, w, h) {
      const b = AYAR.yerlesimBoslugu;
      return durum.tiles.some((t) => t.boardId === panoId && x < t.layout.x + t.layout.w + b && x + w + b > t.layout.x && y < t.layout.y + t.layout.h + b && y + h + b > t.layout.y);
    }
    // Sol üstten (kenardan kenarBoslugu içeride) soldan sağa, sonra bir alt satır; ilk çakışmayan yer. Genişlik yetmezse x=kenarBoslugu.
    function bosYerBul(panoId, ayar) {
      const a = ayar || {};
      const k = AYAR.kenarBoslugu;
      const w = tamsayi(a.w) || AYAR.varsayilanGenislik, h = tamsayi(a.h) || AYAR.varsayilanYukseklik;
      const enSagX = Math.max(k, satirGenisligi(a.satirGenisligi) - k - w);
      let enAlt = k;
      durum.tiles.forEach((t) => { if (t.boardId === panoId) enAlt = Math.max(enAlt, t.layout.y + t.layout.h + AYAR.yerlesimBoslugu); });
      for (let y = k; y < enAlt; y++) {
        for (let x = k; x <= enSagX; x++) if (!cakisir(panoId, x, y, w, h)) return { x, y };
      }
      return { x: k, y: enAlt };
    }

    /* ----- Kutucuklar ----- */
    function createTile(panoId, ayar) {
      const p = pano(panoId);
      if (!p) return hata('yok');
      const a = ayar || {};
      const yer = yerlesimDuzelt(a, { x: 0, y: 0, w: AYAR.varsayilanGenislik, h: AYAR.varsayilanYukseklik });
      if (!yer) return hata('gecersiz');
      if (a.satirGenisligi != null && a.x == null && a.y == null) Object.assign(yer, bosYerBul(panoId, { w: yer.w, h: yer.h, satirGenisligi: a.satirGenisligi }));
      const s = simdi();
      const t = { id: yeniId('k'), boardId: panoId, title: str(a.title).trim() || AYAR.varsayilanKutucukBasligi, layout: yer, look: duzeltLook(null), lock: 'none', blocks: [], createdAt: s, updatedAt: s };
      durum.tiles.push(t);                           // dizinin sonu = en üstte
      dokun(t);
      bildir({ tur: 'createTile', id: t.id });
      return { ok: true, tile: t };
    }
    function updateTile(id, yama) {                  // yalnızca başlık; yerleşim için moveTile/resizeTile
      const t = kutu(id);
      if (!t) return hata('yok');
      if (t.lock === 'full') return hata('kilitli');   // tam kilit: içerik (başlık yazısı) da kilitli
      const yeni = str(yama && yama.title).trim();
      if (yeni && yeni !== t.title) { t.title = yeni; dokun(t); bildir({ tur: 'updateTile', id }); }
      return { ok: true, tile: t };                  // boş başlık eski başlığa döner
    }
    // Kilit türünü değiştirir; kilitliyken de (her türden) açılabilir/değiştirilebilir.
    function setTileLock(id, deger) {
      const t = kutu(id);
      if (!t) return hata('yok');
      if (KILITLER.indexOf(deger) < 0) return hata('gecersiz');
      if (t.lock !== deger) { t.lock = deger; dokun(t); bildir({ tur: 'setTileLock', id }); }
      return { ok: true, tile: t };
    }
    // Görünüm (renk, başlık boyutu, stil, ikon): konum kilidinde ve tam kilitte reddedilir.
    // Parçadaki tek bir geçersiz alan hepsini reddeder; bilinmeyen alanlar yok sayılır.
    function setTileLook(id, parca) {
      const t = kutu(id);
      if (!t) return hata('yok');
      if (t.lock !== 'none') return hata('kilitli');
      const p = parca && typeof parca === 'object' ? parca : {};
      const alanlar = Object.keys(LOOK_VARSAYILAN).filter((ad) => p[ad] !== undefined);
      if (alanlar.some((ad) => !LOOK_KURAL[ad](p[ad]))) return hata('gecersiz');
      alanlar.forEach((ad) => { t.look[ad] = p[ad]; });
      if (alanlar.length) { dokun(t); bildir({ tur: 'setTileLook', id }); }
      return { ok: true, tile: t };
    }
    function onePlanaGetir(id) {
      const i = durum.tiles.findIndex((t) => t.id === id);
      if (i < 0) return hata('yok');
      if (i !== durum.tiles.length - 1) { durum.tiles.push(durum.tiles.splice(i, 1)[0]); bildir({ tur: 'onePlanaGetir', id }); }
      return { ok: true };
    }
    // Taşıma/boyutlandırmanın ortak çekirdeği (sol/üst tutamaçtan boyutlandırma x'i de değiştirir).
    // secenek.onePlanaGetirme === false: kutucuğun üst üste sırası değişmez (içeriğe göre otomatik büyütmede kullanılır).
    function setTileLayout(id, parca, secenek) {
      const t = kutu(id);
      if (!t) return hata('yok');
      // Kilitliyken taşıma/boyutlandırma reddedilir. Tek istisna: konum kilidinde, içeriğin gerektirdiği
      // otomatik büyüme (secenek.icerikBuyume) kayda işlenir; tam kilitte içerik değişmediği için büyüme de yoktur.
      if (t.lock !== 'none' && !(t.lock === 'position' && secenek && secenek.icerikBuyume)) return hata('kilitli');
      const yer = yerlesimDuzelt(parca || {}, t.layout);
      if (!yer) return hata('gecersiz');
      t.layout = yer;                                // içerik (başlık, bloklar) dokunulmaz
      dokun(t);
      if (!(secenek && secenek.onePlanaGetirme === false)) onePlanaGetir(id);
      bildir({ tur: 'setTileLayout', id });
      return { ok: true, tile: t };
    }
    const moveTile = (id, x, y) => setTileLayout(id, { x, y });
    const resizeTile = (id, w, h) => setTileLayout(id, { w, h });
    function deleteTile(id) {                        // onay görsel katmanda istenir
      const t = kutu(id);
      if (!t) return hata('yok');
      if (t.lock !== 'none') return hata('kilitli');
      durum.tiles = durum.tiles.filter((x) => x.id !== id);
      const p = pano(t.boardId); if (p) p.updatedAt = simdi();
      bildir({ tur: 'deleteTile', id });
      return { ok: true, silinenResimler: yetimResimler(t.blocks) };
    }
    // Kopya: önce orijinalin sağına, olmazsa altına, o da doluysa genel boş yer kuralına göre yerleşir (üst üste binmez)
    function duplicateTile(id, secenek) {
      const t = kutu(id);
      if (!t) return hata('yok');
      if (t.lock !== 'none') return hata('kilitli');
      const k = klon(t);
      const s = simdi();
      k.id = yeniId('k');
      k.createdAt = s; k.updatedAt = s;
      const o = t.layout, w = o.w, h = o.h, b = AYAR.yerlesimBoslugu;
      const sg = satirGenisligi(secenek && secenek.satirGenisligi);
      let yer = null;
      if (o.x + o.w + b + w <= sg - AYAR.kenarBoslugu && !cakisir(t.boardId, o.x + o.w + b, o.y, w, h)) yer = { x: o.x + o.w + b, y: o.y };
      else if (!cakisir(t.boardId, o.x, o.y + o.h + b, w, h)) yer = { x: o.x, y: o.y + o.h + b };
      else yer = bosYerBul(t.boardId, { w, h, satirGenisligi: sg });
      k.layout.x = yer.x; k.layout.y = yer.y;
      k.blocks.forEach((b) => { b.id = yeniId('b'); if (b.type === 'list') b.items.forEach((o) => { o.id = yeniId('o'); }); });
      durum.tiles.push(k);
      dokun(k);
      bildir({ tur: 'duplicateTile', id: k.id });
      return { ok: true, tile: k };
    }

    /* ----- Bloklar ----- */
    function addBlock(kutuId, tur, veri, sira) {
      const t = kutu(kutuId);
      if (!t) return hata('yok');
      if (t.lock === 'full') return hata('kilitli');
      const b = blokOlustur(tur, veri);
      if (!b) return hata('tur');
      t.blocks.splice(aralik(sira == null ? t.blocks.length : sira, 0, t.blocks.length), 0, b);
      dokun(t);
      bildir({ tur: 'addBlock', id: b.id });
      return { ok: true, block: b };
    }
    function updateBlock(kutuId, blokId, yama) {
      const t = kutu(kutuId);
      if (!t) return hata('yok');
      if (t.lock === 'full') return hata('kilitli');
      const i = t.blocks.findIndex((b) => b.id === blokId);
      if (i < 0) return hata('yok');
      const eski = t.blocks[i];
      if (eski.type === 'image') {
        const y = yama || {};
        const srcDegisti = y.src !== undefined && (y.src ? String(y.src) : null) !== eski.src;
        const gorunumDegisti = RESIM_GORUNUM.some((k) => y[k] !== undefined && y[k] !== eski[k]);
        // Resim ölçeği/sığdırma/kırpma "görünüm" sayılır: konum kilidinde de reddedilir (içerik = resmin kendisi, alt yazı)
        if (t.lock !== 'none' && gorunumDegisti && !srcDegisti) return hata('kilitli');
        if (srcDegisti) {                                       // resmi değiştirmek kırpmayı ve ölçeği sıfırlar (Sığdır/Doldur seçimi kalır)
          yama = Object.assign({}, y, { scale: 100, posX: 0, posY: 0 });
          if (t.lock !== 'none') delete yama.fit;
        }
      }
      const alanlar = BLOK[eski.type].duzelt(Object.assign({}, eski, yama || {}));
      t.blocks[i] = Object.assign({ id: eski.id, type: eski.type }, alanlar);   // id ve tür değiştirilemez
      dokun(t);
      bildir({ tur: 'updateBlock', id: blokId });
      // Resim değiştiyse eski resim başka yerde kullanılmıyorsa yetim kalır (depodan silinebilir)
      return { ok: true, block: t.blocks[i], silinenResimler: eski.type === 'image' && eski.src !== t.blocks[i].src ? yetimResimler([eski]) : [] };
    }
    function removeBlock(kutuId, blokId) {
      const t = kutu(kutuId);
      if (!t) return hata('yok');
      if (t.lock === 'full') return hata('kilitli');
      const i = t.blocks.findIndex((b) => b.id === blokId);
      if (i < 0) return hata('yok');
      const silinen = t.blocks.splice(i, 1);
      dokun(t);
      bildir({ tur: 'removeBlock', id: blokId });
      return { ok: true, silinenResimler: yetimResimler(silinen) };
    }

    /* ----- Okuma (görsel katman yalnızca bunları kullanır; sonuçları değiştirmemelidir) ----- */
    const getBoards = () => durum.boardOrder.map(pano).filter(Boolean);
    const getTiles = (panoId) => durum.tiles.filter((t) => t.boardId === panoId);   // alttan üste (z sırası)
    const getTile = kutu;
    const getBoard = pano;
    const getBlock = (kutuId, blokId) => { const t = kutu(kutuId); return t ? (t.blocks.find((b) => b.id === blokId) || null) : null; };
    const anlik = () => klon(durum);                  // kaydetme/yedek için kopya
    function yukle(ham) {                             // kayıttan/yedekten gelen veriyle depoyu değiştirir (geçersizse dokunmaz)
      const n = normalizeEt(ham);
      if (!n) return hata('gecersiz');
      Object.assign(durum, n);
      bildir({ tur: 'yukle' });
      return { ok: true };
    }
    const kullanilanResimIdleri = () => Array.from(kullanilanResimler());
    const dinle = (f) => { dinleyiciler.push(f); return () => { const i = dinleyiciler.indexOf(f); if (i >= 0) dinleyiciler.splice(i, 1); }; };

    return {
      createBoard, renameBoard, moveBoard, deleteBoard,
      createTile, bosYerBul, updateTile, setTileLock, setTileLook, moveTile, resizeTile, setTileLayout, onePlanaGetir, deleteTile, duplicateTile,
      addBlock, updateBlock, removeBlock,
      getBoards, getBoard, getTiles, getTile, getBlock, anlik, yukle, kullanilanResimIdleri, dinle
    };
  }

  kok.VizyonMantik = { AYAR, LOOK, LOOK_VARSAYILAN, KILITLER, RESIM_OLCEK, RESIM_POS_SINIR, BLOK_TURLERI: Object.keys(BLOK), Liste, Tablo, birimeCevir, normalizeEt, olustur };
})(window);
</script>
<script id="vizyon-depo">
/* =====================================================================
   VİZYON PANOSU - RESİM DEPOSU (IndexedDB)
   Resimler localStorage'a değil buraya yazılır; bloklarda yalnızca resim kimliği tutulur.
   Eklenirken en uzun kenarı 1280px'e ve en çok 640 KB'a küçültülür (JPEG, kalite 0,72; sığmazsa kalite/boyut kademeli düşer). Bulut belgesi 1 MiB sınırı için.
   Yerelde olmayan resim, ihtiyaç anında bulutan indirilir (PlanizeEsitleme.resimGetir). Görsel kod yok.
   ===================================================================== */
(function (kok) {
  'use strict';
  const DB_AD = 'planim-vizyon'; const DEPO = 'resimler';
  const AYAR = { enUzunKenar: 1280, kalite: 0.72, enBuyukBlob: 640 * 1024, enBuyukDosya: 30 * 1024 * 1024, yetimEnAzYasMs: 60000 };

  let dbSoz = null;
  function ac() {
    if (dbSoz) return dbSoz;
    dbSoz = new Promise((coz, red) => {
      if (!kok.indexedDB) { red(new Error('Bu ortamda resim deposu (IndexedDB) kullanılamıyor.')); return; }
      let r;
      try { r = kok.indexedDB.open(DB_AD, 1); } catch (e) { red(e); return; }
      r.onupgradeneeded = () => { r.result.createObjectStore(DEPO, { keyPath: 'id' }); };
      r.onsuccess = () => coz(r.result);
      r.onerror = () => red(r.error || new Error('Resim deposu açılamadı.'));
      r.onblocked = () => red(new Error('Resim deposu başka bir pencere tarafından kilitli.'));
    });
    dbSoz.catch(() => { dbSoz = null; });           // hata olursa sonraki denemede yeniden açılsın
    return dbSoz;
  }
  // f(depo) bir istek (request) döndürür; sonuç işlem bitince verilir
  const islem = (mod, f) => ac().then((db) => new Promise((coz, red) => {
    const tx = db.transaction(DEPO, mod);
    const istek = f(tx.objectStore(DEPO));
    tx.oncomplete = () => coz(istek ? istek.result : undefined);
    tx.onerror = () => red(tx.error);
    tx.onabort = () => red(tx.error || new Error('Resim deposu işlemi iptal edildi.'));
  }));

  // Bitmap'i en uzun kenar ve bayt sınırına (bulut belgesi 1 MiB; base64 şişmesi payıyla 640 KB) sığdırır: önce kalite, sonra boyut kademeli düşer
  const OLCEKLER = [1, 0.85, 0.7, 0.55];
  const KALITELER = [null, 0.62, 0.52, 0.42];   // null: AYAR.kalite
  async function sigdir(bmp, enUzun) {
    const oran0 = Math.min(1, enUzun / Math.max(bmp.width, bmp.height));
    for (const o of OLCEKLER) {
      for (const q of KALITELER) {
        const w = Math.max(1, Math.round(bmp.width * oran0 * o)); const h = Math.max(1, Math.round(bmp.height * oran0 * o));
        const tuval = document.createElement('canvas');
        tuval.width = w; tuval.height = h;
        const g = tuval.getContext('2d');
        g.fillStyle = 'white'; g.fillRect(0, 0, w, h);   // saydam alan JPEG'de siyah kalmasın
        g.drawImage(bmp, 0, 0, w, h);
        const blob = await new Promise((coz) => tuval.toBlob(coz, 'image/jpeg', q == null ? AYAR.kalite : q));
        if (!blob) throw new Error('Resim işlenemedi.');
        if (blob.size <= AYAR.enBuyukBlob) return { blob, w, h };
      }
    }
    throw new Error('Bu resim çok büyük. Daha küçük bir resim seçin.');
  }
  async function kucult(dosya) {
    if (!dosya || !/^image\//.test(dosya.type)) throw new Error('Yalnızca resim dosyaları eklenebilir.');
    if (dosya.size > AYAR.enBuyukDosya) throw new Error('Dosya çok büyük (en fazla 30 MB).');
    let bmp;
    try { bmp = await createImageBitmap(dosya, { imageOrientation: 'from-image' }); } catch (e) { throw new Error('Resim okunamadı.'); }
    try { return await sigdir(bmp, AYAR.enUzunKenar); } finally { if (bmp.close) bmp.close(); }
  }
  // Eski (daha büyük) yerel resimler buluta giderken sığdırılır; zaten sığıyorsa aynen döner. Yerel kopya değişmez.
  async function bulutIcin(blob) {
    if (blob.size <= AYAR.enBuyukBlob) return { blob, w: null, h: null };
    let bmp;
    try { bmp = await createImageBitmap(blob); } catch (e) { throw new Error('Resim okunamadı.'); }
    try { return await sigdir(bmp, Math.max(bmp.width, bmp.height)); } finally { if (bmp.close) bmp.close(); }
  }

  const urlOnbellek = new Map();                    // id -> adres (bulunamadıysa null)
  const bekleyen = new Map();

  async function ekle(dosya) {
    const k = await kucult(dosya);
    const id = 'r_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    await islem('readwrite', (d) => d.put({ id, blob: k.blob, w: k.w, h: k.h, boyut: k.blob.size, createdAt: Date.now() }));
    return { id, w: k.w, h: k.h };            // küçültülmüş resmin kimliği ve piksel boyutu (oranı için)
  }
  function url(id) {                                // Promise<string|null>
    if (urlOnbellek.has(id)) return Promise.resolve(urlOnbellek.get(id));
    if (bekleyen.has(id)) return bekleyen.get(id);
    const s = islem('readonly', (d) => d.get(id)).then(async (kayit) => {
      let bulutta = false;
      if (!(kayit && kayit.blob) && kok.PlanizeEsitleme && kok.PlanizeEsitleme.resimGetir) {   // yerelde yok: bulutta varsa ihtiyaç anında indirilir
        bulutta = true;
        let k = null; try { k = await kok.PlanizeEsitleme.resimGetir(id); } catch (e) { k = null; }
        if (k && k.blob) { kayit = k; await islem('readwrite', (d) => d.put(k)).catch(() => {}); }
      }
      const u = kayit && kayit.blob ? URL.createObjectURL(kayit.blob) : null;
      if (u || !bulutta) urlOnbellek.set(id, u);   // bulutta aranıp bulunamayan resme "yok" yazılmaz: sonraki çizimde yeniden denenir
      bekleyen.delete(id);
      return u;
    }, () => { bekleyen.delete(id); return null; });
    bekleyen.set(id, s);
    return s;
  }
  const onbellekte = (id) => (urlOnbellek.has(id) ? urlOnbellek.get(id) : undefined);
  function sil(id) {
    const u = urlOnbellek.get(id);
    if (u) URL.revokeObjectURL(u);
    urlOnbellek.delete(id);
    if (kok.PlanizeEsitleme && kok.PlanizeEsitleme.resimSil) { try { kok.PlanizeEsitleme.resimSil(id); } catch (e) { /* bulut silme başarısızsa yerel silme sürsün */ } }
    return islem('readwrite', (d) => d.delete(id)).catch(() => {});
  }
  // Hiçbir blokta kullanılmayan (ve yeni eklenmemiş) resimleri siler; silinen sayısını verir
  async function temizle(kullanilanIdler) {
    const k = new Set(kullanilanIdler);
    const hepsi = await islem('readonly', (d) => d.getAll());
    const sinir = Date.now() - AYAR.yetimEnAzYasMs;
    const yetim = hepsi.filter((r) => !k.has(r.id) && r.createdAt < sinir).map((r) => r.id);
    for (const id of yetim) await sil(id);
    return yetim.length;
  }
  const tumKayitlar = () => islem('readonly', (d) => d.getAll());
  const al = (id) => islem('readonly', (d) => d.get(id)).catch(() => undefined);   // ham kayıt (eşitleme katmanı için)
  // Yedekten gelen resmi depoya yazar ({ id, blob, w, h }); daha önce "yok" diye önbelleğe alınmış adres temizlenir
  function koy(k) {
    const u = urlOnbellek.get(k.id); if (u) URL.revokeObjectURL(u);
    urlOnbellek.delete(k.id);
    return islem('readwrite', (d) => d.put({ id: k.id, blob: k.blob, w: k.w, h: k.h, boyut: k.blob.size, createdAt: Date.now() }));
  }

  kok.VizyonResim = { AYAR, ekle, url, onbellekte, sil, temizle, tumKayitlar, al, bulutIcin, koy };
})(window);
</script>
<script id="vizyon-test">
/* Vizyon mantık testleri: yalnızca adres #vizyon-test ile açılınca çalışır, uygulamayı etkilemez.

    // --- Kutucuk oluşturma ve yerleşim ---
    const k1 = d.createTile(p1.id, { title: 'Yaz tatili' }).tile;
    kontrol('varsayılan yerleşim', esit(k1.layout, { x: 0, y: 0, w: V.AYAR.varsayilanGenislik, h: V.AYAR.varsayilanYukseklik }));
    const k2 = d.createTile(p1.id, { x: -5, y: 3.6, w: 1, h: 1 }).tile;
    kontrol('negatif konum 0, ondalık tam sayıya, küçük boyut alt sınıra', esit(k2.layout, { x: 0, y: 4, w: V.AYAR.enAzGenislik, h: V.AYAR.enAzYukseklik }));
    kontrol('geçersiz sayıda hata döner', d.createTile(p1.id, { x: NaN }).hata === 'gecersiz');
    kontrol('kutucuğun updatedAt >= createdAt', k1.updatedAt >= k1.createdAt);

    const bt = d.addBlock(k1.id, 'text', { text: 'merhaba' }).block;
    const oncesi = JSON.stringify({ t: d.getTile(k1.id).title, b: d.getTile(k1.id).blocks });
    d.moveTile(k1.id, 10, 7);
    d.resizeTile(k1.id, 12, 9);
    const sonrasi = JSON.stringify({ t: d.getTile(k1.id).title, b: d.getTile(k1.id).blocks });
    kontrol('taşıma/boyutlandırma yerleşimi değiştirir', esit(d.getTile(k1.id).layout, { x: 10, y: 7, w: 12, h: 9 }));
    kontrol('taşıma/boyutlandırma başlık ve blokları değiştirmez', oncesi === sonrasi);
    d.setTileLayout(k1.id, { x: 8, w: 14 });

    // --- Üst üste binme / z sırası ---

    d.onePlanaGetir(k1.id);
    kontrol('öne getir çalışır', d.getTiles(p1.id).pop().id === k1.id);
    d.setTileLayout(k2.id, { h: 20 }, { onePlanaGetirme: false });
    kontrol('onePlanaGetirme:false sırayı değiştirmez ama yerleşimi günceller', d.getTiles(p1.id).pop().id === k1.id && d.getTile(k2.id).layout.h === 20);
    d.setTileLayout(k2.id, { h: 9 });

    // --- Kutucuk kilidi (Madde 5): önce temel davranış, işlem tablosu aşağıda ---

    kontrol('konum kilidinde taşıma reddedilir', d.moveTile(k1.id, 1, 1).hata === 'kilitli');

    // --- Bloklar ---
    kontrol('4 blok türü var', esit(V.BLOK_TURLERI.slice().sort(), ['image', 'list', 'table', 'text']));

    const bid = d.getBlock(k1.id, bt.id).id;
    d.updateBlock(k1.id, bt.id, { id: 'x', type: 'list', text: 'değişti' });
    kontrol('blok id ve türü değiştirilemez', d.getBlock(k1.id, bid) && d.getBlock(k1.id, bid).type === 'text' && d.getBlock(k1.id, bid).text === 'değişti');

    // --- Liste ---
    d.updateBlock(k1.id, bl.id, V.Liste.ekle(d.getBlock(k1.id, bl.id), 'bilet al'));
    d.updateBlock(k1.id, bl.id, V.Liste.ekle(d.getBlock(k1.id, bl.id), 'otel bul'));
    let L = d.getBlock(k1.id, bl.id);
    kontrol('listeye öğe eklenir', L.items.length === 2 && L.items[0].done === false);
    d.updateBlock(k1.id, bl.id, V.Liste.isaretle(L, L.items[0].id));
    kontrol('onay kutusu işaretlenir', d.getBlock(k1.id, bl.id).items[0].done === true);
    L = d.getBlock(k1.id, bl.id);
    d.updateBlock(k1.id, bl.id, V.Liste.sil(L, L.items[1].id));
    kontrol('liste öğesi silinir', d.getBlock(k1.id, bl.id).items.length === 1);

    // --- Tablo ---
    const T = () => d.getBlock(k1.id, bx.id);
    d.updateBlock(k1.id, bx.id, V.Tablo.satirEkle(T()));
    d.updateBlock(k1.id, bx.id, V.Tablo.sutunEkle(T(), 1));
    kontrol('satır ve sütun eklenir (4x4, dikdörtgen)', T().rows.length === 4 && T().rows.every((r) => r.length === 4) && T().colWidths.length === 4 && T().align.length === 4);
    d.updateBlock(k1.id, bx.id, V.Tablo.hucre(T(), 0, 1, 'başlık'));

  async function resimleriYedektenYukle(liste) {
    if (!Array.isArray(liste)) return 0;
