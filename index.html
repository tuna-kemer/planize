<script id="sw-kayit">
/* Servis çalışanı (Adım 8): uygulamanın internetsiz açılması için. Yalnızca https ve localhost'ta; file:// ve mantık testi sayfasında kayıt yapılmaz.
   Kayıt başarısız olursa uygulama yine normal çalışır. */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') && location.hash !== '#vizyon-test') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* kayıt olmadı: servis çalışanı olmadan devam */ }); });
}
</script>
<title>Planize</title>
<script id="depo-katman">
/* DEPO KATMANI (eşitleme hazırlığı, Adım 2): uygulamanın yerel depoya (localStorage) yazdığı/okuduğu HER yer buradan geçer.
   Davranış eskisiyle aynıdır (okuma/yazma hataları çağıran yerde yakalanır). Sonraki adımlarda buluta bağlanma noktası burasıdır.
   yerelMi(): buluta gitmeyecek anahtarlar (iç yedekler, kurtarma kopyaları, pencere varlığı, arayüz durumu). */
(function (kok) {
  'use strict';
  const YEREL = { 'planim.yedekler.v1': 1, 'planim.kurtarma.v1': 1, 'planim.pencereler.v1': 1, 'planim.ui.v2': 1, 'planize.oturum.v1': 1, 'planize.cihaz.v1': 1, 'planize.esitleme.taban.v1': 1, 'planize.esitleme.resim.v1': 1 };
  const yazinca = [];          // başarılı her yazmadan sonra çağrılır: ({ anahtar, yerel })
  const disaridan = [];        // başka pencere/sekme değiştirince çağrılır (storage olayı)
  let disDinleniyor = false;

  const al = (k) => kok.localStorage.getItem(k);
  function koy(k, ham) {
    kok.localStorage.setItem(k, ham);       // başarısızsa hata aynen çağırana gider (kota dolu vb.)
    yazinca.slice().forEach((f) => { try { f({ anahtar: k, yerel: !!YEREL[k] }); } catch (e) { /* dinleyici kaydı bozmasın */ } });
  }
  const kaydetKancalari = [];
  const sessizKoy = (k, ham) => { kok.localStorage.setItem(k, ham); };   // eşitleme katmanı kullanır: yazma dinleyicilerini tetiklemez
  function disaridanBildir(e) { disaridan.slice().forEach((g) => { try { g(e); } catch (er) { /* dinleyici hatası kaydı bozmasın */ } }); }
  function kaydetKancasi(f) { kaydetKancalari.push(f); }                // uygulama: bekleyen gecikmeli kayıtları depoya yaz
  function kaydetIste() { kaydetKancalari.forEach((f) => { try { f(); } catch (e) { /* yoksay */ } }); }
  function kaldir(k) {
    kok.localStorage.removeItem(k);
    yazinca.slice().forEach((f) => { try { f({ anahtar: k, yerel: !!YEREL[k], silindi: true }); } catch (e) { /* dinleyici kaydı bozmasın */ } });
  }
  function disaridanDegisti(f) {
    disaridan.push(f);
    if (disDinleniyor) return;
    disDinleniyor = true;
    kok.addEventListener('storage', (e) => { disaridan.slice().forEach((g) => g(e)); });
  }

  kok.PlanizeDepo = { al, koy, kaldir, sessizKoy, disaridanBildir, kaydetKancasi, kaydetIste, yerelMi: (k) => !!YEREL[k], yazinca: (f) => { yazinca.push(f); }, disaridanDegisti };
})(window);
</script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1204 1204'%3E%3Crect width='1204' height='1204' rx='228' fill='%23000'/%3E%3Cpath fill='%23E5E2D0' d='M258.8 250.8H729.1V353.1H554.1V828.8H433.4V353.1H258.8Z'/%3E%3Cpath fill='%23FFF' d='M496.8 446.5H602.6V652.7L796.3 446.5H933.1L726.3 654.1L945.2 953.3H808.7L652.2 731L602.6 781.6V953.3H496.8Z'/%3E%3C/svg%3E">
<script>
/* Temalar (7c, 8d): ilk çizimden önce uygulanır, açılışta yanlış tema yanıp sönmez. Seçimler planim.ayarlar.v1 içinde: "theme" (Planlayıcı), "homeTheme" (Anasayfa). */
(function () {
  try {
    var s = JSON.parse(PlanizeDepo.al('planim.ayarlar.v1') || 'null');
    var t = s && s.theme, h = s && s.homeTheme;
    if (t && /^(klasik|antrasit|murekkep|gece|yumusak|komur|mavi|mor|sicak|lacivert)$/.test(t)) document.documentElement.setAttribute('data-theme', t);
    if (h && /^(orman|koyu-orman|zeytin|cam|adacayi)$/.test(h)) document.documentElement.setAttribute('data-home', h);
  } catch (e) { /* depo okunamazsa klasik kalır */ }
})();
</script>

<script id="giris-katman">
/* GİRİŞ KATMANI (eşitleme Adım 3): Firebase Authentication, yalnızca e-posta + şifre (Google ile giriş yok, kayıt ekranı yok).
   Giriş yapılana kadar uygulama gizlenir. Şifre hiçbir yere yazılmaz/kaydedilmez/loglanmaz; yalnızca Firebase'e gönderilir.
   Kitaplık Google'ın adresinden sabit sürümle yüklenir. Yerel deneme: http://localhost:8000 (file:// adresinde Firebase girişi çalışmaz).
   Dışa açılan: PlanizeGiris { durum, acikMi, eposta, uid, cikis, dinle }. durum: bekle | giris-gerekli | acik | cevrimdisi-acik | hata */
(function (kok) {
  'use strict';
  const FB_AYAR = {   // herkese açık olabilecek istemci ayarları (sır değil; erişimi Firestore kuralları korur)
    apiKey: 'AIzaSyBRk54GzO6Y-8JvwXHoVRfP-rzDJMc6JHg', authDomain: 'planora-tk.firebaseapp.com', projectId: 'planora-tk',
    storageBucket: 'planora-tk.firebasestorage.app', messagingSenderId: '144736050814', appId: '1:144736050814:web:0b7640be90691441f7022f'
  };
  const SURUM = '11.10.0';
  const ADRES = 'https://www.gstatic.com/firebasejs/' + SURUM + '/';
  const KEY_OTURUM = 'planize.oturum.v1';   // yalnızca "bu cihazda daha önce giriş yapıldı" işareti ('1'); kişisel veri içermez
  const html = document.documentElement;
  const test = location.hash === '#vizyon-test';   // mantık testleri girişsiz çalışır (uygulamayı etkilemez)
  const dinleyiciler = [];
  let durum = 'bekle', neden = '', kullanici = null, auth = null, sdk = null, fbApp = null;

  if (!test) html.classList.add('giris-bekle');

  const oturumVar = () => { try { return PlanizeDepo.al(KEY_OTURUM) === '1'; } catch (e) { return false; } };
  function oturumYaz(var_) { try { if (var_) PlanizeDepo.koy(KEY_OTURUM, '1'); else PlanizeDepo.kaldir(KEY_OTURUM); } catch (e) { /* yoksay */ } }

  const MESAJ = {
    'auth/invalid-credential': 'E-posta ya da şifre hatalı.',
    'auth/wrong-password': 'E-posta ya da şifre hatalı.',
    'auth/user-not-found': 'E-posta ya da şifre hatalı.',
    'auth/invalid-email': 'E-posta adresi geçersiz görünüyor.',
    'auth/missing-password': 'Şifreyi yazın.',
    'auth/network-request-failed': 'İnternet bağlantısı yok ya da zayıf. Bağlantıyı kontrol edip tekrar deneyin.',
    'auth/too-many-requests': 'Çok fazla hatalı deneme yapıldı. Birkaç dakika bekleyip tekrar deneyin.',
    'auth/user-disabled': 'Bu hesap devre dışı bırakılmış.',
    'auth/operation-not-allowed': 'E-posta ile giriş Firebase konsolunda kapalı. Authentication > Sign-in method bölümünden açılmalı.',
    'auth/operation-not-supported-in-this-environment': 'Bu adres Firebase girişini desteklemiyor. Uygulamayı http://localhost:8000 ya da yayın adresinden açın.',
    'auth/unauthorized-domain': 'Bu adres Firebase\'de yetkili değil. Authentication > Settings > Authorized domains listesine eklenmeli.'
  };
  const mesaj = (kod) => MESAJ[kod] || ('Giriş yapılamadı. Biraz sonra tekrar deneyin.' + (kod ? ' (' + kod + ')' : ''));

  function bildir() { dinleyiciler.slice().forEach((f) => { try { f(durum); } catch (e) { /* dinleyici girişi bozmasın */ } }); }
  function ayarla(yeni, k, n) {
    durum = yeni; kullanici = k || null; neden = n || '';
    html.classList.toggle('giris-bekle', !test && yeni !== 'acik' && yeni !== 'cevrimdisi-acik' && yeni !== 'yerel');
    ekranGuncelle();
    bildir();
  }

  // ---- Ekran ----
  let ekran = null;
  const el = (id) => document.getElementById(id);
  function ekranKur() {
    if (test || ekran) return;
    ekran = document.createElement('div');
    ekran.id = 'giris-ekran';
    ekran.setAttribute('data-anasayfa-tema', html.getAttribute('data-home') || 'orman');   // Anasayfa temasının değişken kümesi
    ekran.setAttribute('role', 'dialog'); ekran.setAttribute('aria-modal', 'true'); ekran.setAttribute('aria-label', 'Giriş');
    ekran.innerHTML = `<div class="gr-kart">
      <span class="mark on-dark" role="img" aria-label="Planize"><svg viewBox="0 0 1204 1204" aria-hidden="true" focusable="false"><rect width="1204" height="1204" rx="228" fill="#000"/><path fill="#E5E2D0" d="M258.8 250.8H729.1V353.1H554.1V828.8H433.4V353.1H258.8Z"/><path fill="#FFF" d="M496.8 446.5H602.6V652.7L796.3 446.5H933.1L726.3 654.1L945.2 953.3H808.7L652.2 731L602.6 781.6V953.3H496.8Z"/></svg></span>
      <h1>Planize</h1>
      <p class="gr-alt" id="gr-alt"></p>
      <form id="gr-form" novalidate>
        <label class="gr-etiket" for="gr-eposta">E-posta</label>
        <input id="gr-eposta" type="email" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false">
        <label class="gr-etiket" for="gr-sifre">Şifre</label>
        <div class="gr-sifre"><input id="gr-sifre" type="password" autocomplete="current-password"><button type="button" class="gr-goster" id="gr-goster" aria-pressed="false">Göster</button></div>
        <div class="warn" id="gr-hata" role="alert" hidden></div>
        <button type="submit" class="btn-p" id="gr-gonder">Giriş yap</button>
      </form>
      <div class="gr-durum" id="gr-durum" role="status" hidden></div>
      <button type="button" class="btn-s" id="gr-tekrar" hidden>Tekrar dene</button>
    </div>`;
    document.body.appendChild(ekran);
    // Kilitliyken uygulamanın klavye kısayolları/tıklamaları çalışmasın (uygulama dinleyicileri document'te)
    ['keydown', 'keyup', 'keypress', 'click', 'input', 'change', 'paste', 'drop'].forEach((tur) => {
      ekran.addEventListener(tur, (e) => e.stopPropagation());
      kok.addEventListener(tur, (e) => { if (html.classList.contains('giris-bekle') && !(e.target && e.target.closest && e.target.closest('#giris-ekran'))) e.stopPropagation(); }, true);
    });
    el('gr-goster').addEventListener('click', () => {
      const s = el('gr-sifre'); const ac = s.type === 'password';
      s.type = ac ? 'text' : 'password'; el('gr-goster').textContent = ac ? 'Gizle' : 'Göster'; el('gr-goster').setAttribute('aria-pressed', String(ac));
    });
    el('gr-tekrar').addEventListener('click', () => { ayarla('bekle'); baslat(); });
    el('gr-form').addEventListener('submit', gonder);
    ekranGuncelle();
  }
  function hataGoster(m) { const h = el('gr-hata'); if (!h) return; h.textContent = m || ''; h.hidden = !m; }
  function ekranGuncelle() {
    if (!ekran) return;
    const bekle = durum === 'bekle', gir = durum === 'giris-gerekli', hata = durum === 'hata';
    el('gr-form').hidden = !gir;
    el('gr-durum').hidden = !(bekle || hata);
    el('gr-tekrar').hidden = !hata || neden === 'file';
    el('gr-alt').textContent = gir ? 'Devam etmek için giriş yapın.' : '';
    el('gr-durum').textContent = bekle ? 'Kontrol ediliyor…'
      : (neden === 'file' ? 'Bu dosya doğrudan (file://) açıldı; Firebase girişi bu şekilde çalışmaz. Uygulamayı http://localhost:8000 ya da yayın adresinden açın.'
        : (hata ? 'Bağlantı kurulamadı. İlk girişte internet gerekir. Bağlantıyı kontrol edip tekrar deneyin.' : ''));
    if (!gir) hataGoster('');
    if (gir && html.classList.contains('giris-bekle') && document.activeElement !== el('gr-sifre')) setTimeout(() => { const e = el('gr-eposta'); if (e && !e.value) e.focus(); }, 50);
  }
  async function gonder(e) {
    e.preventDefault();
    const ep = el('gr-eposta').value.trim(), sf = el('gr-sifre').value;
    if (!ep || !sf) { hataGoster('E-posta ve şifreyi yazın.'); return; }
    if (!sdk || !auth) { hataGoster(mesaj('auth/network-request-failed')); return; }
    const dugme = el('gr-gonder'); dugme.disabled = true; dugme.textContent = 'Giriş yapılıyor…'; hataGoster('');
    try { await sdk.signInWithEmailAndPassword(auth, ep, sf); }   // başarılıysa onAuthStateChanged kilidi açar
    catch (err) { hataGoster(mesaj(err && err.code)); el('gr-sifre').value = ''; el('gr-sifre').focus(); }
    finally { dugme.disabled = false; dugme.textContent = 'Giriş yap'; if (el('gr-sifre')) el('gr-sifre').value = ''; }
  }

  // ---- Firebase ----
  const zamanAsimi = (p, ms) => new Promise((coz, red) => { const z = setTimeout(() => red(new Error('zaman-asimi')), ms); p.then((v) => { clearTimeout(z); coz(v); }, (er) => { clearTimeout(z); red(er); }); });
  async function baslat() {
    if (test) return;
    if (location.protocol === 'file:') { ayarla('yerel'); return; }   // doğrudan dosya olarak açıldı: giriş/bulut yok, veri yalnızca bu bilgisayarda (yedek almak için kullanılabilir)
    try {
      const m = await zamanAsimi(Promise.all([import(ADRES + 'firebase-app.js'), import(ADRES + 'firebase-auth.js')]), 12000);
      sdk = m[1];
      fbApp = m[0].initializeApp(FB_AYAR); auth = sdk.initializeAuth(fbApp, { persistence: [sdk.indexedDBLocalPersistence, sdk.browserLocalPersistence] });   // yönlendirme/açılır pencere çözücüsü yok: yalnızca e-posta girişi, ek iframe yüklenmez
      sdk.onAuthStateChanged(auth, (u) => {
        if (u) { oturumYaz(true); ayarla('acik', u); } else { oturumYaz(false); ayarla('giris-gerekli'); }
      }, () => ayarla('hata', null, 'baglanti'));
    } catch (e) {
      // Kitaplık yüklenemedi (internet yok). Bu cihazda daha önce giriş yapıldıysa uygulama çevrimdışı açılır.
      if (oturumVar()) ayarla('cevrimdisi-acik'); else ayarla('hata', null, 'baglanti');
    }
  }
  async function cikis() {
    if (sdk && auth) { try { await sdk.signOut(auth); return true; } catch (e) { return false; } }
    oturumYaz(false); ayarla('hata', null, 'baglanti'); return true;   // çevrimdışı açılmıştı: kilitle
  }

  kok.PlanizeGiris = {
    durum: () => durum, acikMi: () => durum === 'acik' || durum === 'cevrimdisi-acik',
    eposta: () => (kullanici && kullanici.email) || '', uid: () => (kullanici && kullanici.uid) || null,
    cikis, uygulama: () => fbApp, adres: ADRES, dinle: (f) => { dinleyiciler.push(f); }
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ekranKur); else ekranKur();
  baslat();
})(window);
</script>
<style id="esitleme-stil">
  /* Eşitleme durum etiketi (üst çubuk): renkler yalnızca tema değişkenlerinden gelir */
  .esit-etiket { display: flex; align-items: center; gap: 7px; border: none; background: transparent; color: var(--yazi-soluk); font: inherit; font-size: 12.5px; font-weight: 600;

  @media (max-width: 600px) { .esit-yazi { display: none; } }
</style>
<script id="esitleme-katman">
/* ESİTLEME KATMANI (Adım 4): yerel veri (localStorage) <-> Firebase Firestore, "önce yerel" mantığıyla.
   Yol: users/{uid}/{koleksiyon}/{kayıt kimliği}; her belge { veri: "<kaydın JSON metni>", g: sunucu saati, s: silindi mi, c: cihaz }.
   Kaydın tamamı `veri` metnindedir (iç içe dizi sınırı, alan sırası ve bilinmeyen alanlar sorun olmaz). Çakışmada son yazan kazanır;
   ezilen sürüm `cakismalar` koleksiyonuna yedeklenir (son 50). Çevrimdışıyken değişiklikler yerelde bekler, bağlantı gelince gider.
   "Taban" kaydı (planize.esitleme.taban.v1): her kaydın bulutla son uyuştuğu özet+sunucu zamanı; yerel/uzak farkı buradan anlaşılır.
   Dışa açılan: PlanizeEsitleme { durum, etiketHTML, bolumHTML, cakismalar, geriGetir, simdi, hepsiniGonder, frenOnayla, dinle } */
(function (kok) {
  'use strict';
  const K = { gorevler: 'planim.tasks.v1', arsiv: 'planim.arsiv.v1', listeler: 'planim.lists.v1', notlar: 'planim.notes.v1', gecmis: 'planim.log.v1',
    ayarlar: 'planim.ayarlar.v1', renk: 'planim.calcolor.v1', vizyon: 'planim.vizyon.v1' };
  const SENKRON_ANAHTAR = Object.keys(K).map((a) => K[a]);
  const KEY_TABAN = 'planize.esitleme.taban.v1', KEY_CIHAZ = 'planize.cihaz.v1', KEY_RESIM = 'planize.esitleme.resim.v1';
  const CIHAZ = (() => { try { let c = PlanizeDepo.al(KEY_CIHAZ); if (!c) { c = 'c_' + Math.random().toString(36).slice(2, 8); PlanizeDepo.koy(KEY_CIHAZ, c); } return c; } catch (e) { return 'c_?'; } })();
  const dinleyiciler = [];
  let sdk = null, db = null, uid = null, nesil = 0, abonelikler = [], taban = {};
  let hata = null, yazimda = false, bekleyen = 0, sonEsit = 0, cakismaListe = [], fren = null, frenIzin = false, baslangic = 0;
  let sunucuda = {}, ilkGeldi = {};
  let uzakVeri = {};   // koleksiyon -> Map(kimlik -> { h: özet, g: sunucu zamanı, veri }): bulutta şu an olan kayıtlar (taşıma özeti ve bulut yedeği için)
  let resimVar = new Set(), resimBekle = new Set();   // buluta yüklenmiş / yüklenecek resim kimlikleri
  const resimYok = new Map();                         // bulutta bulunamayan resim -> son deneme zamanı (gereksiz okuma olmasın)
  let planTimer = null, tabanTimer = null, yenidenTimer = null, sonMesaj = '', sonMesajZamani = 0;

  // ---- Yardımcılar ----
  const sirala = (v) => {
    if (Array.isArray(v)) return v.map(sirala);

  const kanon = (v) => JSON.stringify(sirala(v));
  function ozet(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36) + '.' + s.length; }
  const oku = (k) => { const ham = PlanizeDepo.al(k); if (ham == null) return undefined; try { return JSON.parse(ham); } catch (e) { return null; } };   // undefined: yok, null: bozuk
  const yaz = (k, v) => PlanizeDepo.sessizKoy(k, JSON.stringify(v));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const bildir = (o) => dinleyiciler.slice().forEach((f) => { try { f(o); } catch (e) { /* dinleyici eşitlemeyi bozmasın */ } });
  const zamanAsimi = (p, ms) => new Promise((coz, red) => { const z = setTimeout(() => red(new Error('zaman-asimi')), ms); p.then((v) => { clearTimeout(z); coz(v); }, (er) => { clearTimeout(z); red(er); }); });

  // ---- Kaynaklar: her biri yerel veriyi "kimlik -> kanonik metin" olarak okur ve uzaktan gelen değişikliği yerele uygular ----
  function dizi(kol, anahtar, etiket, yeniYer) {
    return { kol, etiket, tek: false, sahip: () => true,
      yerel() {
        const a = oku(anahtar); if (a === undefined) return new Map(); if (!Array.isArray(a)) return null;
        const m = new Map(); a.forEach((r) => { if (r && typeof r === 'object' && r.id != null && String(r.id).indexOf('/') < 0) m.set(String(r.id), kanon(r)); }); return m;
      },
      uygula(d) {
        let a = oku(anahtar); if (a === null) return []; if (a === undefined) a = [];
        d.forEach((str, id) => {
          const i = a.findIndex((r) => r && String(r.id) === id);
          if (str === null) { if (i >= 0) a.splice(i, 1); return; }
          const r = JSON.parse(str);
          if (i >= 0) a[i] = r; else if (yeniYer === 'bas') a.unshift(r); else a.push(r);
        });
        if (kol === 'notlar') a.sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0));   // not sırası: yeniden eskiye (uygulamadaki gibi)
        yaz(anahtar, a); return [anahtar];
      } };
  }
  function vizDizi(kol, alan, etiket) {
    return { kol, etiket, tek: false, sahip: () => true,
      yerel() {
        const o = oku(K.vizyon); if (o === undefined) return new Map(); if (!o || typeof o !== 'object') return null;
        const a = o[alan]; if (a === undefined) return new Map(); if (!Array.isArray(a)) return null;
        const m = new Map(); a.forEach((r) => { if (r && typeof r === 'object' && r.id != null && String(r.id).indexOf('/') < 0) m.set(String(r.id), kanon(r)); }); return m;
      },
      uygula(d) {
        let o = oku(K.vizyon); if (o === null) return [];
        if (!o || typeof o !== 'object') o = { surum: 1, boardOrder: [], boards: [], tiles: [] };
        ['boards', 'tiles', 'boardOrder'].forEach((x) => { if (!Array.isArray(o[x])) o[x] = []; });
        const a = o[alan];
        d.forEach((str, id) => {
          const i = a.findIndex((r) => r && String(r.id) === id);
          if (str === null) { if (i >= 0) a.splice(i, 1); return; }
          const r = JSON.parse(str); if (i >= 0) a[i] = r; else a.push(r);
        });
        if (alan === 'boards') {
          const ids = new Set(o.boards.map((b) => String(b.id)));
          o.boardOrder = o.boardOrder.filter((i) => ids.has(String(i)));
          o.boards.forEach((b) => { if (o.boardOrder.indexOf(b.id) < 0) o.boardOrder.push(b.id); });
        }
        yaz(K.vizyon, o); return [K.vizyon];
      } };
  }
  function tek(kol, id, etiket, yerelFn, uygulaFn) {
    return { kol, etiket, tek: true, sahip: (i) => i === id,
      yerel() { const s = yerelFn(); return s === null ? null : (s === undefined ? new Map() : new Map([[id, s]])); },
      uygula(d) { return d.has(id) && d.get(id) !== null ? uygulaFn(JSON.parse(d.get(id))) : []; } };
  }
  const KAYNAKLAR = [
    dizi('gorevler', K.gorevler, 'Görev', 'bas'), dizi('arsiv', K.arsiv, 'Arşiv görevi', 'bas'), dizi('listeler', K.listeler, 'Liste', 'son'), dizi('notlar', K.notlar, 'Not', 'bas'),
    vizDizi('vizyon_panolar', 'boards', 'Vizyon panosu'), vizDizi('vizyon_kutucuklar', 'tiles', 'Vizyon kutucuğu'),
    tek('gecmis', 'ana', 'Tamamlama geçmişi', () => { const a = oku(K.gecmis); return a === undefined ? undefined : (Array.isArray(a) ? kanon(a) : null); }, (a) => { yaz(K.gecmis, a); return [K.gecmis]; }),
    tek('ayarlar', 'genel', 'Ayarlar', () => {
      const s = oku(K.ayarlar); if (s === null) return null;
      const o = {}; ['theme', 'homeTheme', 'sound', 'confirmDelete'].forEach((f) => { if (s && s[f] !== undefined) o[f] = s[f]; });
      const c = oku(K.renk); if (typeof c === 'number') o.calColor = c;
      return Object.keys(o).length ? kanon(o) : undefined;
    }, (o) => {
      const s = oku(K.ayarlar) || {}; ['theme', 'homeTheme', 'sound', 'confirmDelete'].forEach((f) => { if (o[f] !== undefined) s[f] = o[f]; });
      yaz(K.ayarlar, s); if (typeof o.calColor === 'number') yaz(K.renk, o.calColor); return [K.ayarlar, K.renk];
    }),
    tek('ayarlar', 'vizyon', 'Vizyon pano sırası', () => { const o = oku(K.vizyon); if (o === undefined) return undefined; if (!o || !Array.isArray(o.boardOrder)) return null; return kanon({ boardOrder: o.boardOrder }); },
      (x) => { const o = oku(K.vizyon); if (!o || !Array.isArray(o.boards) || !Array.isArray(x.boardOrder)) return []; const ids = new Set(o.boards.map((b) => String(b.id)));
        const sira = x.boardOrder.filter((i) => ids.has(String(i))); o.boards.forEach((b) => { if (sira.indexOf(b.id) < 0) sira.push(b.id); }); o.boardOrder = sira; yaz(K.vizyon, o); return [K.vizyon]; })
  ];
  const KOLEKSIYONLAR = KAYNAKLAR.map((k) => k.kol).filter((v, i, a) => a.indexOf(v) === i);
  const kaynakBul = (kol, id) => KAYNAKLAR.find((k) => k.kol === kol && k.sahip(id)) || null;

  // ---- Taban ----
  function tabanYukle() {
    try { const o = JSON.parse(PlanizeDepo.al(KEY_TABAN) || 'null'); if (o && o.uid === uid && o.kayit && typeof o.kayit === 'object') return o.kayit; } catch (e) { /* yeniden tohumla */ }
    return null;
  }
  function tabanTohumla() {   // ilk açılış: mevcut yerel veri "bulutla uyuşmuş" sayılır (eski veri kendiliğinden buluta gitmez)
    const t = {};
    KAYNAKLAR.forEach((kay) => { const m = kay.yerel(); if (m) m.forEach((str, id) => { t[kay.kol + '/' + id] = [ozet(str), 0]; }); });
    return t;
  }
  function tabanKaydet() { clearTimeout(tabanTimer); tabanTimer = null; try { PlanizeDepo.koy(KEY_TABAN, JSON.stringify({ uid, kayit: taban })); } catch (e) { /* yer yoksa bir sonraki sefer */ } }
  const tabanSoon = () => { if (!tabanTimer) tabanTimer = setTimeout(tabanKaydet, 500); };

  // ---- Durum ----
  const ETIKET = { esit: 'Eşitlendi', esitleniyor: 'Eşitleniyor…', cevrimdisi: 'Çevrimdışı', hata: 'Eşitleme hatası' };
  const hepsi = (o) => KOLEKSIYONLAR.every((k) => o[k]);
  function durum() {
    if (!kok.PlanizeGiris || !kok.PlanizeGiris.acikMi()) return 'kapali';
    if (!uid || !db) return 'cevrimdisi';
    if (hata) return 'hata';
    if (kok.navigator && kok.navigator.onLine === false) return 'cevrimdisi';
    if (!hepsi(ilkGeldi)) return 'esitleniyor';
    if (!hepsi(sunucuda)) return (Date.now() - baslangic > 8000) ? 'cevrimdisi' : 'esitleniyor';
    if (yazimda || bekleyen > 0 || resimBekle.size > 0) return 'esitleniyor';
    return 'esit';
  }
  const yazi = (d) => ETIKET[d] + (d === 'cevrimdisi' && bekleyen ? ' · ' + bekleyen + ' bekliyor' : '');
  function aciklama(d) {

    if (d === 'cevrimdisi') return 'İnternet yok ya da bulutla bağlantı kurulamadı. Değişiklikler bu cihazda saklanıyor, bağlantı gelince eşitlenecek.' + (bekleyen ? ' Bekleyen değişiklik: ' + bekleyen + '.' : '');
    if (d === 'esitleniyor') return 'Değişiklikler bulutla eşitleniyor.';
    return 'Tüm değişiklikler bulutta.' + (sonEsit ? ' Son eşitleme: ' + new Date(sonEsit).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }) + '.' : '');
  }
  function etiketHTML() {
    const d = durum(); if (d === 'kapali') return '';
    return `<button class="esit-etiket" data-esit data-d="${d}" data-act="openSettings" title="${esc(aciklama(d))}"><i class="esit-nokta"></i><span class="esit-yazi">${esc(yazi(d))}</span></button>`;
  }
  function durumDegisti() {
    const d = durum();
    document.querySelectorAll('[data-esit]').forEach((e) => { e.setAttribute('data-d', d); e.title = aciklama(d); const y = e.querySelector('.esit-yazi'); if (y) y.textContent = yazi(d); });
    bildir({ tur: 'durum', durum: d });
  }
  function hataIsle(e) {

    if (kod === 'unavailable' || kod === 'deadline-exceeded' || kod === 'cancelled') { durumDegisti(); return; }
    const M = {
      'permission-denied': 'Bulutta okuma/yazma izni yok. Firestore kuralları bu hesabın verisine (users/{uid}) izin vermiyor olabilir.',

    if (hata.mesaj !== sonMesaj || Date.now() - sonMesajZamani > 60000) { sonMesaj = hata.mesaj; sonMesajZamani = Date.now(); bildir({ tur: 'hata', mesaj: hata.mesaj }); }
    durumDegisti();
    clearTimeout(yenidenTimer); yenidenTimer = setTimeout(() => { hata = null; planla(0); }, 60000);
  }

  // ---- Uzaktan gelen değişiklikler ----
  function cakismaKaydet(kay, id, str) {
    if (!db) return;
    let ad = id; try { const r = JSON.parse(str); ad = String(r.title || r.name || (r.text && String(r.text).slice(0, 60)) || id); } catch (e) { /* kimlik kalsın */ }
    try {
      sdk.setDoc(sdk.doc(sdk.collection(db, 'users', uid, 'cakismalar')), { kayit: kay.kol + '/' + id, tur: kay.etiket, ad, veri: str, ezildi: sdk.serverTimestamp(), c: CIHAZ }).catch(hataIsle);
      if (cakismaListe.length >= 50) sdk.deleteDoc(sdk.doc(db, 'users', uid, 'cakismalar', cakismaListe[cakismaListe.length - 1].id)).catch(() => {});
    } catch (e) { hataIsle(e); }
  }
  function uygulaYerele(degisim) {
    const anahtarlar = new Set();
    degisim.forEach((m, kay) => { try { kay.uygula(m).forEach((k) => anahtarlar.add(k)); } catch (e) { /* bozuk kayıt tüm eşitlemeyi durdurmasın */ } });
    anahtarlar.forEach((k) => PlanizeDepo.disaridanBildir({ key: k, newValue: PlanizeDepo.al(k) }));   // uygulama ekranı yeniler
  }
  function uzaktanGeldi(kol, snap) {
    ilkGeldi[kol] = true; sunucuda[kol] = !snap.metadata.fromCache;
    if (sunucuda[kol] && hata && hata.kod === 'permission-denied') hata = null;
    PlanizeDepo.kaydetIste();   // uygulamanın bekleyen (gecikmeli) kayıtları depoya yazılsın
    const degisim = new Map(), yerel = new Map(); let cakisma = false;
    snap.docChanges().forEach((ch) => {
      if (ch.type === 'removed') return;
      const d = ch.doc; if (d.metadata.hasPendingWrites) return;      // kendi yazdığımız, sunucuya henüz ulaşmamış
      const v = d.data(); if (!v || !v.g || !v.g.toMillis) return;
      const gMs = v.g.toMillis(), kay = kaynakBul(kol, d.id); if (!kay) return;
      const key = kol + '/' + d.id, tb = taban[key];
      if (tb && tb[1] === gMs) return;
      const uz = v.s ? null : (typeof v.veri === 'string' ? v.veri : null);
      if (!yerel.has(kay)) yerel.set(kay, kay.yerel());
      const ym = yerel.get(kay); if (ym === null) return;               // yerel veri bozuk: dokunma
      const ls = ym.has(d.id) ? ym.get(d.id) : null;
      const uh = uz === null ? '' : ozet(uz), lh = ls === null ? '' : ozet(ls);
      if (uh === lh) { taban[key] = [uh, gMs]; return; }
      if ((tb ? tb[0] : '') === lh) {   // yerel değişmemiş: uzaktakini al
        if (tb && tb[1] === 0 && ls !== null && uz !== null) cakismaKaydet(kay, d.id, ls);   // ilk açılıştan kalan yerel kayıt buluttakiyle ezilirken yerel sürüm yedeklenir (Geri getir ile dönülebilir)
        if (!degisim.has(kay)) degisim.set(kay, new Map()); degisim.get(kay).set(d.id, uz);
      }
      else { if (uz !== null) cakismaKaydet(kay, d.id, uz); cakisma = true; }                                                  // ikisi de değişmiş: yerel kazanır, uzaktaki yedeklenir
      taban[key] = [uh, gMs];
    });
    const uzak = new Map();
    snap.docs.forEach((d) => { const v = d.data(); if (!v || v.s || typeof v.veri !== 'string') return; uzak.set(d.id, { h: ozet(v.veri), g: v.g && v.g.toMillis ? v.g.toMillis() : 0, veri: v.veri }); });
    uzakVeri[kol] = uzak;
    if (degisim.size) { uygulaYerele(degisim); sonEsit = Date.now(); }
    tabanSoon(); durumDegisti();
    if (cakisma || sunucuda[kol]) planla(200);
  }

  // ---- Yerelden buluta ----
  function kirli() {
    const out = [];
    KAYNAKLAR.forEach((kay) => {
      const m = kay.yerel(); if (m === null) return;
      m.forEach((str, id) => { const key = kay.kol + '/' + id, h = ozet(str), tb = taban[key]; if (!tb || tb[0] !== h) out.push({ kay, id, key, str, h }); });
      if (kay.tek) return;
      Object.keys(taban).forEach((key) => {
        if (key.indexOf(kay.kol + '/') !== 0) return;
        const id = key.slice(kay.kol.length + 1);
        if (!m.has(id) && taban[key][0] !== '') out.push({ kay, id, key, str: null, h: '' });
      });
    });
    return out;
  }
  function planla(ms) { clearTimeout(planTimer); planTimer = setTimeout(gonder, ms == null ? 700 : ms); }
  async function gonder() {
    planTimer = null;
    if (!db || !uid || yazimda) return;
    PlanizeDepo.kaydetIste();
    let liste = kirli(); bekleyen = liste.length;
    // Güvenlik freni: bir kaynakta bir seferde çok sayıda silme (ör. depo boşalmış) kendiliğinden buluta gitmez
    const silmeler = liste.filter((o) => o.str === null);
    if (silmeler.length > 10 && !frenIzin) {
      const toplam = Object.keys(taban).filter((k) => k.indexOf(silmeler[0].kay.kol + '/') === 0).length || 1;
      if (silmeler.length > toplam / 2) { fren = silmeler.length; liste = liste.filter((o) => o.str !== null); }
    } else { fren = null; }
    if (!liste.length && !resimBekle.size) { durumDegisti(); return; }
    if (!hepsi(sunucuda) || (kok.navigator && kok.navigator.onLine === false)) { durumDegisti(); return; }
    yazimda = true; durumDegisti();
    resimIsaretle(liste);
    try {
      for (let i = 0; i < liste.length; i += 400) {
        const dilim = liste.slice(i, i + 400), b = sdk.writeBatch(db);
        dilim.forEach((o) => {
          const ref = sdk.doc(db, 'users', uid, o.kay.kol, o.id);
          b.set(ref, o.str === null ? { veri: null, s: true, g: sdk.serverTimestamp(), c: CIHAZ } : { veri: o.str, s: false, g: sdk.serverTimestamp(), c: CIHAZ });
        });
        await b.commit();
        dilim.forEach((o) => { taban[o.key] = [o.h, -1]; });
        tabanSoon();
      }
      await resimleriGonder();
      hata = null; sonEsit = Date.now();
    } catch (e) { hataIsle(e); }
    finally { yazimda = false; }
    frenIzin = false; bekleyen = kirli().length - (fren || 0); if (bekleyen < 0) bekleyen = 0;
    durumDegisti();
    if (bekleyen && !hata) planla(300);
  }

  // ---- Resimler: her resim ayrı belge users/{uid}/resimler/{id} = { veri: base64, tur, w, h, boyut, s, g, c } ----
  // Resim, onu kullanan kutucuk buluta gönderilirken yüklenir; başka cihazda yerelde yoksa ihtiyaç anında indirilir (VizyonResim.url).
  const resimKutuIdleri = (str) => { try { const k = JSON.parse(str), o = []; (k.blocks || []).forEach((b) => { if (b && b.type === 'image' && b.src != null) o.push(String(b.src)); }); return o; } catch (e) { return []; } };
  function resimYukle() {
    resimVar = new Set(); resimBekle = new Set();
    try { const o = JSON.parse(PlanizeDepo.al(KEY_RESIM) || 'null'); if (o && o.uid === uid) { resimVar = new Set(o.var || []); resimBekle = new Set(o.bekle || []); } } catch (e) { /* boş başla */ }
  }
  function resimKaydet() { try { PlanizeDepo.koy(KEY_RESIM, JSON.stringify({ uid, var: Array.from(resimVar), bekle: Array.from(resimBekle) })); } catch (e) { /* yer yoksa bir sonraki sefer */ } }
  function resimIsaretle(liste) {
    let d = false;
    liste.forEach((o) => { if (o.kay.kol === 'vizyon_kutucuklar' && o.str !== null) resimKutuIdleri(o.str).forEach((id) => { if (!resimVar.has(id) && !resimBekle.has(id)) { resimBekle.add(id); d = true; } }); });
    if (d) resimKaydet();
  }
  function resimleriHepsi() {   // taşıma (Adım 6): yerel Vizyon'daki tüm resimler yüklenecek diye işaretlenir
    const o = oku(K.vizyon); resimVar = new Set();
    if (o && Array.isArray(o.tiles)) o.tiles.forEach((k) => resimKutuIdleri(JSON.stringify(k)).forEach((id) => resimBekle.add(id)));
    resimKaydet();
  }
  const blobBase64 = (blob) => new Promise((coz, red) => { const r = new FileReader(); r.onload = () => coz(String(r.result).split(',')[1] || ''); r.onerror = () => red(r.error); r.readAsDataURL(blob); });
  function base64Blob(b64, tur) { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: tur || 'image/jpeg' }); }
  async function resimleriGonder() {
    if (!resimBekle.size || !kok.VizyonResim) return;
    for (const id of Array.from(resimBekle)) {
      if (resimVar.has(id)) { resimBekle.delete(id); continue; }
      const kayit = await kok.VizyonResim.al(id);
      if (!kayit || !kayit.blob) { resimBekle.delete(id); continue; }      // bu cihazda yok (başka cihazdan gelmiştir)
      let blob = kayit.blob, w = kayit.w, h = kayit.h;
      if (blob.size > kok.VizyonResim.AYAR.enBuyukBlob) {
        try { const k = await kok.VizyonResim.bulutIcin(blob); blob = k.blob; w = k.w || w; h = k.h || h; }
        catch (e) { resimBekle.delete(id); bildir({ tur: 'hata', mesaj: 'Bir resim bulut için fazla büyük olduğundan eşitlenemedi. Resmi daha küçük bir dosyayla değiştirin.' }); continue; }
      }
      await sdk.setDoc(sdk.doc(db, 'users', uid, 'resimler', id), { veri: await blobBase64(blob), tur: 'image/jpeg', w: w || 0, h: h || 0, boyut: blob.size, s: false, g: sdk.serverTimestamp(), c: CIHAZ });
      resimVar.add(id); resimBekle.delete(id); resimKaydet();
    }
    resimKaydet();
  }
  async function resimGetir(id) {   // Promise<{id, blob, w, h, boyut, createdAt} | null>
    if (!db || !uid || !sdk || !sdk.getDoc) return null;
    const son = resimYok.get(id); if (son && Date.now() - son < 15000) return null;
    try {
      const s = await sdk.getDoc(sdk.doc(db, 'users', uid, 'resimler', id));
      if (!s.exists()) { resimYok.set(id, Date.now()); return null; }
      const v = s.data(); if (v.s || typeof v.veri !== 'string') { resimYok.set(id, Date.now()); return null; }
      const blob = base64Blob(v.veri, v.tur); resimVar.add(id); resimKaydet();
      return { id, blob, w: v.w, h: v.h, boyut: blob.size, createdAt: Date.now() };
    } catch (e) { resimYok.set(id, Date.now() - 10000); return null; }       // bağlantı yok: kısa süre sonra yeniden denenir
  }
  function resimSil(id) {
    resimBekle.delete(id);
    if (!db || !uid || !resimVar.has(id)) return;
    resimVar.delete(id); resimKaydet();
    try { sdk.deleteDoc(sdk.doc(db, 'users', uid, 'resimler', id)).catch(() => {}); } catch (e) { /* yoksay */ }
  }

  // ---- Başlat / durdur ----
  function durdur() {
    nesil++; abonelikler.forEach((u) => { try { u(); } catch (e) { /* yoksay */ } }); abonelikler = [];
    clearTimeout(planTimer); clearTimeout(yenidenTimer);
    if (uid) tabanKaydet();
    uid = null; db = null; sunucuda = {}; ilkGeldi = {}; uzakVeri = {}; cakismaListe = []; hata = null; bekleyen = 0; yazimda = false; fren = null;
    durumDegisti();
  }
  async function baslat(yeniUid) {
    if (uid === yeniUid) return;
    durdur();
    uid = yeniUid; const benimNesil = nesil; baslangic = Date.now();
    taban = tabanYukle() || tabanTohumla(); tabanKaydet(); resimYukle();
    try {
      const app = kok.PlanizeGiris.uygulama(); if (!app) throw new Error('uygulama-yok');
      sdk = sdk || await zamanAsimi(import(kok.PlanizeGiris.adres + 'firebase-firestore.js'), 12000);
      if (benimNesil !== nesil) return;
      try { db = sdk.initializeFirestore(app, { localCache: sdk.persistentLocalCache({ tabManager: sdk.persistentMultipleTabManager() }) }); }
      catch (e) { db = sdk.getFirestore(app); }   // zaten kurulmuş ya da kalıcı önbellek desteklenmiyor
    } catch (e) {
      db = null; durumDegisti();                    // kitaplık yüklenemedi: uygulama yerelde çalışır; bağlantı gelince yeniden denenir
      clearTimeout(yenidenTimer); yenidenTimer = setTimeout(() => { const u = uid; uid = null; if (u) baslat(u); }, 20000);
      return;
    }
    KOLEKSIYONLAR.forEach((kol) => {
      abonelikler.push(sdk.onSnapshot(sdk.collection(db, 'users', uid, kol), { includeMetadataChanges: true },
        (s) => uzaktanGeldi(kol, s), (e) => {
          sunucuda[kol] = false; hataIsle(e);   // hata veren dinleyici kapanır: bir dakika sonra tüm abonelikler yeniden kurulur
          clearTimeout(yenidenTimer); yenidenTimer = setTimeout(() => { const u = uid; uid = null; if (u) baslat(u); }, 60000);
        }));
    });
    abonelikler.push(sdk.onSnapshot(sdk.query(sdk.collection(db, 'users', uid, 'cakismalar'), sdk.orderBy('ezildi', 'desc'), sdk.limit(50)), (s) => {
      cakismaListe = s.docs.map((d) => { const v = d.data(); return { id: d.id, kayit: v.kayit, tur: v.tur, ad: v.ad, veri: v.veri, ezildi: v.ezildi && v.ezildi.toMillis ? v.ezildi.toMillis() : Date.now() }; });
      bildir({ tur: 'cakisma' });
    }, () => { /* liste yalnızca bilgi; ana akış etkilenmez */ }));
    setTimeout(durumDegisti, 8200);
    durumDegisti();
  }
  function girisKontrol() {
    const g = kok.PlanizeGiris;
    if (g && g.acikMi() && g.uid()) baslat(g.uid()); else if (uid) durdur(); else durumDegisti();
  }

  // ---- Taşıma (Adım 6): bu cihazdaki verileri buluta gönder ----
  // Bulutta olup bu cihazda olmayan kayıtlar silinmez (bu cihaza da gelir); aynı kimlikli farklı kayıtlar bu cihazdaki sürümle değiştirilir. Yerel veri silinmez.
  const aktifMi = () => !!(uid && db);
  async function tasimaOzeti() {
    if (!aktifMi()) return { hazir: false, neden: 'Bulutla bağlantı kurulamadı. İnternet ve giriş durumunu kontrol edip tekrar deneyin.' };
    if (!hepsi(sunucuda)) return { hazir: false, neden: 'Bulutla bağlantı henüz kurulmadı. Birkaç saniye bekleyip tekrar deneyin.' };
    PlanizeDepo.kaydetIste();
    const say = {}; let degisecek = 0, uzakToplam = 0;
    KAYNAKLAR.forEach((kay) => {
      if (kay.tek) return;
      const m = kay.yerel() || new Map(), um = uzakVeri[kay.kol] || new Map();
      let yeni = 0, deg = 0, ayni = 0;
      m.forEach((str, id) => { const u = um.get(id); if (!u) yeni++; else if (u.h === ozet(str)) ayni++; else deg++; });
      say[kay.kol] = { yerel: m.size, yeni, degisecek: deg, ayni, bulutta: um.size };
      degisecek += deg; uzakToplam += um.size;
    });
    let resim = 0, resimBayt = 0; const idler = new Set(), vz = oku(K.vizyon);
    if (vz && Array.isArray(vz.tiles)) vz.tiles.forEach((k) => resimKutuIdleri(JSON.stringify(k)).forEach((id) => idler.add(id)));
    for (const id of idler) { const k = kok.VizyonResim && await kok.VizyonResim.al(id); if (k && k.blob) { resim++; resimBayt += k.blob.size; } }
    return { hazir: true, say, degisecek, uzakVar: uzakToplam > 0, uzakToplam, resim, resimBayt };
  }
  function bulutYedegi() {   // buluttaki mevcut verinin, uygulamanın yedek biçiminde dosyası (resimsiz)
    const liste = (kol) => Array.from((uzakVeri[kol] || new Map()).values()).map((u) => { try { return JSON.parse(u.veri); } catch (e) { return null; } }).filter(Boolean);
    const tekli = (kol, id) => { const u = (uzakVeri[kol] || new Map()).get(id); try { return u ? JSON.parse(u.veri) : null; } catch (e) { return null; } };
    const genel = tekli('ayarlar', 'genel') || {}, sira = tekli('ayarlar', 'vizyon') || {}, gecmis = tekli('gecmis', 'ana');
    const data = { tasks: liste('gorevler'), lists: liste('listeler'), notes: liste('notlar'), log: Array.isArray(gecmis) ? gecmis : [], archive: liste('arsiv'),
      vizyon: { surum: 1, boardOrder: Array.isArray(sira.boardOrder) ? sira.boardOrder : [], boards: liste('vizyon_panolar'), tiles: liste('vizyon_kutucuklar') } };
    if (typeof genel.calColor === 'number') data.calColor = genel.calColor;
    if (genel.theme) data.theme = genel.theme;
    if (genel.homeTheme) data.homeTheme = genel.homeTheme;
    const simdi = new Date();
    return { ad: 'planize-bulut-yedek-' + simdi.toISOString().slice(0, 10) + '.json', metin: JSON.stringify({ app: 'planim', version: 1, exportedAt: simdi.toISOString(), data }, null, 2) };
  }
  function tasimayaBasla() {   // Promise<{ ok, mesaj }>: gönderme bitince (ya da hata/zaman aşımında) çözülür
    PlanizeDepo.kaydetIste();
    KAYNAKLAR.forEach((kay) => {
      const m = kay.yerel(); if (!m) return;
      const um = uzakVeri[kay.kol] || new Map();
      m.forEach((str, id) => { const key = kay.kol + '/' + id, u = um.get(id); if (u && u.h === ozet(str)) taban[key] = [u.h, u.g]; else delete taban[key]; });   // buluttakiyle aynı olanlar yeniden yazılmaz
    });
    tabanKaydet(); resimleriHepsi(); hata = null; planla(0); durumDegisti();
    return new Promise((coz) => {
      const t0 = Date.now();
      const bak = () => {
        if (hata) { coz({ ok: false, mesaj: hata.mesaj }); return; }
        if (!planTimer && !yazimda && !resimBekle.size && kirli().length === 0) { coz({ ok: true }); return; }
        if (Date.now() - t0 > 600000) { coz({ ok: false, mesaj: 'Zaman aşımı; bağlantı gelince devam eder.' }); return; }
        setTimeout(bak, 500);
      };
      setTimeout(bak, 1000);
    });
  }

  // ---- Ayarlar bölümü ve dış işlevler ----
  function bolumHTML() {
    const d = durum(); if (d === 'kapali' || !uid) return '';
    const satirlar = cakismaListe.length ? cakismaListe.map((c) => `<div class="bk-row"><div class="bk-a"><div class="bk-d">${esc(c.ad)}</div>
        <div class="bk-s">${esc(c.tur || '')} · ${esc(new Date(c.ezildi).toLocaleString('tr-TR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }))}</div></div>
        <button class="btn-s sm" data-act="cakismaGeriGetir" data-v="${esc(c.id)}">Geri getir</button></div>`).join('')
      : '<div class="set-note">Henüz ezilen değişiklik yok.</div>';
    return `<section class="set-sec">
        <h3>Eşitleme</h3>
        <p class="set-p">${esc(aciklama(d))}</p>
        <div class="row-a"><button class="btn-s" data-act="esitleSimdi">Şimdi eşitle</button></div>

        <div class="row-a"><button class="btn-s" data-act="tasimaOzeti">Verilerimi buluta gönder</button></div>
        ${hata ? `<div class="warn">${esc(hata.mesaj)}</div>` : ''}

        <div class="set-sub">Ezilen değişiklikler <span>(son 50; başka cihazın değişikliği ezildiğinde burada saklanır)</span></div>
        ${satirlar}
      </section>`;
  }
  function geriGetir(id) {
    const c = cakismaListe.find((x) => x.id === id); if (!c || typeof c.veri !== 'string') return false;
    const [kol, kid] = String(c.kayit).split('/'); const kay = kaynakBul(kol, kid); if (!kay) return false;
    PlanizeDepo.kaydetIste();
    const ym = kay.yerel(), simdiki = ym && ym.get(kid);
    if (simdiki && simdiki !== c.veri) cakismaKaydet(kay, kid, simdiki);   // geri getirmeden önceki sürüm de saklansın
    uygulaYerele(new Map([[kay, new Map([[kid, c.veri]])]]));
    planla(100); return true;
  }

  PlanizeDepo.yazinca((o) => { if (uid && SENKRON_ANAHTAR.indexOf(o.anahtar) >= 0) { bekleyen = Math.max(bekleyen, 1); planla(); } });
  kok.addEventListener('online', () => { durumDegisti(); planla(0); });
  kok.addEventListener('offline', durumDegisti);
  kok.addEventListener('pagehide', () => { if (uid) tabanKaydet(); });
  kok.PlanizeEsitleme = {
    durum, etiketHTML, bolumHTML, cakismalar: () => cakismaListe.slice(), geriGetir, bekleyen: () => bekleyen,
    simdi() { hata = null; planla(0); durumDegisti(); },
    hepsiniGonder() { taban = {}; tabanKaydet(); resimleriHepsi(); planla(0); },   // Adım 6 (taşıma) için: tüm yerel kayıtlar gönderilecek diye işaretlenir
    frenOnayla() { frenIzin = true; planla(0); },
    resimGetir, resimSil, tasimaOzeti, bulutYedegi, tasimayaBasla, aktifMi,
    dinle: (f) => { dinleyiciler.push(f); }
  };
  if (kok.PlanizeGiris) { kok.PlanizeGiris.dinle(girisKontrol); girisKontrol(); }
})(window);

<style>
  /* 16a: yazı tipleri ve simgeler fonts klasöründen yüklenir; internet gerekmez */
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 700; font-display: swap; src: url('fonts/inter-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 700; font-display: swap; src: url('fonts/inter-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  /* Yalnızca uygulamada kullanılan 74 simge; dolu yıldız için FILL ekseni dahil */
  @font-face { font-family: 'Material Symbols Outlined'; font-style: normal; font-weight: 300; font-display: block; src: url('fonts/material-symbols-planize.woff2') format('woff2'); }

  html, body { margin: 0; padding: 0; }
  body { background: var(--govde-zemin, var(--zemin)); font-family: Inter, system-ui, sans-serif; }
  body[data-page="planner"] { background: var(--zemin); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  input, textarea, button, select { font-family: inherit; }
  input:focus, textarea:focus, select:focus { outline: none; }
  button { font-size: inherit; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.34); } 72% { transform: scale(0.9); } 100% { transform: scale(1); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pageOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-8px); } }
  .pg-in { animation: pageIn .26s ease; }
  .pg-out { animation: pageOut .2s ease forwards; }
  /* Yeni logo işareti (satır içi SVG; yazı tipine ve dış dosyaya bağlı değil) */
  .mark { display: block; width: 40px; height: 40px; flex: 0 0 40px; border-radius: 18.94%; }
  .mark svg { display: block; width: 100%; height: 100%; }
  .mark.on-dark { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--yazi) 48%, transparent); margin-right: 2px; }   /* koyu zeminde siyah kare kaybolmasın: yazı renginden türeyen ince halka (8b, seçenek A; ayrışma 3.2-4.5:1) */
  html:not([data-theme="klasik"]) #planner .mark { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--yazi) 48%, transparent); }   /* koyu Planlayıcı temalarında aynı halka; Klasik'in açık başlığında yok */  .ms { font-family: 'Material Symbols Outlined'; font-weight: 300; font-feature-settings: 'liga'; font-style: normal; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; }

  /* ================= ANASAYFA (koyu) ================= */
  #home { min-height: 100vh; background: var(--zemin); color: var(--yazi); display: flex; flex-direction: column; }
  #home ::-webkit-scrollbar { width: 9px; height: 9px; }
  #home ::-webkit-scrollbar-thumb { background: var(--kaydirma); border-radius: 8px; border: 2px solid var(--zemin); }
  #home ::placeholder { color: var(--yazi-pasif-2); }
  .h-head { display: flex; align-items: center; gap: 14px; padding: 18px 40px; border-bottom: 1px solid var(--cizgi-2); }
  .h-logo { position: relative; width: 42px; height: 38px; flex: 0 0 42px; }
  .h-logo span { position: absolute; top: 50%; transform: translateY(-50%); font-family: 'Playfair Display', Georgia, serif; font-size: 34px; line-height: 1; }
  .h-logo .t { left: 0; font-weight: 600; color: var(--logo-t); }
  .h-logo .k { left: 15px; font-weight: 500; color: var(--vurgu); }
  .h-nav { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
  .h-ni { position: relative; display: flex; align-items: center; gap: 7px; padding: 9px 15px 11px; border: none; background: transparent; border-radius: 11px;
    font-size: 14.5px; font-weight: 500; white-space: nowrap; color: var(--yazi-soluk); cursor: pointer; }
  button.h-ni:hover { background: var(--yuzey-2); color: var(--vurgu-acik); }
  .h-ni.on { font-weight: 600; color: var(--vurgu-acik); background: var(--yuzey-2); cursor: default; }
  .h-ni.on::after { content: ''; position: absolute; left: 15px; right: 15px; bottom: 4px; height: 2px; border-radius: 2px; background: var(--vurgu); }
  .h-ni.locked { color: var(--yazi-pasif-3); cursor: not-allowed; }
  .h-ni.locked .ms { font-size: 15px; }
  .h-sp { flex: 1; min-width: 12px; }
  .h-search { display: flex; align-items: center; gap: 8px; flex: 0 1 214px; min-width: 0; max-width: 214px; background: var(--yuzey-2); border: 1px solid var(--cizgi); border-radius: 12px; padding: 8px 12px; }
  .h-search .ms { font-size: 18px; color: var(--yazi-pasif); }
  .h-search input { flex: 1; min-width: 0; border: none; background: transparent; font-size: 13.5px; color: var(--yazi); padding: 1px 0; }
  .h-main { flex: 1; padding: 26px 40px 44px; }
  .h-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: 172px; gap: 18px; }
  .h-card { grid-column: span 2; grid-row: span 2; background: var(--kart-zemin); border: 1px solid var(--cizgi); border-radius: 20px; }
  .h-slot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; border-color: var(--cizgi-3); }
  .h-slot.wide { grid-column: span 4; }
  .h-slot .ms { font-size: 30px; color: var(--yazi-pasif-4); }
  .h-slot .lbl { font-size: 12.5px; font-weight: 500; color: var(--yazi-pasif); }
  .h-cal { display: flex; flex-direction: column; padding: 16px 18px 18px; }
  .h-chead { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }

  /* ================= PLANLAYICI (açık) ================= */
  #planner { display: flex; height: 100vh; min-height: 560px; background: var(--zemin); color: var(--yazi); }
  #planner ::-webkit-scrollbar { width: 10px; height: 10px; }
  #planner ::-webkit-scrollbar-thumb { background: var(--kaydirma); border-radius: 8px; border: 3px solid var(--zemin); }
  #planner ::placeholder { color: var(--yazi-pasif-3); }
  /* Ortak üst çubuk (Anasayfa ve Vizyon Panosu ile aynı ölçüler ve sınıflar), yalnızca Planlayıcı'nın kendi renkleriyle */
  #planner { flex-direction: column; }
  #pl-body { display: flex; flex: 1; min-height: 0; }
  /* Ölçüler (yan boşluk, yükseklik, logo, menü, düğme) Anasayfa'daki .h-head / .mark / .h-ni / .h-gear ile aynıdır; burada yalnızca renk var */
  #planner .h-head { flex: 0 0 auto; background: var(--yuzey); border-bottom: 1px solid var(--cizgi); position: relative; z-index: 7; }
  #planner .h-ni { color: var(--yazi-soluk); }
  #planner button.h-ni:hover { background: var(--yuzey-2); color: var(--vurgu); }
  #planner .h-ni.on { color: var(--vurgu); background: var(--vurgu-yumusak); }
  #planner .h-ni.on::after { background: var(--vurgu); }
  #planner .h-ni.locked { color: var(--yazi-pasif-3); }
  #planner .h-nb { border-color: var(--cizgi); background: var(--yuzey); color: var(--yazi-soluk-2); }
  #planner .h-nb:hover { background: var(--yuzey-2); color: var(--vurgu); }

  .menu { position: absolute; top: calc(100% + 8px); left: 0; z-index: 40; width: 100%; min-width: 232px; background: var(--yuzey); border: 1px solid var(--cizgi); border-radius: 16px;

  .lists-h { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--yazi-pasif-3); padding: 0 14px 8px; }

  .lbtn { display: flex; align-items: center; gap: 11px; flex: 1; min-width: 0; padding: 10px 12px; border: none; background: transparent; border-radius: 13px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--yazi-soluk); }

  #pl-main { flex: 1; min-width: 0; overflow-y: auto; }
